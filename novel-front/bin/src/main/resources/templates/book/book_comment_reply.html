<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{comment.replyArea}">Khu vực trả lời bình luận</title>
    <link href="/css/main.css" rel="stylesheet"/>
    <link href="/css/book.css" rel="stylesheet"/>
</head>
<body id="bookCommentPage"
      data-comment-mode="reply"
      th:attr="data-comment-unit=#{comment.itemUnit},
               data-comment-trainee=#{comment.trainee},
               data-comment-reader=#{comment.reader},
               data-comment-floor=#{comment.floor},
               data-comment-unlike=#{comment.unlike},
               data-comment-like=#{comment.like},
               data-network-error=#{auth.networkError}">

<input type="hidden" id="commentId" th:value="${commentId}"/>

<div th:replace="common/top :: top('')"></div>

<div class="main box_center cf mb50">
    <div class="channelBookContent cf">
        <div class="wrap_left fl">
            <div class="wrap_bg">
                <div class="pad20">
                    <div class="bookComment">
                        <div class="book_tit">
                            <div class="fl">
                                <h3 th:text="#{comment.replyArea}">Khu vực trả lời bình luận</h3>
                                <span id="bookCommentTotal">(0)</span>
                            </div>
                            <a class="fr" href="#txtComment" th:text="#{comment.publishReply}">Gửi trả lời</a>
                        </div>
                        <blockquote class="layui-elem-quote" th:text="${commentContent}"></blockquote>
                        <div class="no_comment" id="noCommentPanel" style="display: none;">
                            <img src="/images/no_comment.png" alt=""/>
                            <span class="block" th:text="#{comment.emptyReply}">Chưa có trả lời</span>
                        </div>
                        <div class="commentBar" id="commentPanel"></div>
                        <div class="pageBox cf mt15 mr10" id="commentPage"></div>

                        <div class="reply_bar" id="reply_bar">
                            <div class="tit">
                                <span class="fl font16" th:text="#{comment.publishReply}">Gửi trả lời</span>
                                <span class="fr black9" style="display:none;">
                                    <span th:text="#{comment.loginRequired}">Vui lòng đăng nhập trước</span>
                                    <a class="orange" href="/user/login.html" th:text="#{site.login}">Đăng nhập</a>
                                    <em class="ml10 mr10">|</em>
                                    <a class="orange" href="/user/register.html" th:text="#{site.register}">Đăng ký</a>
                                </span>
                            </div>
                            <textarea name="txtComment" rows="2" cols="20" id="txtComment" class="replay_text"
                                      th:placeholder="#{comment.placeholder}"></textarea>
                            <div class="reply_btn">
                                <span class="fl black9">
                                    <em class="ml5" id="emCommentNum">0/1000</em>
                                    <span th:text="#{comment.characters}">ký tự</span>
                                </span>
                                <span class="fr">
                                    <a class="btn_ora" href="#publish-reply"
                                       data-book-detail-action="publish-reply"
                                       th:text="#{comment.publishReply}">Gửi trả lời</a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/bookdetail.js" type="text/javascript"></script>
<script src="/javascript/book-comment-page.js" type="text/javascript"></script>
</body>
</html>
