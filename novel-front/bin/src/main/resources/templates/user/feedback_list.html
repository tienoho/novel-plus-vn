<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{user.feedback}+'_'+${application.website.name}"></title>
    <link rel="stylesheet" href="/css/user.css"/>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>
<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/user/userinfo.html" th:text="#{user.center}">Tài khoản của tôi</a></li>
                <li><a class="link_4" href="/user/favorites.html" th:text="#{user.bookshelf}">Tủ sách</a></li>
                <li><a class="link_6" href="/user/comment.html" th:text="#{user.comments}">Bình luận của tôi</a></li>
                <li><a class="link_7 on" href="/user/feedback_list.html" th:text="#{user.feedback}">Phản hồi của tôi</a></li>
                <li><a class="link_8" href="/user/setup.html" th:text="#{user.settings}">Cài đặt tài khoản</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl" th:text="#{user.feedback}">Phản hồi của tôi</h2>
                    <div class="fr"><a href="/user/feedback.html" class="btn_red" th:text="#{user.feedback.write}">Viết phản hồi</a></div>
                </div>

                <dl class="feedback_list cf">
                    <dd id="feedbackList">


                    </dd>
                </dl>
                <div class="cf">
                    <div class="help_bar fl hidden">
                        <a href=""><span class="txt" th:text="#{user.feedback.faq}">Câu hỏi thường gặp của độc giả</span></a>
                    </div>
                    <div class="pageBox cf" id="feedbackPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>
<div th:replace="common/js :: js"></div>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    search(1, 5);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/user/listUserFeedBackByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var feedbackList = data.data.list;
                    if (feedbackList.length > 0) {
                        var feedbackFragment = document.createDocumentFragment();
                        for (var i = 0; i < feedbackList.length; i++) {
                            var feedback = feedbackList[i];
                            var feedbackItem = NovelSafeDom.element("div", "comment_list clear");
                            var feedbackListNode = NovelSafeDom.element("ul");
                            var meta = NovelSafeDom.element("li", "li_1");
                            meta.appendChild(NovelSafeDom.element("span", "user_name fl"));
                            meta.appendChild(NovelSafeDom.element("span", "time fl", feedback.createTime));
                            feedbackListNode.appendChild(meta);
                            feedbackListNode.appendChild(NovelSafeDom.element("li", "li_2", feedback.content));
                            feedbackItem.appendChild(feedbackListNode);
                            feedbackFragment.appendChild(feedbackItem);
                        }
                        document.getElementById("feedbackList").replaceChildren(feedbackFragment);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'feedbackPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    novelAlertText(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }
</script>
</body>
</html>
