server:
  port: 8083

novel:
  payment:
    vietqr:
      enabled: ${VIETQR_ENABLED:false}
      bank-bin: ${VIETQR_BANK_BIN:disabled}
      account-no: ${VIETQR_ACCOUNT_NO:disabled}
      account-name: ${VIETQR_ACCOUNT_NAME:disabled}
      secret-token: ${VIETQR_WEBHOOK_SECRET:disabled}

spring:
  profiles:
    active: dev
    include: website,vnpay,oss

jwt:
  secret: ${JWT_SECRET:change-me-with-at-least-32-random-characters}
  expiration: 604800

#Mật khẩu quản lý bộ nhớ đệm
cache:
  manager:
    password: ${CACHE_MANAGER_PASSWORD:change-me-cache-password}


# Chống tấn công XSS
xss:
  # Công tắc lọc
  enabled: true
  # Đường dẫn loại trừ (nhiều giá trị cách nhau bằng dấu phẩy)
  excludes: /system/notice/*
  # Đường dẫn cần lọc (nhiều giá trị cách nhau bằng dấu phẩy)
  urlPatterns: /book/addCommentReply,/book/addBookComment,/user/addFeedBack,/author/addBook,/author/addBookContent,/author/updateBookContent,/author/drafts/autosave,/author/register.html


author:
  editor:
    schedule-batch-size: ${AUTHOR_EDITOR_SCHEDULE_BATCH_SIZE:20}
    schedule-delay-ms: ${AUTHOR_EDITOR_SCHEDULE_DELAY_MS:30000}
    schedule-initial-delay-ms: ${AUTHOR_EDITOR_SCHEDULE_INITIAL_DELAY_MS:30000}
  income:
    #Tỷ lệ thu nhập sau thuế
    tax-rate: 0.9
    #Tỷ lệ chia doanh thu
    share-proportion: 0.7
    #Tỷ lệ quy đổi (CNY)
    exchange-proportion: 0.01
  payout:
    # Chỉ bật sau khi cấu hình mã hóa PII, quy trình duyệt KYC và vận hành chuyển khoản.
    enabled: ${AUTHOR_PAYOUT_ENABLED:false}
    vnd-per-xu: ${AUTHOR_PAYOUT_VND_PER_XU:10}
    minimum-xu: ${AUTHOR_PAYOUT_MIN_XU:100000}
    request-open-day: ${AUTHOR_PAYOUT_REQUEST_OPEN_DAY:1}
    request-close-day: ${AUTHOR_PAYOUT_REQUEST_CLOSE_DAY:10}

notification:
  chapter:
    schedule-delay-ms: ${NOTIFICATION_CHAPTER_SCHEDULE_DELAY_MS:15000}
    schedule-initial-delay-ms: ${NOTIFICATION_CHAPTER_SCHEDULE_INITIAL_DELAY_MS:15000}

security:
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY:disabled}

#Quy tắc định giá chương
book:
  price:
    #Số chữ
    word-count: 1000
    #Giá trị (Xu)
    value: 5


--- #--------------------- Cấu hình Spring AI ----------------------
spring:
  ai:
    openai:
      image:
        enabled: ${AI_IMAGE_ENABLED:false}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${OPENAI_API_KEY:disabled}
        options:
          model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
          response_format: URL
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}


