server:
  port: 8083

spring:
  profiles:
    active: dev
    include: website,vnpay,oss

jwt:
  secret: ${JWT_SECRET:change-me-with-at-least-32-random-characters}
  expiration: 604800

#Mật khẩu quản lý bộ nhớ đệm
cache:
  manager:
    password: ${CACHE_MANAGER_PASSWORD:change-me-cache-password}


# Chống tấn công XSS
xss:
  # Công tắc lọc
  enabled: true
  # Đường dẫn loại trừ (nhiều giá trị cách nhau bằng dấu phẩy)
  excludes: /system/notice/*
  # Đường dẫn cần lọc (nhiều giá trị cách nhau bằng dấu phẩy)
  urlPatterns: /book/addCommentReply,/book/addBookComment,/user/addFeedBack,/author/addBook,/author/addBookContent,/author/updateBookContent,/author/register.html


author:
  income:
    #Tỷ lệ thu nhập sau thuế
    tax-rate: 0.9
    #Tỷ lệ chia doanh thu
    share-proportion: 0.7
    #Tỷ lệ quy đổi (CNY)
    exchange-proportion: 0.01

#Quy tắc định giá chương
book:
  price:
    #Số chữ
    word-count: 1000
    #Giá trị (Xu)
    value: 5


--- #--------------------- Cấu hình Spring AI ----------------------
spring:
  ai:
    openai:
      image:
        enabled: ${AI_IMAGE_ENABLED:false}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com}
        api-key: ${OPENAI_API_KEY:disabled}
        options:
          model: ${OPENAI_IMAGE_MODEL:gpt-image-1}
          response_format: URL
      api-key: ${OPENAI_API_KEY:disabled}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}


