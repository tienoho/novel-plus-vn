<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
    <title th:text="#{reader.ticket.page.title}+'_'+${application.website.name}">Vé đọc và thuê bao</title>
    <div th:include="mobile/common/css :: css"></div>
    <link rel="stylesheet" href="/css/reading-ticket.css"/>
</head>
<body class="reading-ticket-mobile-body">
<header class="reading-ticket-mobile-header">
    <a href="/user/userinfo.html" th:aria-label="#{reader.back}">&lsaquo;</a>
    <strong th:text="#{reader.ticket.page.title}">Vé đọc và thuê bao</strong>
    <a href="/" th:aria-label="#{site.home}"><i class="layui-icon">&#xe68e;</i></a>
</header>
<main id="readingTicketAccountApp" class="reading-ticket-shell reading-ticket-shell-mobile"
      data-account-endpoint="/user/reading-tickets"
      data-ledger-endpoint="/user/reading-tickets/ledger"
      data-lots-endpoint="/user/reading-tickets/lots"
      data-plans-endpoint="/user/reading-subscriptions/plans"
      data-current-endpoint="/user/reading-subscriptions/current"
      data-checkout-endpoint="/user/reading-subscriptions/checkouts"
      data-channels-endpoint="/pay/channels"
      data-grants-endpoint="/user/reading-subscriptions/{id}/period-grants"
      data-mandate-endpoint="/user/reading-subscriptions/mandates/vnpay"
      data-mandate-state-endpoint="/user/reading-subscriptions/mandates/vnpay/current"
      data-renewal-settings-endpoint="/user/reading-subscriptions/{id}/renewal-settings"
      data-price-consent-endpoint="/user/reading-subscriptions/{id}/price-consents"
      data-cancel-endpoint="/user/reading-subscriptions/{id}/cancel"
      data-login-url="/user/login.html"
      th:data-loading="#{reader.ticket.loading}"
      th:data-load-failed="#{reader.ticket.loadFailed}"
      th:data-unit="#{reader.ticket.unit}"
      th:data-month-unit="#{reader.ticket.monthUnit}"
      th:data-day-unit="#{reader.ticket.dayUnit}"
      th:data-validity="#{reader.ticket.validity}"
      th:data-checkout-unavailable="#{reader.ticket.checkoutUnavailable}"
      th:data-price-unavailable="#{reader.ticket.priceUnavailable}"
      th:data-price-xu="#{reader.ticket.priceXu}"
      th:data-pay-vnpay="#{reader.ticket.checkout.vnpay}"
      th:data-pay-vietqr="#{reader.ticket.checkout.vietqr}"
      th:data-checkout-creating="#{reader.ticket.checkout.creating}"
      th:data-checkout-failed="#{reader.ticket.checkout.failed}"
      th:data-checkout-uncertain="#{reader.ticket.checkout.uncertain}"
      th:data-checkout-qr-ready="#{reader.ticket.checkout.qrReady}"
      th:data-checkout-qr-alt="#{reader.ticket.checkout.qrAlt}"
      th:data-plans-empty="#{reader.ticket.plans.empty}"
      th:data-current-none="#{reader.ticket.current.none}"
      th:data-current-status="#{reader.ticket.current.status}"
      th:data-next-grant="#{reader.ticket.current.nextGrant}"
      th:data-next-renewal="#{reader.ticket.current.nextRenewal}"
      th:data-end-at="#{reader.ticket.current.endAt}"
      th:data-status-active="#{reader.ticket.status.active}"
      th:data-status-past-due="#{reader.ticket.status.pastDue}"
      th:data-status-pending-price-consent="#{reader.ticket.status.pendingPriceConsent}"
      th:data-status-cancel-at-period-end="#{reader.ticket.status.cancelAtPeriodEnd}"
      th:data-status-paused="#{reader.ticket.status.paused}"
      th:data-status-cancelled="#{reader.ticket.status.cancelled}"
      th:data-status-expired="#{reader.ticket.status.expired}"
      th:data-grants-empty="#{reader.ticket.grants.empty}"
      th:data-period="#{reader.ticket.grants.period}"
      th:data-expires-at="#{reader.ticket.grants.expiresAt}"
      th:data-ledger-empty="#{reader.ticket.ledger.empty}"
      th:data-lots-empty="#{reader.ticket.lots.empty}"
      th:data-renewal-enable="#{reader.ticket.renewal.enable}"
      th:data-renewal-help="#{reader.ticket.renewal.help}"
      th:data-renewal-current="#{reader.ticket.renewal.current}"
      th:data-renewal-on="#{reader.ticket.renewal.on}"
      th:data-renewal-off="#{reader.ticket.renewal.off}"
      th:data-renewal-primary="#{reader.ticket.renewal.primary}"
      th:data-renewal-fallback="#{reader.ticket.renewal.fallback}"
      th:data-renewal-save="#{reader.ticket.renewal.save}"
      th:data-renewal-saving="#{reader.ticket.renewal.saving}"
      th:data-renewal-saved="#{reader.ticket.renewal.saved}"
      th:data-renewal-failed="#{reader.ticket.renewal.failed}"
      th:data-funding-wallet="#{reader.ticket.funding.wallet}"
      th:data-funding-vnpay="#{reader.ticket.funding.vnpay}"
      th:data-funding-none="#{reader.ticket.funding.none}"
      th:data-mandate-authorize="#{reader.ticket.mandate.authorize}"
      th:data-mandate-continue="#{reader.ticket.mandate.continue}"
      th:data-mandate-creating="#{reader.ticket.mandate.creating}"
      th:data-mandate-redirecting="#{reader.ticket.mandate.redirecting}"
      th:data-mandate-uncertain="#{reader.ticket.mandate.uncertain}"
      th:data-mandate-unavailable="#{reader.ticket.mandate.unavailable}"
      th:data-mandate-failed="#{reader.ticket.mandate.failed}"
      th:data-mandate-active="#{reader.ticket.mandate.active}"
      th:data-mandate-pending="#{reader.ticket.mandate.pending}"
      th:data-mandate-revoke-pending="#{reader.ticket.mandate.revokePending}"
      th:data-mandate-success="#{reader.ticket.mandate.success}"
      th:data-mandate-processing="#{reader.ticket.mandate.processing}"
      th:data-consent-required="#{reader.ticket.consent.required}"
      th:data-consent-action="#{reader.ticket.consent.action}"
      th:data-consent-saving="#{reader.ticket.consent.saving}"
      th:data-consent-success="#{reader.ticket.consent.success}"
      th:data-cancel-action="#{reader.ticket.cancel.action}"
      th:data-cancel-confirm="#{reader.ticket.cancel.confirm}"
      th:data-cancel-saving="#{reader.ticket.cancel.saving}"
      th:data-cancel-success="#{reader.ticket.cancel.success}">
    <section class="reading-ticket-heading">
        <h1 th:text="#{reader.ticket.page.title}">Vé đọc và thuê bao</h1>
        <p th:text="#{reader.ticket.page.description}">Theo dõi số dư và quyền lợi đọc của bạn.</p>
    </section>
    <section class="reading-ticket-card reading-ticket-balance-card" aria-labelledby="readingTicketBalanceHeading">
        <div>
            <h2 id="readingTicketBalanceHeading" th:text="#{reader.ticket.balance}">Số dư Vé đọc</h2>
            <p th:text="#{reader.ticket.balance.help}">Mỗi Vé đọc mở vĩnh viễn một chương.</p>
        </div>
        <div class="reading-ticket-balance"><span id="readingTicketBalance">–</span> <span th:text="#{reader.ticket.unit}">Vé đọc</span></div>
    </section>
    <p id="readingTicketAccountStatus" class="reading-ticket-status" role="status" aria-live="polite"></p>
    <section class="reading-ticket-section" aria-labelledby="readingTicketCurrentHeading">
        <h2 id="readingTicketCurrentHeading" th:text="#{reader.ticket.current.title}">Thuê bao hiện tại</h2>
        <div id="readingTicketCurrent" class="reading-ticket-current"></div>
    </section>
    <section class="reading-ticket-section" aria-labelledby="readingTicketPlansHeading">
        <h2 id="readingTicketPlansHeading" th:text="#{reader.ticket.plans.title}">Các gói quyền lợi</h2>
        <div id="readingTicketPlans" class="reading-ticket-plans"></div>
        <p id="readingTicketCheckoutStatus" class="reading-ticket-status" role="status" aria-live="polite" hidden></p>
        <div id="readingTicketCheckoutQr" class="reading-ticket-checkout-qr"></div>
    </section>
    <section class="reading-ticket-section" aria-labelledby="readingTicketGrantsHeading">
        <h2 id="readingTicketGrantsHeading" th:text="#{reader.ticket.grants.title}">Lịch sử cấp Vé theo kỳ</h2>
        <div id="readingTicketGrants" class="reading-ticket-grants"></div>
    </section>
    <section class="reading-ticket-section" aria-labelledby="readingTicketLedgerHeading">
        <h2 id="readingTicketLedgerHeading" th:text="#{reader.ticket.ledger.title}">Lịch sử giao dịch Vé đọc</h2>
        <div id="readingTicketLedgerHistory" class="reading-ticket-ledger"></div>
    </section>
    <section class="reading-ticket-section" aria-labelledby="readingTicketLotsHeading">
        <h2 id="readingTicketLotsHeading" th:text="#{reader.ticket.lots.title}">Lịch sử lô Vé đọc</h2>
        <div id="readingTicketLotHistory" class="reading-ticket-lots"></div>
    </section>
</main>
<div th:replace="mobile/common/footer :: footer"></div>
<div th:replace="mobile/common/js :: js"></div>
<script src="/javascript/reading-ticket.js?v=3" type="text/javascript"></script>
</body>
</html>
