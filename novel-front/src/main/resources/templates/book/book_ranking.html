<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="#{book.ranking}+'_'+${application.website.name}"></title>
    <meta name="keywords" th:content="#{book.ranking}+','+#{book.ranking.views}+','+#{book.ranking.new}+','+#{book.ranking.updates}"/>
    <meta name="description" th:content="#{book.seo.list.description(${application.website.name})}"/>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="/css/book.css"/>
</head>
<body id="bookRankingPage"
      th:attr="data-ten-thousand-unit=#{book.tenThousandUnit},
               data-rank-views=#{book.ranking.views},
               data-rank-new=#{book.ranking.new},
               data-rank-updates=#{book.ranking.updates},
               data-rank-comments=#{book.ranking.comments},
               data-network-error=#{auth.networkError}">

<div th:replace="common/top :: top('2')"></div>
<div th:replace="common/monthly_ticket :: ranking_widget"></div>
<main class="main box_center cf mb50">
    <div class="channelRankingContent cf">
        <div class="wrap_left fl">
            <div class="wrap_bg">
                <div class="pad20">
                    <div class="book_tit">
                        <div class="fl">
                            <h3 class="font26 mt5 mb5" id="rankName" th:text="#{book.ranking.views}">Xếp hạng lượt xem</h3>
                        </div>
                    </div>
                    <div class="updateTable rankTable">
                        <table cellpadding="0" cellspacing="0">
                            <thead>
                            <tr>
                                <th class="rank" th:text="#{book.rank}">Hạng</th>
                                <th class="style" th:text="#{book.category}">Danh mục truyện</th>
                                <th class="name" th:text="#{book.name}">Tên truyện</th>
                                <th class="chapter" th:text="#{book.latest}">Chương mới nhất</th>
                                <th class="author" th:text="#{book.author}">Tác giả</th>
                                <th class="word" th:text="#{book.wordCount}">Số chữ</th>
                            </tr>
                            </thead>
                            <tbody id="bookRankList"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <aside class="wrap_right fr">
            <div class="wrap_inner wrap_right_cont mb20">
                <div class="title cf noborder">
                    <h3 class="on" th:text="#{book.ranking}">Bảng xếp hạng truyện</h3>
                </div>
                <div class="rightList2">
                    <ul id="rankType">
                        <li><a class="on" href="#rank-views" data-rank-type="0" th:text="#{book.ranking.views}">Xếp hạng lượt xem</a></li>
                        <li><a href="#rank-new" data-rank-type="1" th:text="#{book.ranking.new}">Xếp hạng truyện mới</a></li>
                        <li><a href="#rank-updates" data-rank-type="2" th:text="#{book.ranking.updates}">Xếp hạng cập nhật</a></li>
                        <li><a href="#rank-comments" data-rank-type="3" th:text="#{book.ranking.comments}">Xếp hạng bình luận</a></li>
                    </ul>
                </div>
            </div>
        </aside>
    </div>
</main>

<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/book-ranking-page.js" type="text/javascript"></script>
</body>
</html>
