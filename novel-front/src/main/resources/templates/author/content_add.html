        <style>
            /* Kiểu vùng soạn thảo. */
            .editor-container {
                margin: 10px 0px;
                padding: 20px;
                background: #fff;
                border-radius: 8px;
                box-shadow: 0 2px 12px 0 rgba(0, 0, 0, .1);
            }

            /* Kiểu ô nội dung. */
            #bookContent {
                width: 93%;
                height: 400px;
                padding: 15px;
                border: 1px solid #e6e6e6;
                border-radius: 4px;
                font-size: 14px;
                line-height: 1.6;
                resize: vertical;
            }

            /* Kiểu thanh công cụ. */
            .ai-toolbar {
                margin-bottom: 15px;
                display: flex;
                gap: 10px; /* Khoảng cách nút. */
            }

            /* Kiểu nút liên kết tùy chỉnh. */
            .ai-link {
                display: inline-block;
                padding: 10px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                color: #fff;
                text-decoration: none;
                cursor: pointer;
                transition: all 0.3s ease;
                background: linear-gradient(135deg, #6a11cb, #2575fc);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* Hiệu ứng khi rê chuột. */
            .ai-link:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            }

            /* Hiệu ứng khi nhấn nút. */
            .ai-link:active {
                transform: translateY(0);
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }

            /* Màu của từng thao tác AI. */
            .ai-link.expand {
                background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            }

            .ai-link.condense {
                background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            }

            .ai-link.continue {
                background: linear-gradient(135deg, #f6d365, #fda085);
            }

            .ai-link.polish {
                background: linear-gradient(135deg, #ff6f61, #ffcc00);
            }
        </style>
    </head>
</head>

<script language="javascript" type="text/javascript" th:inline="javascript">
    const chapterNameRequiredText = /*[[#{author.chapter.name.required}]]*/ 'Tên chương không được để trống.';
    const chapterContentRequiredText = /*[[#{author.chapter.content.required}]]*/ 'Nội dung chương không được để trống.';
    const selectTextMessage = /*[[#{ai.selectText}]]*/ 'Vui lòng chọn đoạn văn cần xử lý.';
    const ratioPromptText = /*[[#{ai.ratio.prompt}]]*/ 'Nhập tỷ lệ';
    const ratioInvalidText = /*[[#{ai.ratio.invalid}]]*/ 'Vui lòng nhập tỷ lệ hợp lệ.';
    const lengthPromptText = /*[[#{ai.length.prompt}]]*/ 'Nhập độ dài viết tiếp (ký tự)';
    const lengthInvalidText = /*[[#{ai.length.invalid}]]*/ 'Vui lòng nhập độ dài hợp lệ.';
    const confirmText = /*[[#{common.confirm}]]*/ 'Đồng ý';
    const cancelText = /*[[#{common.cancel}]]*/ 'Hủy';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    const draftMessages = {
        saving: /*[[#{author.draft.saving}]]*/ 'Đang tự lưu...',
        saved: /*[[#{author.draft.saved}]]*/ 'Đã tự lưu',
        restored: /*[[#{author.draft.restored}]]*/ 'Đã khôi phục bản nháp',
        saveFailed: /*[[#{author.draft.saveFailed}]]*/ 'Không thể lưu bản nháp',
        publishFailed: /*[[#{author.draft.publishFailed}]]*/ 'Không thể xuất bản chương',
        scheduled: /*[[#{author.draft.scheduled}]]*/ 'Đã lên lịch xuất bản',
        scheduleRequired: /*[[#{author.draft.scheduleRequired}]]*/ 'Vui lòng chọn thời gian xuất bản',
        scheduleFailed: /*[[#{author.draft.scheduleFailed}]]*/ 'Không thể lên lịch xuất bản',
        scheduleCancelled: /*[[#{author.draft.scheduleCancelled}]]*/ 'Đã hủy lịch xuất bản',
        scheduledReadOnly: /*[[#{author.draft.scheduledReadOnly}]]*/ 'Bản nháp đã lên lịch; hãy hủy lịch trước khi chỉnh sửa',
        restoreFailed: /*[[#{author.draft.restoreFailed}]]*/ 'Không thể tải bản nháp; mã bản nháp vẫn được giữ để thử lại'
    };

    var bookId = getSearchString("bookId");
    var authorEditor = NovelAuthorEditor.create({
        bookId: bookId,
        indexId: null,
        titleSelector: '#bookIndex',
        contentSelector: '#bookContent',
        vipSelector: 'input[name=isVip]',
        statusSelector: '#draftStatus',
        saveSelector: '#btnSaveDraft',
        publishSelector: '#btnRegister',
        scheduleSelector: '#draftScheduleAt',
        scheduleButtonSelector: '#btnScheduleDraft',
        cancelScheduleSelector: '#btnCancelSchedule',
        redirectUrl: '/author/index_list.html?bookId=' + bookId,
        messages: draftMessages
    });
    authorEditor.init();


    var lock = false;

    function addBookContent() {

        if (lock) {
            return;
        }
        lock = true;


        var indexName = $("#bookIndex").val();
        if (!indexName) {
            $("#LabErr").html(chapterNameRequiredText);
            lock = false;
            return;
        }

        var content = $("#bookContent").val();
        if (!content) {
            $("#LabErr").html(chapterContentRequiredText);
            lock = false;
            return;
        }


        var isVip = $("input:checked[name=isVip]").val();


        $.ajax({
            type: "POST",
            url: "/author/addBookContent",
            data: {'bookId': bookId, 'indexName': indexName, 'content': content, 'isVip': isVip},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/author/index_list.html?bookId=' + bookId;


                } else {
                    lock = false;
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                lock = false;
                layer.alert(networkErrorText);
            }
        })

    }


    // Hiệu ứng máy đánh chữ.
    function typeWriter(textarea, text, speed = 50) {
        let i = 0;
        const timer = setInterval(() => {
            if (i < text.length) {
                textarea.val(textarea.val() + text.charAt(i));
                i++;
                // Cuộn xuống cuối ô nội dung.
                textarea.scrollTop(textarea[0].scrollHeight);
            } else {
                clearInterval(timer);
            }
        }, speed);
    }

    $('.ai-toolbar .ai-link').click(function (e) {
        e.preventDefault(); // Ngăn hành vi liên kết mặc định.
        const type = $(this).data('type');
        const textarea = $('#bookContent');
        const selectedText = textarea.val().substring(textarea[0].selectionStart, textarea[0].selectionEnd);

        // Yêu cầu chọn đoạn văn trước khi gọi AI.
        if (!selectedText) {
            layer.msg(selectTextMessage);
            return;
        }

        const loading = layer.load(1, {shade: 0.3});

        // Cấu hình tham số cho từng thao tác AI.
        let params = {text: selectedText};
        if (type === 'stream/expand' || type === 'stream/condense') {
            layer.prompt({
                title: ratioPromptText,
                value: 2,
                btn: [confirmText, cancelText],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (isNaN(Number(value)) || isNaN(parseFloat(value))) {
                    layer.msg(ratioInvalidText);
                    return;
                }
                if (type === 'stream/expand' && value <= 1) {
                    layer.msg(ratioInvalidText);
                    return;
                }
                if (type === 'stream/condense' && (value <= 0 || value >= 1)) {
                    layer.msg(ratioInvalidText);
                    return;
                }
                params.ratio = parseFloat(value) * 100;
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        } else if (type === 'stream/continue') {
            layer.prompt({
                title: lengthPromptText,
                value: 200,
                btn: [confirmText, cancelText],
                btn2: function () {
                    layer.close(loading);
                },
                cancel: function () {
                    layer.close(loading);
                }
            }, function (value, index) {
                if (!Number.isInteger(Number(value)) || value <= 0) {
                    layer.msg(lengthInvalidText);
                    return;
                }
                params.length = parseInt(value);
                layer.close(index);
                sendRequest(type, params, loading, textarea);
            });
            return;
        }

        sendRequest(type, params, loading, textarea);
    });

    function sendRequest(type, params, loading, textarea) {
        const url = `/author/ai/${type}?text=${encodeURIComponent(params.text)}&ratio=${params.ratio}&length=${params.length}`;
        const eventSource = new EventSource(url);

        // Nhận dữ liệu SSE.
        eventSource.onmessage = function (event) {
            layer.close(loading);
            const data = event.data;
            console.log('Received data:', data);

            textarea.val(textarea.val() + data);
            // Cuộn xuống cuối ô nội dung.
            textarea.scrollTop(textarea[0].scrollHeight);
        };

        // Đóng kết nối khi SSE báo lỗi.
        eventSource.onerror = function (error) {
            layer.close(loading);
            console.error('EventSource failed:', error);
            eventSource.close(); // Đóng kết nối.
        };

    }

</script>
