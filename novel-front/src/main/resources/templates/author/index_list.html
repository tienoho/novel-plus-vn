<script language="javascript" type="text/javascript" th:inline="javascript">
    const updatedText = /*[[#{reader.updated}]]*/ 'Cập nhật';
    const chargeText = /*[[#{author.chapter.charge}]]*/ 'Thu phí';
    const freeText = /*[[#{author.chapter.free}]]*/ 'Miễn phí';
    const editText = /*[[#{author.chapter.edit}]]*/ 'Sửa';
    const deleteText = /*[[#{author.chapter.delete}]]*/ 'Xóa';
    const deleteConfirmText = /*[[#{author.chapter.deleteConfirm}]]*/ 'Bạn có chắc muốn xóa? Dữ liệu đã xóa không thể khôi phục.';
    const confirmText = /*[[#{common.confirm}]]*/ 'Đồng ý';
    const cancelText = /*[[#{common.cancel}]]*/ 'Hủy';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    const transferFileRequiredText = /*[[#{author.transfer.file.required}]]*/ 'Vui lòng chọn tệp TXT, DOCX hoặc EPUB.';
    const transferFileTooLargeText = /*[[#{author.transfer.file.tooLarge}]]*/ 'Tệp nhập không được vượt quá 20 MB.';
    const transferImportingText = /*[[#{author.transfer.importing}]]*/ 'Đang nhập bản thảo...';
    const transferImportSuccessText = /*[[#{author.transfer.import.success}]]*/ 'Đã tạo {count} bản nháp. Bạn có thể kiểm tra trước khi xuất bản.';
    const transferExportingText = /*[[#{author.transfer.exporting}]]*/ 'Đang tạo tệp xuất...';
    const transferFailedText = /*[[#{author.transfer.failed}]]*/ 'Không thể xử lý tệp. Vui lòng thử lại.';

    var bookId = getSearchString("bookId");

    var indexCount = 0;

    search(1, 5);

    $("#bookImportFile").on("change", function () {
        var file = this.files && this.files[0];
        if (!file) {
            layer.alert(transferFileRequiredText);
            return;
        }
        if (file.size > 20 * 1024 * 1024) {
            this.value = "";
            layer.alert(transferFileTooLargeText);
            return;
        }
        var form = new FormData();
        form.append("file", file);
        var button = document.getElementById("bookImportButton");
        button.disabled = true;
        button.textContent = transferImportingText;
        $.ajax({
            type: "post",
            url: "/author/books/" + encodeURIComponent(bookId) + "/import",
            data: form,
            processData: false,
            contentType: false,
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var message = transferImportSuccessText.replace("{count}", data.data.chapterCount);
                    layer.alert(message, function () {
                        location.href = "/author/draft_list.html";
                    });
                } else if (data.code == 1001) {
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);
                } else {
                    layer.alert(data.msg || transferFailedText);
                }
            },
            error: function () {
                layer.alert(networkErrorText);
            },
            complete: function () {
                button.disabled = false;
                button.textContent = /*[[#{author.transfer.import}]]*/ 'Nhập bản thảo';
                document.getElementById("bookImportFile").value = "";
            }
        });
    });

    function chooseBookImport() {
        document.getElementById("bookImportFile").click();
    }

    async function exportBook() {
        var button = document.getElementById("bookExportButton");
        var originalText = button.textContent;
        button.disabled = true;
        button.textContent = transferExportingText;
        try {
            var format = document.getElementById("bookExportFormat").value;
            var response = await fetch("/author/books/" + encodeURIComponent(bookId)
                + "/export?format=" + encodeURIComponent(format), {credentials: "same-origin"});
            var contentType = response.headers.get("Content-Type") || "";
            if (!response.ok || contentType.indexOf("application/json") >= 0) {
                var payload = contentType.indexOf("application/json") >= 0 ? await response.json() : null;
                throw new Error(payload && payload.msg ? payload.msg : transferFailedText);
            }
            var blob = await response.blob();
            var disposition = response.headers.get("Content-Disposition") || "";
            var encodedName = /filename\*=UTF-8''([^;]+)/i.exec(disposition);
            var filename = encodedName ? decodeURIComponent(encodedName[1].replace(/\"/g, ""))
                : "tac-pham." + format.toLowerCase();
            var url = URL.createObjectURL(blob);
            var link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        } catch (error) {
            layer.alert(error && error.message ? error.message : transferFailedText);
        } finally {
            button.disabled = false;
            button.textContent = originalText;
        }
    }

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/book/queryIndexList",
            data: {'bookId': bookId, 'curr': curr, 'limit': limit, 'orderBy': 'index_num desc'},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        indexCount = bookList.length;
                        $("#hasContentDiv").css("display", "block");
                        $("#noContentDiv").css("display", "none");
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            bookListHtml += (" <tr class=\"book_list\" vals=\"291\">\n" +
                                /*  "                            <td class=\"style bookclass\">\n" +
                                  "                                ["+(i+1)+"]\n" +
                                  "                            </td>\n" +*/

                                "                            <td id='name" + book.id + "' class=\"name\">\n" +
                                "                                " + book.indexName + "</td>\n" +


                                "                            <td class=\"goread\">\n" +
                                "                                " + new Date(Date.parse(book.updateTime)).Format("dd/MM/yyyy hh:mm") + "<br/>" + updatedText + "\n" +
                                "                            </td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + (book.isVip == 1 ? chargeText : freeText) + "</td>\n" +

                                " <td class=\"goread\" id='opt" + book.id + "'>" +
                                "<a  class='redBtn' href='javascript:updateIndex(\"" + book.id + "\"," + book.isVip + ")'>" + editText + "</a><br/>" +
                                "<a  href='javascript:deleteIndex(\"" + book.id + "\")'>" + deleteText + "</a><br/>" +
                                "</td>                     </tr>");
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'shellPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }

    function addContent() {
        location.href = "/author/content_add.html?indexCount=" + indexCount + "&bookId=" + bookId;

    }

    function updateIndex(indexId, isVip) {

        var indexName = $.trim($("#name" + indexId).text());


        location.href = "/author/content_update.html?bookId=" + bookId
            + "&indexId=" + indexId
            + "&indexName=" + encodeURI(encodeURI(indexName))
            + "&isVip=" + isVip;


        /*
                var indexName = $("#name"+indexId).text();

                var htmlStr = "<input type=\"text\" value=\""+$.trim(indexName)+"\">";

                $("#name"+indexId).html(htmlStr);
                $("#name"+indexId).find("input").focus();
                $("#name"+indexId).find("input").select();

                $("#name"+indexId).find("input").keyup(function(event){
                    if(event.keyCode ==13){
                        $(this).blur();
                    }
                });

                $("#name"+indexId).find("input").blur(function () {
                    var indexName = $(this).val();
                    $.ajax({
                        type: "POST",
                        url: "/author/updateIndexName",
                        data: {'indexId':indexId,'indexName':indexName},
                        dataType: "json",
                        success: function (data) {
                            if (data.code == 200) {

                                $("#name"+indexId).html(indexName);


                            } else if (data.code == 1001) {
                                // Phiên đăng nhập đã hết hạn.
                                location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                            }else {
                                layer.alert(data.msg);
                            }

                        },
                        error: function () {
                            layer.alert(networkErrorText);
                        }
                    })

                });*/


    }


    function deleteIndex(indexId) {

        layer.confirm(deleteConfirmText, {
            btn: [confirmText, cancelText]// Nút xác nhận và hủy.
        }, function (index) {

            layer.close(index);
            $.ajax({
                type: "delete",
                url: "/author/deleteIndex/" + indexId,
                data: {},
                dataType: "json",
                success: function (data) {
                    if (data.code == 200) {

                        location.reload();


                    } else if (data.code == 1001) {
                        // Phiên đăng nhập đã hết hạn.
                        location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                    } else {
                        layer.alert(data.msg);
                    }

                },
                error: function () {
                    layer.alert(networkErrorText);
                }
            })
        });


    }
</script>
