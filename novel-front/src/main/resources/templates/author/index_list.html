<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title th:text="#{author.system}">Hệ thống quản lý tác giả</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/author-index-list-page.css"/>
</head>
<body id="authorIndexListPage"
      th:attr="data-updated-text=#{reader.updated},
               data-charge-text=#{author.chapter.charge},
               data-free-text=#{author.chapter.free},
               data-edit-text=#{author.chapter.edit},
               data-delete-text=#{author.chapter.delete},
               data-delete-confirm-text=#{author.chapter.deleteConfirm},
               data-confirm-text=#{common.confirm},
               data-cancel-text=#{common.cancel},
               data-network-error=#{auth.networkError},
               data-transfer-file-required=#{author.transfer.file.required},
               data-transfer-file-too-large=#{author.transfer.file.tooLarge},
               data-transfer-importing=#{author.transfer.importing},
               data-transfer-import-success=#{author.transfer.import.success},
               data-transfer-import-label=#{author.transfer.import},
               data-transfer-exporting=#{author.transfer.exporting},
               data-transfer-failed=#{author.transfer.failed}">

<header class="header">
    <div class="mainNav" id="mainNav">
        <div class="box_center cf author-page-title">
            <span th:text="#{author.system}">Hệ thống quản lý tác giả</span>
        </div>
    </div>
</header>

<main class="main box_center cf">
    <div class="userBox cf">
        <nav class="my_l">
            <ul class="log_list">
                <li><a class="link_4 on" href="/author/index.html" th:text="#{author.management}">Quản lý truyện</a></li>
                <li><a class="link_4" href="/author/draft_list.html" th:text="#{author.draft.management}">Quản lý bản nháp</a></li>
                <li><a class="link_2" href="/author/author_income_detail.html" th:text="#{author.income}">Thu nhập nhuận bút</a></li>
            </ul>
        </nav>
        <section class="my_r">
            <div class="book-transfer">
                <input id="bookImportFile" type="file" hidden
                       accept=".txt,text/plain,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.epub,application/epub+zip"/>
                <button id="bookImportButton" type="button" class="redBtn"
                        data-author-chapter-action="choose-import"
                        th:text="#{author.transfer.import}">Nhập bản thảo</button>
                <label for="bookExportFormat">
                    <span th:text="#{author.transfer.format}">Định dạng xuất</span>
                    <select id="bookExportFormat">
                        <option value="TXT">TXT</option>
                        <option value="DOCX">DOCX</option>
                        <option value="EPUB">EPUB</option>
                    </select>
                </label>
                <button id="bookExportButton" type="button" class="redBtn"
                        data-author-chapter-action="export"
                        th:text="#{author.transfer.export}">Xuất tác phẩm</button>
                <span class="transfer-help" th:text="#{author.transfer.help}">Tệp nhập tối đa 20 MB và chỉ tạo bản nháp riêng tư.</span>
            </div>

            <div id="noContentDiv">
                <div class="tc author-empty-chapters">
                    <a href="#add-chapter" class="btn_red" data-author-chapter-action="add"
                       th:text="#{author.chapter.new}">Tạo chương mới</a>
                </div>
            </div>
            <div class="my_bookshelf" id="hasContentDiv" style="display: none">
                <div class="title cf">
                    <h2 class="fl" th:text="#{author.chapterList}">Danh sách chương</h2>
                    <div class="fr">
                        <a href="#add-chapter" class="btn_red" data-author-chapter-action="add"
                           th:text="#{author.chapter.new}">Tạo chương mới</a>
                    </div>
                </div>
                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="name"><span th:text="#{author.chapter.name}">Tên chương</span></th>
                            <th class="goread"><span th:text="#{reader.updated}">Cập nhật</span></th>
                            <th class="goread"><span th:text="#{author.chapter.paid}">Có thu phí</span></th>
                            <th class="goread"><span th:text="#{common.actions}">Thao tác</span></th>
                        </tr>
                        </thead>
                        <tbody id="bookList"></tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage"></div>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/date.js" type="text/javascript"></script>
<script src="/javascript/common.js?v=5" type="text/javascript"></script>
<script src="/javascript/author-index-list-page.js" type="text/javascript"></script>
</body>
</html>
