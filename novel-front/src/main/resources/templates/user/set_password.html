<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{user.password.change}+'_'+${application.website.name}"></title>
    <link rel="stylesheet" href="/css/user.css"/>
</head>
<body id="userSettingsPage" data-settings-mode="password"
      th:attr="data-old-required=#{user.password.old.required},
               data-new-required=#{user.password.new.required},
               data-confirm-required=#{user.password.confirm.required},
               data-password-mismatch=#{user.password.mismatch},
               data-network-error=#{auth.networkError}">

<div th:replace="common/top :: top('')"></div>
<main class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">
            <ul class="log_list">
                <li><a class="link_1" href="/user/userinfo.html" th:text="#{user.center}">Tài khoản của tôi</a></li>
                <li><a class="link_4" href="/user/favorites.html" th:text="#{user.bookshelf}">Tủ sách</a></li>
                <li><a class="link_6" href="/user/comment.html" th:text="#{user.comments}">Bình luận của tôi</a></li>
                <li><a class="link_7" href="/user/feedback_list.html" th:text="#{user.feedback}">Phản hồi của tôi</a></li>
                <li><a class="link_8 on" href="/user/setup.html" th:text="#{user.settings}">Cài đặt tài khoản</a></li>
            </ul>
        </div>
        <div class="my_r">
            <div class="my_info cf">
                <div class="my_info_txt">
                    <form id="passwordForm" action="#change-password" method="post">
                        <ul class="mytab_list">
                            <li><i class="tit" th:text="#{user.password}">Mật khẩu</i>
                                <input name="oldPassword" type="password" id="txtOldPass" class="s_input" th:placeholder="#{user.password.old}"/>
                            </li>
                            <li><i class="tit">&nbsp;</i><input name="newPassword1" type="password" id="txtNewPass1" class="s_input" th:placeholder="#{user.password.new}"/></li>
                            <li><i class="tit">&nbsp;</i><input name="newPassword2" type="password" id="txtNewPass2" class="s_input" th:placeholder="#{user.password.confirm}"/></li>
                            <li><i class="tit">&nbsp;</i><button type="submit" id="btnExchangePassword" class="s_btn btn_red" th:text="#{common.change}">Thay đổi</button></li>
                            <li><i class="tit">&nbsp;</i><span id="LabErr"></span></li>
                        </ul>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user-settings-page.js" type="text/javascript"></script>
</body>
</html>
