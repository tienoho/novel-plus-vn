<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
    <head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
        <title th:text="#{user.bookshelf}+'_'+${application.website.name}"></title>
        <meta name="keywords" th:content="#{user.bookshelf}+','+#{user.center}+','+#{book.seo.list.keywords}"/>
        <meta name="description"
              th:content="#{book.seo.list.description(${application.website.name})}"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf">
    <h1 class="sr-only" th:text="#{user.bookshelf}">Tủ sách</h1>
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/user/userinfo.html" th:text="#{user.center}">Tài khoản của tôi</a></li>
                <li><a class="link_4 on" href="/user/favorites.html" th:text="#{user.bookshelf}">Tủ sách</a></li>
                <li><a class="link_6" href="/user/comment.html" th:text="#{user.comments}">Bình luận của tôi</a></li>
                <li><a class="link_7" href="/user/feedback_list.html" th:text="#{user.feedback}">Phản hồi của tôi</a></li>
                <li><a class="link_8" href="/user/setup.html" th:text="#{user.settings}">Cài đặt tài khoản</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl"><span class="red" th:text="#{user.bookshelf}">Tủ sách</span></h2><i
                        class="fl ml20 mr20 font16">|</i>
                    <h2 class="fl"><a href="/user/read_history.html" th:text="#{user.recentReading}">Đọc gần đây</a></h2>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                <span th:text="#{book.category}">Danh mục truyện</span>
                            </th>
                            <th class="name">
                                <span th:text="#{book.name}">Tên truyện</span>
                            </th>
                            <th class="chapter">
                                <span th:text="#{book.latest}">Chương mới nhất</span>
                            </th>
                            <th class="time">
                                <span th:text="#{reader.updated}">Cập nhật</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{common.actions}">Thao tác</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookShelfList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>


</body>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const continueReadingText = /*[[#{user.continueReading}]]*/ 'Đọc tiếp';
    const removeShelfText = /*[[#{book.removeShelf}]]*/ 'Xóa khỏi tủ sách';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    search(1, 10);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/user/listBookShelfByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookShelfList = data.data.list;
                    if (bookShelfList.length > 0) {
                        var bookShelfListHtml = "";
                        for (var i = 0; i < bookShelfList.length; i++) {
                            var book = bookShelfList[i];
                            bookShelfListHtml += (" <tr id='shelf" + book.bookId + "' class=\"book_list\" vals=\"291\">\n" +
                                "                            <td class=\"style bookclass\">\n" +
                                "                                <a href=\"/book/bookclass.html?c=" + book.catId + "\" >[" + book.catName + "]</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"name\">\n" +
                                "                                <a href=\"/book/" + book.bookId + ".html\">\n" +
                                "                                    " + book.bookName + "</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"chapter\" valsc=\"291|2037554|1\">\n" +
                                "<a href='/book/" + book.bookId + "/" + book.lastIndexId + ".html'>" + book.lastIndexName + "</a>" +
                                "                            </td>\n" +
                                "                            <td class=\"time\">\n" +
                                "                                " + book.lastIndexUpdateTime + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "<div style=''><a href='/book/" + book.bookId + "/" + book.preContentId + ".html'>" + continueReadingText + "</a></div>" +
                                "<div style='line-height:8px;padding-bottom:13px'><a href='#' data-csp-action='remove-from-bookshelf' data-book-id='" + Number(book.bookId) + "'>" + removeShelfText + "</a></div>" +
                                "                            </td>\n" +
                                "                        </tr>");
                        }
                        $("#bookShelfList").html(bookShelfListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'shellPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    novelAlertText(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }

    function removeFromBookShelf(bookId) {

        $.ajax({
            type: "delete",
            url: "/user/removeFromBookShelf/" + bookId,
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#shelf" + bookId).remove();
                }
            }
        });

    }
</script>
</html>
