<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#159957">
    <title>Thư viện đọc offline - Khởi Thư</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root{color-scheme:light dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#163528}body{margin:0}header,main{max-width:900px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#159957;color:#fff;max-width:none}header a{color:#fff}h1{font-size:1.35rem;margin:0}.offline-panel{background:#fff;color:#173b2d;border-radius:10px;padding:18px;box-shadow:0 5px 24px rgba(0,0,0,.08)}ul{list-style:none;padding:0}li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #d8e5dd}button,a{font:inherit}.offline-open{border:0;background:none;text-align:left;color:#126b42;font-weight:700;cursor:pointer}li>button:last-child,#offlineBackToList{border:1px solid #159957;border-radius:6px;background:#fff;color:#126b42;padding:8px 12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}#offlineViewerContent{white-space:pre-wrap;line-height:1.8;font-family:Georgia,"Times New Roman",serif;font-size:1.1rem}time{font-size:.85rem;color:#597267}@media(max-width:600px){li{grid-template-columns:1fr auto}li time{grid-column:1/2}.offline-panel{padding:12px}}@media(prefers-color-scheme:dark){:root{background:#111b16;color:#e7f3ec}.offline-panel{background:#18271f;color:#e7f3ec}.offline-open{color:#7fe1ad}time{color:#a9c5b5}}
    </style>
</head>
<body>
<header>
    <h1>Thư viện đọc offline</h1>
    <a href="/">Về trang chủ</a>
</header>
<main>
    <p id="offlineStatus" role="status" aria-live="polite"></p>
    <section class="offline-panel" aria-labelledby="offlineListTitle">
        <div>
            <h2 id="offlineListTitle">Chương đã lưu</h2>
            <p id="offlineEmpty" hidden>Chưa có chương nào. Khi đang trực tuyến, hãy mở một chương miễn phí và chọn “Lưu offline”.</p>
            <ul id="offlineChapterList"></ul>
        </div>
        <article id="offlineViewer" hidden>
            <button id="offlineBackToList" type="button">← Danh sách chương</button>
            <h2 id="offlineViewerTitle" tabindex="-1">Chương đã lưu</h2>
            <p id="offlineViewerBook"></p>
            <div id="offlineViewerContent"></div>
        </article>
    </section>
</main>
<script src="/javascript/offline-reader.js"></script>
</body>
</html>
