vnpay:
  # Chỉ bật sau khi VNPAY cấp mã website và khóa bí mật cho merchant.
  enabled: ${VNPAY_ENABLED:false}
  tmn-code: ${VNPAY_TMN_CODE:disabled}
  hash-secret: ${VNPAY_HASH_SECRET:disabled}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8083/pay/vnpay/return}
  query-url: ${VNPAY_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  version: 2.1.0
  locale: vn
  order-type: other
  time-zone: Asia/Ho_Chi_Minh
  xu-per-thousand-vnd: ${VNPAY_XU_PER_1000_VND:100}
  allowed-amounts-vnd: ${VNPAY_ALLOWED_AMOUNTS_VND:10000,30000,50000,100000,200000,500000}
  reconciliation-enabled: ${VNPAY_RECONCILIATION_ENABLED:true}
  server-ip: ${VNPAY_SERVER_IP:127.0.0.1}
  reconciliation-delay-ms: ${VNPAY_RECONCILIATION_DELAY_MS:300000}
  reconciliation-initial-delay-ms: ${VNPAY_RECONCILIATION_INITIAL_DELAY_MS:60000}
  reconciliation-min-age-minutes: ${VNPAY_RECONCILIATION_MIN_AGE_MINUTES:20}
  reconciliation-max-age-days: ${VNPAY_RECONCILIATION_MAX_AGE_DAYS:30}
  reconciliation-batch-size: ${VNPAY_RECONCILIATION_BATCH_SIZE:50}
  recurring:
    enabled: ${VNPAY_RECURRING_ENABLED:false}
    base-url: ${VNPAY_RECURRING_BASE_URL:https://sandbox.vnpayment.vn}
    client-id: ${VNPAY_RECURRING_CLIENT_ID:disabled}
    username: ${VNPAY_RECURRING_USERNAME:disabled}
    password: ${VNPAY_RECURRING_PASSWORD:disabled}
    client-secret: ${VNPAY_RECURRING_CLIENT_SECRET:disabled}
    tmn-code: ${VNPAY_RECURRING_TMN_CODE:disabled}
    hash-secret: ${VNPAY_RECURRING_HASH_SECRET:disabled}
    pay-url: ${VNPAY_RECURRING_PAY_URL:https://sandbox.vnpayment.vn/recurring-payment/pay}
    return-url: ${VNPAY_RECURRING_RETURN_URL:http://localhost:8083/payment/vnpay-recurring/return}
    cancel-url: ${VNPAY_RECURRING_CANCEL_URL:http://localhost:8083/payment/vnpay-recurring/cancel}
    result-redirect-url: ${VNPAY_RECURRING_RESULT_REDIRECT_URL:/pay}
    order-type: ${VNPAY_RECURRING_ORDER_TYPE:other}
    version: 2.1.0
    locale: vn
    time-zone: Asia/Ho_Chi_Minh
    connect-timeout-seconds: ${VNPAY_RECURRING_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${VNPAY_RECURRING_REQUEST_TIMEOUT_SECONDS:15}
