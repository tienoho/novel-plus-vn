#Cổng
server:
  port: 8083

spring:
  data:
    redis:
      #IP máy chủ Redis
      host: 127.0.0.1
      #Cổng kết nối Redis
      port: 6379
      #Mật khẩu kết nối Redis
      password: test123456
      #Thời gian chờ kết nối (mili giây)
      timeout: 10000

#Tên đăng nhập và mật khẩu
admin:
  username: admin
  password: admin
#
## Số luồng tự động cập nhật dữ liệu thu thập
## Nên đặt là 1 khi số tác phẩm ít hoặc đang chạy tác vụ nhập tác phẩm mới
## Có thể tăng theo số tác phẩm nhưng không nên vượt số luồng CPU
crawl:
  update:
    thread: 1

#Cấu hình lưu nội dung tác phẩm
content:
  save:
    storage: db # Cách lưu nội dung: db cơ sở dữ liệu, txt văn bản TXT
    path: /Users/xiongxiaoyang/books  # Đường dẫn lưu văn bản TXT của tác phẩm

# Cấu hình proxy HTTP
http:
  proxy:
    # Bật proxy HTTP: true bật, false tắt
    enabled: false
    # IP proxy
    ip: proxy.bestproxy.com
    # Cổng proxy
    port: 2312
    # Tên người dùng proxy
    username: bestproxy_u
    # Mật khẩu proxy
    password: bestproxy_p

---

#Máy chủ email
spring:
  mail:
    host: smtp.163.com
    #Tên hiển thị người gửi
    nickname: novel-plus
    #Tài khoản email
    username: xxyopen@163.com
    #Mã ủy quyền email bên thứ ba
    password: novel123456


# Cấu hình giám sát đĩa
disk-monitor:
  # Bật giám sát đĩa: true bật, false tắt
  enabled: false
  # Khoảng thời gian giám sát đĩa (phút)
  interval-minutes: 5
  # Ngưỡng sử dụng đĩa
  warning-threshold: 85.0
  severe-threshold: 90.0
  critical-threshold: 95.0
  # Danh sách email nhận cảnh báo (hỗ trợ nhiều địa chỉ)
  recipients: xxyopen@foxmail.com,12345678@qq.com

