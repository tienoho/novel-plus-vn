# Cổng dịch vụ.
server:
  port: 8081
  servlet:
    session:
      timeout: 1D

spring:
  profiles:
    active: dev

# Tài khoản đăng nhập.
admin:
  username: admin
  password: admin



crawl:
  update:
    # Số luồng tự động cập nhật dữ liệu thu thập.
    # Nên đặt là 1 khi số truyện còn ít hoặc đang chạy tác vụ nhập truyện mới.
    # Có thể tăng dần theo số lượng truyện nhưng không nên vượt quá số luồng CPU.
    thread: 1
  # Khoảng nghỉ giữa các lần thu thập, đơn vị mili giây.
  interval:
    min: 300
    max: 500


---

# Máy chủ email.
spring:
  mail:
    host: smtp.163.com
    # Tên hiển thị của người gửi.
    nickname: novel-plus
    # Tài khoản email.
    username: xxyopen@163.com
    # Mã ủy quyền ứng dụng của email.
    password: novel123456
    # Bảng mã.
    default-encoding: UTF-8
    port: 465
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: rue
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# Cấu hình giám sát ổ đĩa.
disk-monitor:
  enabled: false
  interval-minutes: 5
  warning-threshold: 85.0
  severe-threshold: 90.0
  critical-threshold: 95.0
  # Danh sách người nhận email cảnh báo, hỗ trợ nhiều địa chỉ.
  recipients: xxyopen@foxmail.com,12345678@qq.com


