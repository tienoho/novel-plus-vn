# Cổng dịch vụ.
server:
  port: 8081
  servlet:
    session:
      timeout: 1D

spring:
  profiles:
    active: dev

# Tài khoản đăng nhập.
admin:
  username: ${CRAWLER_ADMIN_USERNAME:admin}
  password: ${CRAWLER_ADMIN_PASSWORD:}

security:
  csrf:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  csp:
    enabled: ${CSP_ENABLED:true}
    # Có thể chuyển tạm sang false để điều tra tương thích mà không nới policy.
    enforce: ${CSP_ENFORCE:true}


crawl:
  update:
    # Số luồng tự động cập nhật dữ liệu thu thập.
    # Nên đặt là 1 khi số truyện còn ít hoặc đang chạy tác vụ nhập truyện mới.
    # Có thể tăng dần theo số lượng truyện nhưng không nên vượt quá số luồng CPU.
    thread: 1
  # Khoảng nghỉ giữa các lần thu thập, đơn vị mili giây.
  interval:
    min: 300
    max: 500


---

# Máy chủ email.
spring:
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    # Tên hiển thị của người gửi.
    nickname: ${MAIL_NICKNAME:novel-plus}
    # Tài khoản email.
    username: ${MAIL_USERNAME:disabled}
    # Mã ủy quyền ứng dụng của email.
    password: ${MAIL_PASSWORD:disabled}
    # Bảng mã.
    default-encoding: UTF-8
    port: ${MAIL_PORT:465}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: rue
          socketFactory:
            port: ${MAIL_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
            fallback: false

# Cấu hình giám sát ổ đĩa.
disk-monitor:
  enabled: false
  interval-minutes: 5
  warning-threshold: 85.0
  severe-threshold: 90.0
  critical-threshold: 95.0
  # Danh sách người nhận email cảnh báo, hỗ trợ nhiều địa chỉ.
  recipients: ${DISK_MONITOR_RECIPIENTS:}


