<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title th:text="#{crawl.title}">Quản lý trình thu thập</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="crawl/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/" th:text="#{crawl.source.manage}">Quản lý nguồn thu thập</a></li>
                <li><a class="link_1 on" href="/crawl/crawlSingleTask_list.html" th:text="#{crawl.single.manage}">Thu thập từng truyện</a></li>
                <li><a class="link_1" href="/crawl/crawlSource_test.html" target="_blank" th:text="#{crawl.test}">Kiểm thử quy tắc</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">

                <div class="userBox cf">
                    <form method="post" action="./register.html" id="form2">

                        <div class="user_l">
                            <div></div>
                            <h3><span th:text="#{crawl.form.single}">Nhập thông tin thu thập truyện</span> (http://www.mcmssc.com)</h3>
                            <ul class="log_list">
                                <li><span id="LabErr"></span></li>
                                <input type="hidden" id="sourceName" class="s_input icon_name">
                                <b th:text="#{crawl.source.select}+'：'">Chọn nguồn thu thập:</b>
                                <li><select id="sourceId" class="s_input icon_key">
                                </select></li>
                                <b th:text="#{crawl.category.select}+'：'">Chọn danh mục:</b>
                                <li><select id="catId" class="s_input icon_key">
                                    <option value="1" th:text="#{crawl.category.fantasy}">Huyền huyễn và kỳ ảo</option>
                                    <option value="2" th:text="#{crawl.category.wuxia}">Võ hiệp và tiên hiệp</option>
                                    <option value="3" th:text="#{crawl.category.urban}">Đô thị và ngôn tình</option>
                                    <option value="4" th:text="#{crawl.category.history}">Lịch sử và quân sự</option>
                                    <option value="5" th:text="#{crawl.category.scifi}">Khoa học viễn tưởng và linh dị</option>
                                    <option value="6" th:text="#{crawl.category.game}">Trò chơi trực tuyến và thể thao điện tử</option>
                                    <option value="7" th:text="#{crawl.category.female}">Kênh nữ</option>
                                </select>
                                </li>
                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b>73_73911</b>
                                <li><input type="text" id="sourceBookId" class="s_input icon_key"
                                           th:placeholder="#{crawl.sourceBookId}" placeholder="ID truyện trên website nguồn"/></li>
                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b>Tên truyện mẫu</b>
                                <li><input type="text" id="bookName" class="s_input icon_key"
                                           th:placeholder="#{crawl.book.name}" placeholder="Tên truyện thu thập"/></li>
                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b>Tác giả mẫu</b>
                                <li><input type="text" id="authorName" class="s_input icon_key"
                                           th:placeholder="#{crawl.book.author}" placeholder="Tác giả truyện thu thập"/></li>

                                <!-- Ví dụ: <b>https://m.xdingdiann.com/sort/0/1.html</b>
                                <li><input type="text" id="updateBookListUrl" class="s_input icon_key"
                                           placeholder="URL danh sách cập nhật truyện"></li>-->


                                <li><input type="button" onclick="addCrawlSingleTask()" name="btnRegister" th:value="#{crawl.submit}" value="Gửi"
                                           id="btnRegister" class="btn_red"></li>
                            </ul>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const crawlMessages = {
        sourceBookIdRequired: /*[[#{crawl.sourceBookId.required}]]*/ 'Vui lòng nhập ID truyện trên website nguồn',
        bookNameRequired: /*[[#{crawl.book.name.required}]]*/ 'Vui lòng nhập tên truyện cần thu thập',
        bookAuthorRequired: /*[[#{crawl.book.author.required}]]*/ 'Vui lòng nhập tên tác giả truyện cần thu thập',
        networkError: /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng'
    };
    $(function () {
        $.ajax({
            type: "get",
            url: "/crawl/listCrawlByPage",
            data: {'curr': 1, 'limit': 100},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var crawlSourceList = data.data.list;
                    if (crawlSourceList.length > 0) {
                        var crawlSourceListHtml = "";
                        for (var i = 0; i < crawlSourceList.length; i++) {
                            var crawlSource = crawlSourceList[i];
                            crawlSourceListHtml += ("<option value=\"" + crawlSource.id + "\">" + crawlSource.sourceName + "</option>");
                        }
                        $("#sourceId").html(crawlSourceListHtml);


                    }


                } else if (data.code == 1001) {
                    // Chưa đăng nhập.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(crawlMessages.networkError);
            }
        })
    });


    function addCrawlSingleTask() {

        var sourceId = $("#sourceId").find("option:selected").val();

        var catId = $("#catId").find("option:selected").val();

        var sourceName = $("#sourceId").find("option:selected").html();


        var sourceBookId = $("#sourceBookId").val();

        if (!sourceBookId) {
            layer.alert(crawlMessages.sourceBookIdRequired);
            return;
        }

        var bookName = $("#bookName").val();

        if (!bookName) {
            layer.alert(crawlMessages.bookNameRequired);
            return;
        }

        var authorName = $("#authorName").val();

        if (!authorName) {
            layer.alert(crawlMessages.bookAuthorRequired);
            return;
        }

        $.ajax({
            type: "POST",
            url: "/crawl/addCrawlSingleTask",
            data: {
                'sourceId': sourceId,
                'sourceName': sourceName,
                'catId': catId,
                'sourceBookId': sourceBookId,
                'bookName': bookName,
                'authorName': authorName
            },
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/crawl/crawlSingleTask_list.html';


                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(crawlMessages.networkError);
            }
        })

    }

</script>
</html>
