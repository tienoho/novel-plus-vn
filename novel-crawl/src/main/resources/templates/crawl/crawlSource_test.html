<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title th:text="#{crawl.title}">Quản lý trình thu thập</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="crawl/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/" th:text="#{crawl.source.manage}">Quản lý nguồn thu thập</a></li>
                <li><a class="link_1" href="/crawl/crawlSingleTask_list.html" th:text="#{crawl.single.manage}">Thu thập từng truyện</a></li>
                <li><a class="link_1 on" href="/crawl/crawlSource_test.html" target="_blank" th:text="#{crawl.test}">Kiểm thử quy tắc</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">

                <div class="userBox cf">
                    <form method="post" action="./register.html" id="form2">
                        <div class="user_l">
                            <div></div>
                            <h3><span th:text="#{crawl.source.form}">Thông tin nguồn thu thập</span> (dingdiann.com)</h3>
                            <ul class="log_list">
                                <li><span id="LabErr"></span></li>
                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b>http://m.xdingdiann.com/sort/{catId}/{page}.html</b> ({catId}: ID danh mục, {page}: số trang)
                                <li><input type="text" id="url" class="s_input icon_key"
                                           placeholder="url"></li>

                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b>value=\"(\\d+)/\\d+\"</b>
                                <li><input type="text" id="rule" class="s_input icon_name" th:placeholder="#{crawl.rule}" placeholder="Quy tắc"></li>
                                <span th:text="#{crawl.form.example}">Ví dụ</span>: <b th:text="#{crawl.forceRefresh.help}">Nhập 1 để bắt buộc tải mới</b>
                                <li><input type="text" id="isRefresh" class="s_input icon_name" th:placeholder="#{crawl.forceRefresh}" placeholder="Bắt buộc tải mới">
                                </li>

                                <li><textarea rows="20" cols="100" id="resultMap"></textarea></li>


                                <li><input type="button" name="btnRegister" th:value="#{crawl.test.action}" value="Kiểm thử"
                                           id="btnRegister" class="btn_red"></li>
                            </ul>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const crawlMessages = {
        ruleRequired: /*[[#{crawl.rule.required}]]*/ 'Vui lòng nhập biểu thức chính quy',
        urlRequired: /*[[#{crawl.url.required}]]*/ 'Vui lòng nhập URL',
        networkError: /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng',
        matchStatus: /*[[#{crawl.test.matchStatus}]]*/ 'Có khớp',
        matchResult: /*[[#{crawl.test.matchResult}]]*/ 'Kết quả khớp'
    };
    function load() {
        var testParseUrl = localStorage.getItem("testParseUrl");
        $("#url").val(testParseUrl);
        var testParseRule = localStorage.getItem("testParseRule");
        $("#rule").val(testParseRule);
    }

    $("#btnRegister").on("click", testCrawlSource);

    function testCrawlSource() {

        var data = {};


        var isRefresh = $("#isRefresh").val();
        data.isRefresh = isRefresh;
        var rule = $("#rule").val();
        if (rule.length == 0) {
            layer.alert(crawlMessages.ruleRequired);
            return false;
        }
        data.rule = rule;
        var url = $("#url").val();
        if (url.length == 0) {
            layer.alert(crawlMessages.urlRequired);
            return false;
        }
        data.url = url;

        localStorage.setItem("testParseUrl", url);
        localStorage.setItem("testParseRule", rule);
        $.ajax({
            type: "POST",
            url: "/crawl/testParse",
            data: data,
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var displayResult = {};
                    displayResult[crawlMessages.matchStatus] = data.data.matched;
                    if (Object.prototype.hasOwnProperty.call(data.data, 'matchResult')) {
                        displayResult[crawlMessages.matchResult] = data.data.matchResult;
                    }
                    $("#resultMap").val(JSON.stringify(displayResult));
                } else {
                    layer.alert(crawlEscapeHtml(data.msg || ""));
                }

            },
            error: function () {
                layer.alert(crawlMessages.networkError);
            }
        })

    }

</script>
</html>
