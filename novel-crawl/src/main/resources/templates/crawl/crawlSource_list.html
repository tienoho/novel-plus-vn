<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title th:text="#{crawl.title}">Quản lý trình thu thập</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="crawl/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1 on" href="/" th:text="#{crawl.source.manage}">Quản lý nguồn thu thập</a></li>
                <li><a class="link_1" href="/crawl/crawlSingleTask_list.html" th:text="#{crawl.single.manage}">Thu thập từng truyện</a></li>
                <li><a class="link_1" href="/crawl/crawlSource_test.html" target="_blank" th:text="#{crawl.test}">Kiểm thử quy tắc</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl" th:text="#{crawl.source.list}">Danh sách nguồn thu thập</h2>
                    <div class="fr"><a href="/crawl/crawlSource_add.html" class="btn_red" th:text="#{crawl.source.add}">Thêm nguồn thu thập</a>
                    </div>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                <span th:text="#{crawl.sequence}">STT</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.source}">Nguồn thu thập</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.createdAt}">Thời gian tạo</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.updatedAt}">Thời gian cập nhật</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.count}">Số lần thu thập</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.status}">Trạng thái</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.actions}">Thao tác</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="crawlSourceList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const crawlMessages = {
        chapter: /*[[#{crawl.chapterUnit}]]*/ 'chương',
        stopped: /*[[#{crawl.stopped}]]*/ 'Đã dừng',
        running: /*[[#{crawl.running}]]*/ 'Đang chạy',
        open: /*[[#{crawl.open}]]*/ 'Bật',
        close: /*[[#{crawl.close}]]*/ 'Tắt',
        edit: /*[[#{crawl.edit}]]*/ 'Sửa',
        networkError: /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng'
    };
    let curr = 1;
    let limit = 10;
    let isUpdate = false;

    search();
    setInterval(function () {
        search();
    }, 10000);

    function search() {

        $.ajax({
            type: "get",
            url: "/crawl/listCrawlByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var crawlSourceList = data.data.list;
                    if (crawlSourceList.length > 0) {
                        var crawlSourceListHtml = "";
                        for (var i = 0; i < crawlSourceList.length; i++) {
                            var crawlSource = crawlSourceList[i];
                            crawlSourceListHtml += (" <tr class=\"book_list\" vals=\"291\">\n" +
                                "                            <td class=\"style bookclass\">\n" +
                                "                                [" + (i + 1) + "]\n" +
                                "                            </td>\n" +
                                "                            <td class=\"name\">\n" +
                                "                                " + crawlSource.sourceName + "</td>\n" +
                                "                            <td class=\"name\" valsc=\"291|2037554|1\">"
                                + crawlSource.createTime + "</td>\n" +
                                "                            <td class=\"name\">\n" +
                                "                                " + crawlSource.updateTime + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "                                " + crawlSource.chapterCount + " " + crawlMessages.chapter + "</td>\n" +
                                "                            <td class=\"goread\" id='sourceStatus" + crawlSource.id + "'>" + (crawlSource.sourceStatus == 0 ? crawlMessages.stopped : crawlMessages.running) +
                                "                            </td>\n" +

                                " <td class=\"goread\" id='opt" + crawlSource.id + "'><a href='javascript:openOrStopCrawl(" + crawlSource.id + "," + crawlSource.sourceStatus + ")'>" + (crawlSource.sourceStatus == 0 ? crawlMessages.open : crawlMessages.close) + "  </a>" +
                                "<a href='javascript:updateCrawlSource(" + crawlSource.id + ")'>" + crawlMessages.edit + "  </a>" +
                                "</td>                     </tr>");
                        }
                        $("#crawlSourceList").html(crawlSourceListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang.
                            laypage.render({
                                elem: 'shellPage' // ID phần tử, không gồm ký tự #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không chạy lại ở lần khởi tạo đầu tiên.
                                    if (!first) {
                                        curr = obj.curr;
                                        limit = obj.limit;
                                        isUpdate = false;
                                        search();
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Chưa đăng nhập.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else if (!isUpdate) {
                    layer.alert(data.msg);
                }
                isUpdate = true;

            },
            error: function () {
                if (!isUpdate) {
                    layer.alert(crawlMessages.networkError);
                }
                isUpdate = true;
            }
        })

    }

    function updateCrawlSource(crawlSourceId) {

        localStorage.setItem("crawlSourceId", crawlSourceId);
        window.location.href = "/crawl/crawlSource_update.html";

    }

    function openOrStopCrawl(sourceId, status) {

        $.ajax({
            type: "POST",
            url: "/crawl/openOrCloseCrawl",
            data: {'sourceId': sourceId, 'sourceStatus': status == 0 ? 1 : 0},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    if (status == 0) {
                        // Bật nguồn thu thập.
                        $("#sourceStatus" + sourceId).html(crawlMessages.running);
                        $("#opt" + sourceId).html("<a href='javascript:openOrStopCrawl(" + sourceId + "," + 1 + ")'>" + crawlMessages.close + " </a>" + "<a href='javascript:updateCrawlSource(" + sourceId + ")'>" + crawlMessages.edit + "  </a>");
                    } else {
                        // Tắt nguồn thu thập.
                        $("#sourceStatus" + sourceId).html(crawlMessages.stopped);
                        $("#opt" + sourceId).html("<a href='javascript:openOrStopCrawl(" + sourceId + "," + 0 + ")'>" + crawlMessages.open + " </a>" + "<a href='javascript:updateCrawlSource(" + sourceId + ")'>" + crawlMessages.edit + "  </a>");
                    }


                } else if (data.code == 1001) {
                    // Chưa đăng nhập.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(crawlMessages.networkError);
            }
        })


    }
</script>
</html>
