<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
        <title th:text="#{crawl.title}">Quản lý trình thu thập</title>
        <link rel="stylesheet" href="/css/base.css?v=1"/>
        <link rel="stylesheet" href="/css/user.css"/>
    </head>
</head>
<body class="">

<div th:replace="crawl/header :: header">
</div>

<div class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">

            <ul class="log_list">
                <li><a class="link_1" href="/" th:text="#{crawl.source.manage}">Quản lý nguồn thu thập</a></li>
                <li><a class="link_1 on" href="/crawl/crawlSingleTask_list.html" th:text="#{crawl.single.manage}">Thu thập từng truyện</a></li>
                <li><a class="link_1" href="/crawl/crawlSource_test.html" target="_blank" th:text="#{crawl.test}">Kiểm thử quy tắc</a></li>
            </ul>

        </div>
        <div class="my_r">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl" th:text="#{crawl.single.list}">Danh sách tác vụ thu thập từng truyện</h2>
                    <div class="fr"><a href="/crawl/crawlSingleTask_add.html" class="btn_red" th:text="#{crawl.single.add}">Thêm tác vụ thu thập từng truyện</a></div>
                </div>

                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                <span th:text="#{crawl.sequence}">STT</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.book.name}">Tên truyện thu thập</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.book.author}">Tác giả truyện thu thập</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.progress}">Tiến độ thu thập</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.count}">Số lần thu thập</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.status}">Trạng thái</span>
                            </th>
                            <th class="name">
                                <span th:text="#{crawl.createdAt}">Thời gian tạo</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{crawl.actions}">Thao tác</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="crawlSourceList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const crawlMessages = {
        chapter: /*[[#{crawl.chapterUnit}]]*/ 'chương',
        failed: /*[[#{crawl.failed}]]*/ 'Thu thập thất bại',
        success: /*[[#{crawl.success}]]*/ 'Thu thập thành công',
        collecting: /*[[#{crawl.collecting}]]*/ 'Đang thu thập',
        queued: /*[[#{crawl.queued}]]*/ 'Đang chờ',
        deleteLabel: /*[[#{crawl.delete}]]*/ 'Xóa',
        networkError: /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng'
    };
    let curr = 1;
    let limit = 10;
    let isUpdate = false;

    search();
    setInterval(function () {
        search();
    }, 10000);

    function search() {

        $.ajax({
            type: "get",
            url: "/crawl/listCrawlSingleTaskByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var crawlSourceList = data.data.list;
                    if (crawlSourceList.length > 0) {
                        $("#crawlSourceList").empty();
                        for (var i = 0; i < crawlSourceList.length; i++) {
                            renderCrawlTaskRow(crawlSourceList[i], i);
                        }

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang.
                            laypage.render({
                                elem: 'shellPage' // ID phần tử, không gồm ký tự #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không chạy lại ở lần khởi tạo đầu tiên.
                                    if (!first) {
                                        curr = obj.curr;
                                        limit = obj.limit;
                                        isUpdate = false;
                                        search();
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Chưa đăng nhập.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else if (!isUpdate) {
                    layer.alert(crawlEscapeHtml(data.msg || ""));
                }
                isUpdate = true;

            },
            error: function () {
                if (!isUpdate) {
                    layer.alert(crawlMessages.networkError);
                }
                isUpdate = true;
            }
        })

    }

    function appendTaskCell(row, className, value) {
        $("<td>", {"class": className})
            .text(value == null ? "" : String(value))
            .appendTo(row);
    }

    function renderCrawlTaskRow(crawlSource, index) {
        var taskId = Number(crawlSource.id);
        if (!Number.isInteger(taskId) || taskId <= 0) {
            return;
        }
        var taskStatus = Number(crawlSource.taskStatus);
        var exceptionCount = Number(crawlSource.excCount) || 0;
        var statusText = taskStatus === 0
            ? crawlMessages.failed
            : (taskStatus === 1
                ? crawlMessages.success
                : (taskStatus === 3 || exceptionCount > 0 ? crawlMessages.collecting : crawlMessages.queued));
        var row = $("<tr>", {"class": "book_list"});
        appendTaskCell(row, "style bookclass", "[" + (index + 1) + "]");
        appendTaskCell(row, "name", crawlSource.bookName);
        appendTaskCell(row, "name", crawlSource.authorName);
        appendTaskCell(row, "goread", String(crawlSource.crawlChapters == null ? "" : crawlSource.crawlChapters) + " " + crawlMessages.chapter);
        appendTaskCell(row, "goread", exceptionCount);
        appendTaskCell(row, "goread", statusText);
        appendTaskCell(row, "name", crawlSource.createTime);
        var actions = $("<td>", {"class": "goread", "id": "opt" + taskId}).appendTo(row);
        $("<a>", {"href": "#"})
            .text(crawlMessages.deleteLabel + "  ")
            .on("click", function (event) {
                event.preventDefault();
                del(taskId);
            })
            .appendTo(actions);
        row.appendTo("#crawlSourceList");
    }


    function del(id) {

        $.ajax({
            type: "delete",
            url: "/crawl/delCrawlSingleTask/" + id,
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    location.reload();


                } else {
                    layer.alert(crawlEscapeHtml(data.msg || ""));
                }

            },
            error: function () {
                layer.alert(crawlMessages.networkError);
            }
        })


    }
</script>
</html>
