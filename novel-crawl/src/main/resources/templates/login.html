<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title th:text="#{crawl.title}+' - '+#{auth.login}">Quản lý trình thu thập - Đăng nhập</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/css/signin.css" rel="stylesheet"/>
    <style>
        .btn-primary {
            color: #fff;
            background-color: #3eaf7c;
            border-color: #3eaf7c
        }

        .btn-primary:hover {
            color: #fff;
            background-color: #65bf96;
            border-color: #65bf96
        }

        .btn-primary.focus, .btn-primary:focus {
            box-shadow: 0 0 0 3px rgba(101, 191, 96, .5)
        }

        .btn-primary.disabled, .btn-primary:disabled {
            background-color: #3eaf7c;
            border-color: #3eaf7c
        }


        .form-control:focus {
            color: #495057;
            background-color: #fff;
            border-color: #78c7a3;
            outline: 0
        }

    </style>
</head>
<body>
<div class="container">
    <form class="form-signin" method="post" action="/login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <h4 style="text-align: center" class="form-signin-heading" th:text="#{crawl.title}+' - '+#{auth.login}">Quản lý trình thu thập - Đăng nhập</h4>
        <p>
            <label for="username" class="sr-only" th:text="#{auth.username}">Tên đăng nhập</label>
            <input type="text" id="username" name="username" class="form-control" th:placeholder="#{auth.username}" required
                   autofocus>
        </p>
        <p>
            <label for="password" class="sr-only" th:text="#{auth.password}">Mật khẩu</label>
            <input type="password" id="password" name="password" class="form-control" th:placeholder="#{auth.password}" required>
        </p>
        <button class="btn btn-lg btn-primary btn-block" type="submit" th:text="#{auth.login}">Đăng nhập</button>
    </form>
</div>
</body>
</html>
