name: Phát hành Novel Plus

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Kiểm tra trước khi phát hành
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MYSQL_DATABASE: novel_plus
      MYSQL_USER: novel
      MYSQL_HOST_PORT: '3307'
      MAVEN_CMD: mvn

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Sinh secret integration dùng một lần
        shell: bash
        run: |
          {
            echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 48)"
            echo "MYSQL_APP_PASSWORD=$(openssl rand -hex 48)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 48)"
            echo "JWT_SECRET=$(openssl rand -hex 64)"
            echo "CACHE_MANAGER_PASSWORD=$(openssl rand -hex 48)"
            echo "CRAWLER_ADMIN_PASSWORD=CiCrawler!$(openssl rand -hex 24)"
            echo "ADMIN_BOOTSTRAP_PASSWORD=CiAdmin!$(openssl rand -hex 24)"
            echo "PII_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"

      - name: Kiểm tra Flyway và bất biến MySQL
        shell: pwsh
        run: ./scripts/verify-gamification.ps1 -StopAfter

      - name: Build và kiểm thử Maven reactor
        run: mvn -B -ntp clean verify -Pcentral-repo

      - name: Kiểm tra i18n, JavaScript và HTML
        run: node scripts/verify-i18n.mjs

      - name: Chặn token auth phía client và kiểm tra CSP
        shell: pwsh
        run: ./scripts/verify-csp.ps1

  images:
    name: Build và đẩy image ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: novel-front
            dockerfile: deploy/docker/Dockerfile
            target: front
          - image: novel-admin
            dockerfile: deploy/docker/Dockerfile
            target: admin
          - image: novel-crawl
            dockerfile: deploy/docker/Dockerfile
            target: crawl
          - image: novel-migrations
            dockerfile: deploy/flyway/Dockerfile
            target: ''

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo nhãn image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build và đẩy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release:
    name: Tạo GitHub Release
    needs: images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Tạo release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
