name: Gamification MySQL invariants

on:
  pull_request:
    paths:
      - '.github/workflows/gamification-mysql.yml'
      - 'compose.yaml'
      - 'pom.xml'
      - 'scripts/verify-gamification.ps1'
      - 'doc/sql/**'
      - 'novel-common/**'
      - 'novel-front/**'
      - 'novel-admin/**'
  push:
    branches:
      - main
      - master
      - 'codex/**'
    paths:
      - '.github/workflows/gamification-mysql.yml'
      - 'compose.yaml'
      - 'pom.xml'
      - 'scripts/verify-gamification.ps1'
      - 'doc/sql/**'
      - 'novel-common/**'
      - 'novel-front/**'
      - 'novel-admin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamification-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MYSQL_DATABASE: novel_plus
      MYSQL_USER: novel
      MYSQL_HOST_PORT: '3307'
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_APP_PASSWORD: ci-app-password
      REDIS_PASSWORD: ci-redis-password
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      CACHE_MANAGER_PASSWORD: ci-cache-password
      CRAWLER_ADMIN_PASSWORD: ci-crawler-password
      MAVEN_CMD: mvn

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify migration, triggers and concurrent writes
        shell: pwsh
        run: ./scripts/verify-gamification.ps1 -StopAfter

      - name: Capture MySQL diagnostics on failure
        if: failure()
        run: docker compose logs --no-color mysql
