name: ${COMPOSE_PROJECT_NAME:-novel-plus}

x-app-environment: &app-environment
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  SPRING_PROFILES_ACTIVE: prod
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
  SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
  SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
  CSP_ENFORCE: ${CSP_ENFORCE:-true}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${MYSQL_DATABASE:-novel_plus}
  DB_USERNAME: ${MYSQL_USER:-novel}
  DB_PASSWORD_FILE: /run/secrets/mysql_app_password
  DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
  SHARDING_SQL_SHOW: ${SHARDING_SQL_SHOW:-false}
  FINANCIAL_VOUCHER_ISSUANCE_ENABLED: ${FINANCIAL_VOUCHER_ISSUANCE_ENABLED:-false}
  PLATFORM_LEGAL_NAME: ${PLATFORM_LEGAL_NAME:-}
  PLATFORM_TAX_CODE: ${PLATFORM_TAX_CODE:-}
  GAMIFICATION_CONFIG_SOURCE: ${GAMIFICATION_CONFIG_SOURCE:-DB}
  GAMIFICATION_CONFIG_REFRESH_MS: ${GAMIFICATION_CONFIG_REFRESH_MS:-2000}
  GAMIFICATION_CONFIG_MAX_STALE_MS: ${GAMIFICATION_CONFIG_MAX_STALE_MS:-60000}
  GAMIFICATION_FORCE_DISABLE: ${GAMIFICATION_FORCE_DISABLE:-false}
  GAMIFICATION_VOTE_IP_HASH_KEY_ID: ${GAMIFICATION_VOTE_IP_HASH_KEY_ID:-v1}
  GAMIFICATION_VOTE_IP_HASH_SALT_FILE: /run/secrets/gamification_vote_ip_hash_salt
  READING_TICKET_ENABLED: ${READING_TICKET_ENABLED:-false}
  READING_TICKET_POLICY_VERSION: ${READING_TICKET_POLICY_VERSION:-v1}
  READING_TICKET_MAX_LOTS_PER_SPEND: ${READING_TICKET_MAX_LOTS_PER_SPEND:-20}
  READING_TICKET_EXPIRY_CRON: ${READING_TICKET_EXPIRY_CRON:-0 30 3 * * ?}
  READING_TICKET_EXPIRY_BATCH_SIZE: ${READING_TICKET_EXPIRY_BATCH_SIZE:-500}
  READING_TICKET_EXPIRY_MAX_LOTS_PER_USER: ${READING_TICKET_EXPIRY_MAX_LOTS_PER_USER:-1000}
  READING_SUBSCRIPTION_GRANT_CRON: ${READING_SUBSCRIPTION_GRANT_CRON:-0 10 0 * * ?}
  READING_SUBSCRIPTION_ZONE_ID: ${READING_SUBSCRIPTION_ZONE_ID:-Asia/Ho_Chi_Minh}
  READING_SUBSCRIPTION_GRANT_BATCH_SIZE: ${READING_SUBSCRIPTION_GRANT_BATCH_SIZE:-200}
  READING_SUBSCRIPTION_RENEWAL_ENABLED: ${READING_SUBSCRIPTION_RENEWAL_ENABLED:-false}
  READING_SUBSCRIPTION_RENEWAL_DELAY_MS: ${READING_SUBSCRIPTION_RENEWAL_DELAY_MS:-60000}
  READING_SUBSCRIPTION_RENEWAL_BATCH_SIZE: ${READING_SUBSCRIPTION_RENEWAL_BATCH_SIZE:-100}
  READING_SUBSCRIPTION_ADMIN_ACTIVATION_ENABLED: ${READING_SUBSCRIPTION_ADMIN_ACTIVATION_ENABLED:-false}
  GIFT_CODE_ENABLED: ${GIFT_CODE_ENABLED:-false}
  GIFT_CODE_HMAC_KEY_ID: ${GIFT_CODE_HMAC_KEY_ID:-legacy-v1}
  GIFT_CODE_HMAC_SECRET: ${GIFT_CODE_HMAC_SECRET:-disabled}
  GIFT_CODE_HMAC_VERIFICATION_KEYS: ${GIFT_CODE_HMAC_VERIFICATION_KEYS:-}
  GIFT_CODE_POLICY_VERSION: ${GIFT_CODE_POLICY_VERSION:-v1}

x-app-defaults: &app-defaults
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  mysql:
    build:
      context: .
      dockerfile: deploy/mysql/Dockerfile
    image: ${NOVEL_MYSQL_IMAGE:-novel-plus/mysql:${IMAGE_TAG:-local}}
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_plus}
      MYSQL_USER: ${MYSQL_USER:-novel}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app_password
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    volumes:
      - mysql-data:/var/lib/mysql
    secrets:
      - mysql_root_password
      - mysql_app_password
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/flyway/Dockerfile
    image: ${NOVEL_MIGRATIONS_IMAGE:-novel-plus/migrations:${IMAGE_TAG:-local}}
    environment:
      # Flyway dùng root để tạo trigger bất biến; ứng dụng vẫn dùng MYSQL_USER ít quyền hơn.
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-novel_plus}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      FLYWAY_USER: root
      FLYWAY_PASSWORD_FILE: /run/secrets/mysql_root_password
      FLYWAY_CONNECT_RETRIES: 60
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      PUSHGATEWAY_URL: http://pushgateway:9091
    depends_on:
      mysql:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
    secrets:
      - mysql_root_password
    restart: "no"

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      - /bin/sh
      - -ec
      - |
        password=$$(cat /run/secrets/redis_password)
        exec redis-server --appendonly yes --requirepass "$$password"
    volumes:
      - redis-data:/data
    secrets:
      - redis_password
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  pushgateway:
    build:
      context: .
      dockerfile: deploy/observability/pushgateway/Dockerfile
    image: ${NOVEL_PUSHGATEWAY_IMAGE:-novel-plus/pushgateway:${IMAGE_TAG:-local}}
    command:
      - --web.listen-address=:9091
      - --persistence.file=/pushgateway/metrics.db
      - --persistence.interval=5m
    expose:
      - "9091"
    volumes:
      - pushgateway-data:/pushgateway
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9091/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  front:
    <<: *app-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: front
    image: ${NOVEL_FRONT_IMAGE:-novel-plus/front:${IMAGE_TAG:-local}}
    environment:
      <<: *app-environment
      SPRING_APPLICATION_NAME: novel-front
      SERVER_PORT: 8083
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TEMPLATES_NAME: ${NOVEL_THEME:-green}
      PIC_SAVE_TYPE: 2
      PIC_SAVE_STORAGE: local
      PIC_SAVE_PATH: /data/pic
      CONTENT_SAVE_STORAGE: db
      CONTENT_SAVE_PATH: /data/books
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      AUTH_COOKIE_SECURE: "true"
      CACHE_MANAGER_PASSWORD_FILE: /run/secrets/cache_manager_password
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-disabled}
      SPRING_AI_OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      SPRING_AI_OPENAI_IMAGE_ENABLED: ${AI_IMAGE_ENABLED:-false}
      SPRING_AI_OPENAI_IMAGE_API_KEY: ${OPENAI_API_KEY:-disabled}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      VNPAY_ENABLED: ${VNPAY_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-disabled}
      VNPAY_HASH_SECRET_FILE: /run/secrets/vnpay_hash_secret
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8083/pay/vnpay/return}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_XU_PER_1000_VND: ${VNPAY_XU_PER_1000_VND:-100}
      VNPAY_ALLOWED_AMOUNTS_VND: ${VNPAY_ALLOWED_AMOUNTS_VND:-10000,30000,50000,100000,200000,500000}
      VNPAY_RECONCILIATION_ENABLED: ${VNPAY_RECONCILIATION_ENABLED:-true}
      VNPAY_SERVER_IP: ${VNPAY_SERVER_IP:-127.0.0.1}
      VNPAY_RECONCILIATION_DELAY_MS: ${VNPAY_RECONCILIATION_DELAY_MS:-300000}
      VNPAY_RECONCILIATION_INITIAL_DELAY_MS: ${VNPAY_RECONCILIATION_INITIAL_DELAY_MS:-60000}
      VNPAY_RECONCILIATION_MIN_AGE_MINUTES: ${VNPAY_RECONCILIATION_MIN_AGE_MINUTES:-20}
      VNPAY_RECONCILIATION_MAX_AGE_DAYS: ${VNPAY_RECONCILIATION_MAX_AGE_DAYS:-30}
      VNPAY_RECONCILIATION_BATCH_SIZE: ${VNPAY_RECONCILIATION_BATCH_SIZE:-50}
      VNPAY_RECURRING_ENABLED: ${VNPAY_RECURRING_ENABLED:-false}
      VNPAY_RECURRING_BASE_URL: ${VNPAY_RECURRING_BASE_URL:-https://sandbox.vnpayment.vn}
      VNPAY_RECURRING_CLIENT_ID: ${VNPAY_RECURRING_CLIENT_ID:-disabled}
      VNPAY_RECURRING_USERNAME: ${VNPAY_RECURRING_USERNAME:-disabled}
      VNPAY_RECURRING_PASSWORD_FILE: /run/secrets/vnpay_recurring_password
      VNPAY_RECURRING_CLIENT_SECRET_FILE: /run/secrets/vnpay_recurring_client_secret
      VNPAY_RECURRING_TMN_CODE: ${VNPAY_RECURRING_TMN_CODE:-disabled}
      VNPAY_RECURRING_HASH_SECRET_FILE: /run/secrets/vnpay_recurring_hash_secret
      VNPAY_RECURRING_PAY_URL: ${VNPAY_RECURRING_PAY_URL:-https://sandbox.vnpayment.vn/recurring-payment/pay}
      VNPAY_RECURRING_QUERY_URL: ${VNPAY_RECURRING_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RECURRING_SERVER_IP: ${VNPAY_RECURRING_SERVER_IP:-127.0.0.1}
      VNPAY_RECURRING_RETURN_URL: ${VNPAY_RECURRING_RETURN_URL:-http://localhost:8083/payment/vnpay-recurring/return}
      VNPAY_RECURRING_CANCEL_URL: ${VNPAY_RECURRING_CANCEL_URL:-http://localhost:8083/payment/vnpay-recurring/cancel}
      VNPAY_RECURRING_RESULT_REDIRECT_URL: ${VNPAY_RECURRING_RESULT_REDIRECT_URL:-/user/reading_tickets.html}
      VNPAY_RECURRING_ORDER_TYPE: ${VNPAY_RECURRING_ORDER_TYPE:-other}
      VNPAY_RECURRING_CONNECT_TIMEOUT_SECONDS: ${VNPAY_RECURRING_CONNECT_TIMEOUT_SECONDS:-5}
      VNPAY_RECURRING_REQUEST_TIMEOUT_SECONDS: ${VNPAY_RECURRING_REQUEST_TIMEOUT_SECONDS:-15}
      VNPAY_RECURRING_QUERY_DELAY_MS: ${VNPAY_RECURRING_QUERY_DELAY_MS:-300000}
      VNPAY_RECURRING_REVOCATION_DELAY_MS: ${VNPAY_RECURRING_REVOCATION_DELAY_MS:-60000}
      VNPAY_RECURRING_REVOCATION_RETRY_DELAY_MS: ${VNPAY_RECURRING_REVOCATION_RETRY_DELAY_MS:-300000}
      VNPAY_RECURRING_REVOCATION_LEASE_MS: ${VNPAY_RECURRING_REVOCATION_LEASE_MS:-60000}
      VNPAY_RECURRING_REVOCATION_BATCH_SIZE: ${VNPAY_RECURRING_REVOCATION_BATCH_SIZE:-50}
      VIETQR_ENABLED: ${VIETQR_ENABLED:-false}
      VIETQR_BANK_BIN: ${VIETQR_BANK_BIN:-disabled}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-disabled}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-disabled}
      VIETQR_WEBHOOK_SECRET_FILE: /run/secrets/vietqr_webhook_secret
      AUTHOR_PAYOUT_ENABLED: ${AUTHOR_PAYOUT_ENABLED:-false}
      AUTHOR_PAYOUT_VND_PER_XU: ${AUTHOR_PAYOUT_VND_PER_XU:-10}
      AUTHOR_PAYOUT_MIN_XU: ${AUTHOR_PAYOUT_MIN_XU:-100000}
      AUTHOR_PAYOUT_REQUEST_OPEN_DAY: ${AUTHOR_PAYOUT_REQUEST_OPEN_DAY:-1}
      AUTHOR_PAYOUT_REQUEST_CLOSE_DAY: ${AUTHOR_PAYOUT_REQUEST_CLOSE_DAY:-10}
      AUTHOR_EDITOR_SCHEDULE_BATCH_SIZE: ${AUTHOR_EDITOR_SCHEDULE_BATCH_SIZE:-20}
      AUTHOR_EDITOR_SCHEDULE_DELAY_MS: ${AUTHOR_EDITOR_SCHEDULE_DELAY_MS:-30000}
      AUTHOR_EDITOR_SCHEDULE_INITIAL_DELAY_MS: ${AUTHOR_EDITOR_SCHEDULE_INITIAL_DELAY_MS:-30000}
      NOTIFICATION_CHAPTER_SCHEDULE_DELAY_MS: ${NOTIFICATION_CHAPTER_SCHEDULE_DELAY_MS:-15000}
      NOTIFICATION_CHAPTER_SCHEDULE_INITIAL_DELAY_MS: ${NOTIFICATION_CHAPTER_SCHEDULE_INITIAL_DELAY_MS:-15000}
      NOVEL_FILE_ENDPOINT: ${OSS_ENDPOINT:-disabled}
      NOVEL_FILE_KEY_ID: ${OSS_KEY_ID:-disabled}
      NOVEL_FILE_KEY_SECRET: ${OSS_KEY_SECRET:-disabled}
      NOVEL_FILE_BUCKET_NAME: ${OSS_BUCKET_NAME:-disabled}
      NOVEL_FILE_FILE_HOST: ${OSS_FILE_HOST:-pic}
      NOVEL_FILE_WEB_URL: ${OSS_WEB_URL:-http://localhost:8083/pic}
    expose:
      - "8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - novel-media:/data/pic
      - novel-books:/data/books
    secrets:
      - mysql_app_password
      - redis_password
      - jwt_secret
      - cache_manager_password
      - pii_encryption_key
      - vnpay_hash_secret
      - vnpay_recurring_password
      - vnpay_recurring_client_secret
      - vnpay_recurring_hash_secret
      - vietqr_webhook_secret
      - gamification_vote_ip_hash_salt

  crawl:
    <<: *app-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: crawl
    image: ${NOVEL_CRAWL_IMAGE:-novel-plus/crawl:${IMAGE_TAG:-local}}
    environment:
      <<: *app-environment
      SPRING_APPLICATION_NAME: novel-crawl
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CRAWLER_ADMIN_USERNAME: ${CRAWLER_ADMIN_USERNAME:-admin}
      CRAWLER_ADMIN_PASSWORD_FILE: /run/secrets/crawler_admin_password
      AUTH_COOKIE_SECURE: "true"
      CONTENT_SAVE_STORAGE: db
      CONTENT_SAVE_PATH: /data/books
      MAIL_HOST: ${MAIL_HOST:-smtp.example.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_NICKNAME: ${MAIL_NICKNAME:-novel-plus}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-disabled}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-disabled}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${CRAWLER_MAIL_HEALTH_ENABLED:-false}
      DISK_MONITOR_ENABLED: ${DISK_MONITOR_ENABLED:-false}
      DISK_MONITOR_RECIPIENTS: ${DISK_MONITOR_RECIPIENTS:-}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider --user=\"$$CRAWLER_ADMIN_USERNAME\" --password=\"$$(cat /run/secrets/crawler_admin_password)\" http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - novel-media:/data/pic
      - novel-books:/data/books
    secrets:
      - mysql_app_password
      - redis_password
      - crawler_admin_password
      - gamification_vote_ip_hash_salt

  admin:
    <<: *app-defaults
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
      target: admin
    image: ${NOVEL_ADMIN_IMAGE:-novel-plus/admin:${IMAGE_TAG:-local}}
    environment:
      <<: *app-environment
      SPRING_APPLICATION_NAME: novel-admin
      SERVER_PORT: 80
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD_FILE: /run/secrets/redis_password
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin_bootstrap_password
      AUTH_COOKIE_SECURE: "true"
      JAVA2NB_UPLOAD_PATH: /data/pic/
      PII_ENCRYPTION_KEY_FILE: /run/secrets/pii_encryption_key
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - novel-media:/data/pic
    secrets:
      - mysql_app_password
      - redis_password
      - admin_bootstrap_password
      - pii_encryption_key
      - gamification_vote_ip_hash_salt

  alertmanager:
    build:
      context: .
      dockerfile: deploy/observability/alertmanager/Dockerfile
    image: ${NOVEL_ALERTMANAGER_IMAGE:-novel-plus/alertmanager:${IMAGE_TAG:-local}}
    environment:
      ALERTMANAGER_WEBHOOK_URL_FILE: /run/secrets/alertmanager_webhook_url
      ALERTMANAGER_ALLOW_HTTP: ${ALERTMANAGER_ALLOW_HTTP:-false}
    expose:
      - "9093"
    volumes:
      - alertmanager-data:/alertmanager
    secrets:
      - alertmanager_webhook_url
    healthcheck:
      test: ["CMD", "/bin/amtool", "--alertmanager.url=http://127.0.0.1:9093", "config", "show"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    depends_on:
      front:
        condition: service_healthy
      admin:
        condition: service_healthy
      crawl:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
    expose:
      - "9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: deploy/observability/grafana/Dockerfile
    image: ${NOVEL_GRAFANA_IMAGE:-novel-plus/grafana:${IMAGE_TAG:-local}}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_DOMAIN: ${NOVEL_GRAFANA_DOMAIN:-grafana.localhost}
      GF_SERVER_ROOT_URL: https://${NOVEL_GRAFANA_DOMAIN:-grafana.localhost}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_LOG_MODE: console
      GF_LOG_FORMAT: json
    depends_on:
      prometheus:
        condition: service_started
    expose:
      - "3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy/Dockerfile
    image: ${NOVEL_CADDY_IMAGE:-novel-plus/caddy:${IMAGE_TAG:-local}}
    environment:
      NOVEL_DOMAIN: ${NOVEL_DOMAIN:-localhost}
      NOVEL_ADMIN_DOMAIN: ${NOVEL_ADMIN_DOMAIN:-admin.localhost}
      NOVEL_CRAWL_DOMAIN: ${NOVEL_CRAWL_DOMAIN:-crawl.localhost}
      NOVEL_GRAFANA_DOMAIN: ${NOVEL_GRAFANA_DOMAIN:-grafana.localhost}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-ops@example.com}
      CADDY_MAX_UPLOAD_SIZE: ${CADDY_MAX_UPLOAD_SIZE:-25MB}
      CADDY_RATE_LIMIT_REQUESTS: ${CADDY_RATE_LIMIT_REQUESTS:-600}
      CADDY_WRITE_RATE_LIMIT_REQUESTS: ${CADDY_WRITE_RATE_LIMIT_REQUESTS:-120}
    depends_on:
      front:
        condition: service_healthy
      admin:
        condition: service_healthy
      crawl:
        condition: service_healthy
      grafana:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  backup:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${NOVEL_BACKUP_IMAGE:-novel-plus/backup:${IMAGE_TAG:-local}}
    entrypoint: ["/usr/local/bin/novel-backup"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_plus}
      MYSQL_USER: root
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_root_password
      - backup_encryption_password
    volumes:
      - ${BACKUP_DIR:-./tmp/backups}:/backups
      - backup-work:/work
      - novel-media:/data/media:ro
      - novel-books:/data/books:ro
    security_opt:
      - no-new-privileges:true
    restart: "no"

  restore:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${NOVEL_BACKUP_IMAGE:-novel-plus/backup:${IMAGE_TAG:-local}}
    entrypoint: ["/usr/local/bin/novel-restore"]
    user: "0:0"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_plus}
      MYSQL_USER: root
      BACKUP_ARCHIVE: ${BACKUP_ARCHIVE:-}
      RESTORE_CONFIRM: ${RESTORE_CONFIRM:-}
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_root_password
      - backup_encryption_password
    volumes:
      - ${BACKUP_DIR:-./tmp/backups}:/backups:ro
      - backup-work:/work
      - novel-media:/data/media
      - novel-books:/data/books
    security_opt:
      - no-new-privileges:true
    restart: "no"

  restore-drill:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    image: ${NOVEL_BACKUP_IMAGE:-novel-plus/backup:${IMAGE_TAG:-local}}
    entrypoint: ["/usr/local/bin/novel-restore"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novel_plus}
      MYSQL_USER: root
      BACKUP_ARCHIVE: ${BACKUP_ARCHIVE:-}
      RESTORE_CONFIRM: RESTORE_DRILL
      RESTORE_DRILL: "true"
    depends_on:
      mysql:
        condition: service_healthy
    secrets:
      - mysql_root_password
      - backup_encryption_password
    volumes:
      - ${BACKUP_DIR:-./tmp/backups}:/backups:ro
      - backup-work:/work
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  mysql-data:
  redis-data:
  novel-media:
  novel-books:
  caddy-data:
  caddy-config:
  backup-work:
  prometheus-data:
  alertmanager-data:
  pushgateway-data:
  grafana-data:

secrets:
  mysql_root_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_root_password
  mysql_app_password:
    file: ${SECRETS_DIR:-./secrets}/mysql_app_password
  redis_password:
    file: ${SECRETS_DIR:-./secrets}/redis_password
  jwt_secret:
    file: ${SECRETS_DIR:-./secrets}/jwt_secret
  cache_manager_password:
    file: ${SECRETS_DIR:-./secrets}/cache_manager_password
  pii_encryption_key:
    file: ${SECRETS_DIR:-./secrets}/pii_encryption_key
  gamification_vote_ip_hash_salt:
    file: ${SECRETS_DIR:-./secrets}/gamification_vote_ip_hash_salt
  admin_bootstrap_password:
    file: ${SECRETS_DIR:-./secrets}/admin_bootstrap_password
  crawler_admin_password:
    file: ${SECRETS_DIR:-./secrets}/crawler_admin_password
  backup_encryption_password:
    file: ${SECRETS_DIR:-./secrets}/backup_encryption_password
  vnpay_hash_secret:
    file: ${SECRETS_DIR:-./secrets}/vnpay_hash_secret
  vnpay_recurring_password:
    file: ${SECRETS_DIR:-./secrets}/vnpay_recurring_password
  vnpay_recurring_client_secret:
    file: ${SECRETS_DIR:-./secrets}/vnpay_recurring_client_secret
  vnpay_recurring_hash_secret:
    file: ${SECRETS_DIR:-./secrets}/vnpay_recurring_hash_secret
  vietqr_webhook_secret:
    file: ${SECRETS_DIR:-./secrets}/vietqr_webhook_secret
  alertmanager_webhook_url:
    file: ${SECRETS_DIR:-./secrets}/alertmanager_webhook_url
  grafana_admin_password:
