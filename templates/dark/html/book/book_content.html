<script>
    (function () {

        // Auto-save reading history to localStorage
        try {
            var bookName = $("#bookName").val() || $("h1.title").text() || "";
            var indexName = $("#indexName").val() || $(".chapterName").text() || "";
            var bookId = $("#bookIdHidden").val() || $("#bookId").val();
            var contentId = $("#contentIdHidden").val() || $("#chapterId").val();
            if (bookId && contentId) {
                localStorage.setItem('recent_read_history', JSON.stringify({
                    bookId: bookId,
                    contentId: contentId,
                    bookName: bookName,
                    indexName: indexName,
                    time: new Date().getTime()
                }));
            }
        } catch(e) {}

        // Lưu lịch sử đọc
        $.ajax({
            type: "POST",
            url: "/user/addReadHistory",
            data: {'bookId': $("#bookIdHidden").val(), 'preContentId': $("#contentIdHidden").val()},
            dataType: "json",
            success: function (data) {

            },
            error: function () {
            }
        })

        $("#content").css("min-height",($(window).height()-60)+"px");


    })();


</script>

<script language="javascript">getset1()</script>
<script language="javascript">
    var books = localStorage.getItem("historyBooks");
    var item = parseInt($("#bookIdHidden").val());
    if (books) {
        var booksArr = JSON.parse(books);
        if (booksArr.length >= 50) {
            booksArr.splice(0, 1);
        }
        var existingIndex = booksArr.indexOf(item);
        if (existingIndex >= 0) {
            booksArr.splice(existingIndex, 1);
        }
        booksArr[booksArr.length] = item;
    } else {
        var booksArr = [item];
    }

    localStorage.setItem("historyBooks", JSON.stringify(booksArr));//

    function toMyCollect() {
        window.location.href = "/user/favorites.html";
    }

    function buyBookIndex(){
        $.ajax({
            type: "POST",
            url: "/user/buyBookIndex",
            data: {'bookId':$("#bookIdHidden").val(),"bookName":$("#bookNameHidden").val(),
                "bookIndexId":$("#contentIdHidden").val(),"bookIndexName":$("#indexNameHidden").val()},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    location.reload();


                } else if(data.code == 1001){
                    // Chưa đăng nhập

                }else {
                    novelAlertText(data.msg);
                }

            },
            error: function () {
                layer.alert(novelMessage('auth.networkError', 'Không thể kết nối mạng'));
            }
        })

    }

    $.post("/book/addVisitCount", {"bookId": $("#bookIdHidden").val()}, function () {
    });

</script>
