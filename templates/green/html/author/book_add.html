<script language="javascript" type="text/javascript" th:inline="javascript">
    const selectUploadText = /*[[#{user.avatar.select}]]*/ 'Vui lòng chọn tệp ảnh để tải lên.';
    const nameRequiredText = /*[[#{author.work.name.required}]]*/ 'Tên truyện không được để trống.';
    const nameTooLongText = /*[[#{author.work.name.tooLong}]]*/ 'Tên truyện quá dài.';
    const coverRequiredText = /*[[#{author.work.cover.required}]]*/ 'Vui lòng chọn ảnh bìa.';
    const descriptionRequiredText = /*[[#{author.work.description.required}]]*/ 'Giới thiệu truyện không được để trống.';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';

    var categoryList = [];

    changeCatSelect(0);

    function picChange() {
        var file = $("#file0").val(); // Tên tệp.
        if (file != "") {

            if(checkPicUpload($("#file0")[0])) {
                $.ajaxFileUpload({
                    url: "/file/picUpload", // Endpoint tải tệp lên.
                    secureuri: false, // Plugin cũ không dùng secure URI.
                    fileElementId: "file0", // ID input tệp.
                    dataType: "json", // Kiểu phản hồi.
                    type: "post",
                    success: function (data) { // Xử lý phản hồi thành công.
                        if (data.code == 200) {
                            $("#picImage").attr("src", data.data);
                            $("#picUrl").val(data.data);
                        } else {
                            layer.alert(data.msg);
                        }

                    }

                });
            }
        } else {
            alert(selectUploadText);
        }



    }

    var lock = false;
    function addBook() {
        if(lock){
            return;
        }
        lock = true;



        var bookName = $("#bookName").val();
        if(!bookName){
            $("#LabErr").html(nameRequiredText);
            lock = false;
            return;
        }
        if(bookName.length > 20){
            $("#LabErr").html(nameTooLongText);
            lock = false;
            return;
        }

        var picUrl = $("#picUrl").val();
        if(!picUrl){
            $("#LabErr").html(coverRequiredText);
            lock = false;
            return;
        }

        var bookDesc = $("#bookDesc").val();
        if(!bookDesc){
            $("#LabErr").html(descriptionRequiredText);
            lock = false;
            return;
        }


        $.ajax({
            type: "POST",
            url: "/author/addBook",
            data: {'workDirection': $("#workDirection").val(),
                'catId':$("#catId").val(),'catName':$("#catId").find("option[value="+$("#catId").val()+"]").html(),
                'bookName':bookName,'picUrl':picUrl,'bookDesc':bookDesc},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    window.location.href = '/author/index.html';


                } else {
                    lock = false;
                    $("#LabErr").html(data.msg);
                }

            },
            error: function () {
                lock = false;
                layer.alert(networkErrorText);
            }
        })

    }

    function renderCategoryOptions(workdirection) {
        var categoryListHtml = "";
        for (var i = 0; i < categoryList.length; i++) {
            var category = categoryList[i];
            if (category.workDirection == workdirection) {
                categoryListHtml += ("<option value=\"" + category.id + "\">" + category.name + "</option>");
            }
        }
        $("#catId").html(categoryListHtml);
    }

    function changeCatSelect(workdirection){
        if(categoryList.length > 0){
            renderCategoryOptions(workdirection);
            return;
        }
        $.ajax({
            type: "get",
            url: "/book/listBookCategory",
            data: {},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    categoryList = data.data;
                    renderCategoryOptions(workdirection);
                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })
    }

</script>
