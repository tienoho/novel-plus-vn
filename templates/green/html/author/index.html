                <div id="divData" class="updateTable">

                            <th class="goread">

                            <th class="goread">
                                <span th:text="#{book.sort.views}">Lượt xem</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{author.yesterdaySubscriptions}">Lượt mua hôm qua</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{reader.updated}">Cập nhật</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{book.sort.words}">Tổng số chữ</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{common.actions}">Thao tác</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookList">


                        </tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage">
                    </div>
                </div>

<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/javascript/ajaxfileupload.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/date.js" type="text/javascript"></script>
<script src="/javascript/common.js" type="text/javascript"></script>

<script language="javascript" type="text/javascript" th:inline="javascript">
    const coverChangeText = /*[[#{author.cover.change}]]*/ 'Nhấn để đổi ảnh bìa';
    const updatedText = /*[[#{reader.updated}]]*/ 'Cập nhật';
    const chapterManagementText = /*[[#{author.chapterManagement}]]*/ 'Quản lý chương';
    const incomeQueryText = /*[[#{author.incomeQuery}]]*/ 'Xem thu nhập';
    const analyticsQueryText = /*[[#{author.analytics.query}]]*/ 'Xem phân tích';
    const storyBibleText = /*[[#{author.story.open}]]*/ 'Kho tư liệu';
    const collaboratorManagementText = /*[[#{author.collaboration.open}]]*/ 'Cộng tác viên';
    const workInfoText = /*[[#{author.workInfo}]]*/ 'Thông tin tác phẩm';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    const selectUploadText = /*[[#{user.avatar.select}]]*/ 'Vui lòng chọn tệp ảnh để tải lên.';
    var coverUpdateInterval;

    search(1, 5);

    function search(curr, limit) {
        clearInterval(coverUpdateInterval);
        $.ajax({
            type: "get",
            url: "/author/listBookByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookList = data.data.list;
                    if (bookList.length > 0) {
                        if(curr == 1 && bookList[0].picUrl == '/images/default.gif'){
                            coverUpdateInterval = setInterval(function(){
                                $.ajax({
                                    type: "get",
                                    url: "/author/queryAiGenPic",
                                    data: {'bookId': bookList[0].id},
                                    dataType: "json",
                                    success: function (data) {
                                        if(data.code == 200 && data.data){
                                            $("#cover"+bookList[0].id).attr("src", data.data);
                                            clearInterval(coverUpdateInterval);
                                        }
                                    }
                                  });
                            }, 3000);
                            setTimeout(() => {
                                clearInterval(coverUpdateInterval);
                            }, 10000);
                        }
                        $("#hasContentDiv").css("display", "block");
                        $("#noContentDiv").css("display", "none");
                        var bookListHtml = "";
                        for (var i = 0; i < bookList.length; i++) {
                            var book = bookList[i];
                            var coverInput = "";
                            if (book.canEditBook === true) {
                                coverInput = "<input class=\"opacity\" onchange=\"picChange('" + book.id + "')\"" +
                                    " type=\"file\" id=\"file" + book.id + "\" name=\"file\" title=\"" + coverChangeText + "\"" +
                                    " style=\"z-index:100;cursor:pointer;left:30px;top:0;width:60px;height:80px;opacity:0;position:absolute\"/>";
                            }
                            var actionHtml = "";
                            if (book.canManageChapters === true || book.canPublishChapters === true) {
                                actionHtml += "<a target='_blank' class='redBtn' href='/author/index_list.html?bookId=" + book.id + "'>" + chapterManagementText + "</a><br/>";
                            }
                            if (book.canManageStory === true) {
                                actionHtml += "<a target='_blank' href='/author/story_bible.html?bookId=" + book.id + "'>" + storyBibleText + "</a><br/>";
                            }
                            if (book.ownerAccess === true) {
                                actionHtml += "<a target='_blank' href='/author/author_income_detail.html?bookId=" + book.id + "'>" + incomeQueryText + "</a><br/>";
                                actionHtml += "<a target='_blank' href='/author/collaborators.html?bookId=" + book.id + "'>" + collaboratorManagementText + "</a><br/>";
                            }
                            if (book.canViewAnalytics === true) {
                                actionHtml += "<a target='_blank' href='/author/author_analytics.html?bookId=" + book.id + "'>" + analyticsQueryText + "</a><br/>";
                            }
                            actionHtml += "<a target='_blank' href='/book/" + book.id + ".html'>" + workInfoText + "</a>";
                            bookListHtml += (" <tr class=\"book_list\" vals=\"291\">\n" +
                                /* "                            <td class=\"style bookclass\">\n" +
                                 "                                ["+(i+1)+"]\n" +
                                 "                            </td>\n" +*/

                                "                            <td style=\"position: relative\" class=\"goread\">\n" +
                                coverInput +
                                "<img id=\"cover" + book.id + "\" width='50' height='70' src='" + book.picUrl + "'/><br/>" +                                "                                " + book.bookName + "</td>\n" +
                                "                            <td class=\"goread\" >"
                                + book.catName + "</td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.visitCount + "</td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.yesterdayBuy + "</td>\n" +

                                "                            <td class=\"goread\">\n" +
                                "                                " + updatedText + ": " + new Date(Date.parse(book.lastIndexUpdateTime ? book.lastIndexUpdateTime : book.updateTime)).Format("dd/MM/yyyy hh:mm") + "\n" +
                                "                            </td>\n" +

                                "                            <td class=\"goread\" valsc=\"291|2037554|1\">"
                                + book.wordCount + "</td>\n" +

                                " <td class=\"goread\" id='opt" + book.id + "'>" + actionHtml +
                                "</td>                     </tr>");
                        }
                        $("#bookList").html(bookListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'shellPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }


    function updateBookStatus(bookId, status) {

        $.ajax({
            type: "POST",
            url: "/author/updateBookStatus",
            data: {'bookId': bookId, 'status': status == 0 ? 1 : 0},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {

                    location.reload();


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })


    }


   function picChange(bookId) {
        var file = $("#file" + bookId).val(); // Tên tệp.
        if (file != "") {
            if (checkPicUpload($("#file" + bookId)[0])) {

                $.ajaxFileUpload({
                    url: "/file/picUpload", // Endpoint tải tệp lên.
                    secureuri: false, // Plugin cũ không dùng secure URI.
                    fileElementId: "file" + bookId, // ID input tệp.
                    dataType: "json", // Kiểu phản hồi.
                    type: "post",
                    success: function (data) { // Xử lý phản hồi thành công.
                        if (data.code == 200) {
                            let picUrl = data.data;
                            $.ajax({
                                type: "POST",
                                url: "/author/updateBookPic",
                                data: {'bookId': bookId, 'bookPic': data.data},
                                dataType: "json",
                                success: function (data) {
                                    if (data.code == 200) {
                                        $("#cover"+bookId).attr("src", picUrl);
                                    } else {
                                        layer.alert(data.msg);
                                    }

                                },
                                error: function () {
                                    layer.alert(networkErrorText);
                                }
                            })

                        } else {
                            layer.alert(data.msg);
                        }

                    }

                });
            }
        } else {
            alert(selectUploadText);
        }


    }
</script>
</html>
