<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{user.recentReading}+'_'+${application.website.name}"></title>
    <link rel="stylesheet" href="/css/user.css"/>
</head>
<body class="">

<div th:replace="common/top :: top('')">
</div>
<div class="main box_center cf">
    <div class="userBox cf">
        <div class="viewhistoryBox">
            <div class="my_bookshelf">
                <div class="title cf">
                    <h2 class="fl ml10"><a href="javascript:void(0);" class="red" th:text="#{user.recentReading}">Đọc gần đây</a></h2><i
                        class="fl ml20 mr20 font16">|</i>
                    <h2 class="fl"><a href="/user/favorites.html" th:text="#{user.bookshelf}">Tủ sách</a></h2>
                </div>
                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead>
                        <tr>
                            <th class="style">
                                <span th:text="#{book.category}">Danh mục truyện</span>
                            </th>
                            <th class="name">
                                <span th:text="#{book.name}">Tên truyện</span>
                            </th>
                            <th class="chapter">
                                <span th:text="#{book.latest}">Chương mới nhất</span>
                            </th>
                            <th class="time">
                                <span th:text="#{reader.updated}">Cập nhật</span>
                            </th>
                            <th class="goread">
                                <span th:text="#{user.bookmark}">Đánh dấu</span>
                            </th>
                        </tr>
                        </thead>
                        <tbody id="bookHistoryList">

                        <!--<tr class="book_list" vals="234">
                            <td class="style bookclass"></td>
                            <td class="name">
                                <a href="/book/234.html"></td>
                            <td class="chapter" valsc="234|2005456|1"></td>
                            <td class="time"></td>
                            <td class="goread"></td>
                        </tr>-->

                        </tbody>
                    </table>
                    <div class="pageBox cf" id="historyPage">
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
<div th:replace="common/footer :: footer">
</div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user.js" type="text/javascript"></script>
<script type="text/javascript" th:inline="javascript">
    const continueReadingText = /*[[#{user.continueReading}]]*/ 'Đọc tiếp';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    search(1, 10);

    function search(curr, limit) {

        $.ajax({
            type: "get",
            url: "/user/listReadHistoryByPage",
            data: {'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    var bookHistoryList = data.data.list;
                    if (bookHistoryList.length > 0) {
                        var bookHistoryListHtml = "";
                        for (var i = 0; i < bookHistoryList.length; i++) {
                            var book = bookHistoryList[i];
                            bookHistoryListHtml += (" <tr class=\"book_list\" vals=\"291\">\n" +
                                "                            <td class=\"style bookclass\">\n" +
                                "                                <a href=\"/book/bookclass.html?c=" + book.catId + "\" >[" + book.catName + "]</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"name\">\n" +
                                "                                <a href=\"/book/" + book.bookId + ".html\">\n" +
                                "                                    " + book.bookName + "</a>\n" +
                                "                            </td>\n" +
                                "                            <td class=\"chapter\" valsc=\"291|2037554|1\">\n" +
                                "<a href='/book/" + book.bookId + "/" + book.lastIndexId + ".html'>" + book.lastIndexName + "</a>" +
                                "                            </td>\n" +
                                "                            <td class=\"time\">\n" +
                                "                                " + book.lastIndexUpdateTime + "\n" +
                                "                            </td>\n" +
                                "                            <td class=\"goread\">\n" +
                                "<a href='/book/" + book.bookId + "/" + book.preContentId + ".html'>" + continueReadingText + "</a>" +
                                "                            </td>\n" +
                                "                        </tr>");
                        }
                        $("#bookHistoryList").html(bookHistoryListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'historyPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        search(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }
</script>
</body>
</html>
