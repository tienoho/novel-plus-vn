<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{user.nickname.change}+'_'+${application.website.name}"></title>
    <link rel="stylesheet" href="/css/user.css"/>
</head>
<body id="userSettingsPage" data-settings-mode="name"
      th:attr="data-nickname-required=#{user.nickname.required},
               data-nickname-invalid=#{user.nickname.invalid},
               data-network-error=#{auth.networkError}">

<div th:replace="common/top :: top('')"></div>
<main class="main box_center cf">
    <div class="userBox cf">
        <div class="my_l">
            <ul class="log_list">
                <li><a class="link_1" href="/user/userinfo.html" th:text="#{user.center}">Tài khoản của tôi</a></li>
                <li><a class="link_4" href="/user/favorites.html" th:text="#{user.bookshelf}">Tủ sách</a></li>
                <li><a class="link_6" href="/user/comment.html" th:text="#{user.comments}">Bình luận của tôi</a></li>
                <li><a class="link_7" href="/user/feedback_list.html" th:text="#{user.feedback}">Phản hồi của tôi</a></li>
                <li><a class="link_8 on" href="/user/setup.html" th:text="#{user.settings}">Cài đặt tài khoản</a></li>
            </ul>
        </div>
        <div class="my_r">
            <div class="my_info cf">
                <div class="my_info_txt">
                    <ul class="mytab_list">
                        <li><i class="tit" th:text="#{user.nickname}">Biệt danh</i>
                            <input name="txtNiceName" type="text" maxlength="11" id="txtNiceName" class="s_input"/>
                        </li>
                        <li><i class="tit">&nbsp;</i><span th:text="#{user.nickname.rule}">Biệt danh gồm chữ cái, chữ số hoặc dấu gạch dưới.</span></li>
                        <li><i class="tit">&nbsp;</i><button type="button" data-settings-action="update-name" id="btn" class="s_btn btn_red" th:text="#{common.change}">Thay đổi</button></li>
                        <li><i class="tit">&nbsp;</i><span id="LabErr"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/user-settings-page.js" type="text/javascript"></script>
</body>
</html>
