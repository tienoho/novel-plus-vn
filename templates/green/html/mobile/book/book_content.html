<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta th:if="${catId == 9}" name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=1">
    <meta th:if="${catId != 9}" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title th:text="${book.bookName}+' - '+${bookIndex.indexName}"></title>
    <meta name="keywords" th:content="${book.bookName}+','+${bookIndex.indexName}">
    <meta name="description" th:content="#{reader.seo.chapter.description(${book.bookName})}">
    <div th:include="mobile/common/css :: css"></div>
    <script>
        function reinitIframe() {
            var iframe=document.getElementById('frame_content');
            if (!iframe) return;
            try { iframe.height=iframe.contentWindow.document.documentElement.scrollHeight; } catch (ignored) {}
        }
        window.setInterval(reinitIframe,200);
    </script>
    <script src="/mobile/js/jquery-1.9.1.js"></script>
    <script src="/mobile/layui/layui.all.js"></script>
    <style>
        .line-limit-length { overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
        .indexP p a,a { color:#4c6978;text-decoration:none;border:0;cursor:pointer; }
        .Readarea { font-size:18px;line-height:35px;padding:10px;color:#333; }
        div,p { overflow-wrap:break-word;word-wrap:break-word;box-sizing:border-box; }
        .indexDiv a { margin-left:20px; }
        .Readpage { font-size:14px;padding:2px;background:#fff;height:40px;line-height:40px;text-align:center; }
        * { margin:0;padding:0; }
        .huyanon { border:1px solid #64c878;box-shadow:0 1px 2px #b9ecc4 inset,0 -1px 0 #6c9f76 inset;background:linear-gradient(#90dfa2,#84d494); }
        .Readpage a { font-size:16px;padding:2px;line-height:35px; }
        .lightoff,.huyanoff,.sizebgon { border:1px solid #333;box-shadow:0 1px 2px #8b8b8b inset,0 -1px 0 #3d3d3d inset;background:linear-gradient(#656565,#4c4c4c); }
        .button { line-height:38px;text-align:center;font-weight:bold;color:#fff;text-shadow:1px 1px 1px #333;border-radius:5px;margin-top:3px;position:relative;overflow:hidden; }
        .lighton { border:1px solid #d2a000;box-shadow:0 1px 2px #fedd71 inset,0 -1px 0 #a38b39 inset;background:linear-gradient(#fece34,#d8a605); }
    </style>
</head>
<body id="read">
<div id="content">
    <input type="hidden" id="bookIdHidden" th:value="${book.id}"/>
    <input type="hidden" id="bookNameHidden" th:value="${book.bookName}"/>
    <input type="hidden" id="contentIdHidden" th:value="${bookIndex.id}"/>
    <input type="hidden" id="indexNameHidden" th:value="${bookIndex.indexName}"/>
    <input type="hidden" id="indexNumHidden" th:value="${bookIndex.indexNum}"/>
    <input type="hidden" id="offlineEligible" value="true"
           th:if="${bookIndex.isVip == null || bookIndex.isVip != 1}"/>
    <input type="hidden" id="readerContentAvailable" value="true" th:if="${!needBuy}"/>

    <div style="height:50px;line-height:50px;text-align:center" class="layui-header header header-doc layui-bg-cyan">
        <div style="width:10%;float:left;margin-left:10px"><a href="javascript:history.go(-1)"><i style="font-size:20px;color:#fff" class="layui-icon">&#xe65c;</i></a></div>
        <a style="color:#fff" th:href="'/book/'+${book.id}+'.html'"><b style="padding-left:5%;float:left;width:69%" class="line-limit-length" th:text="${bookIndex.indexName}+' '+${book.bookName}"></b></a>
        <div style="width:10%;float:right;margin-right:10px"><a href="/"><i style="font-size:20px;color:#fff" class="layui-icon">&#xe68e;</i></a></div>
    </div>

    <p class="Readpage">
        <a id="lightdiv" class="button lightoff" onclick="nr_setbg('light')" th:text="#{reader.lightOff}">Tắt đèn</a>
        <a id="huyandiv" class="button huyanon" onclick="nr_setbg('huyan')" th:text="#{reader.eyeCare}">Bảo vệ mắt</a>&nbsp;&nbsp;
        <span th:text="#{reader.fontSize}+': '">Cỡ chữ: </span>
        <a id="fontbig" class="sizebg" onclick="nr_setbg('big')" th:text="#{reader.font.large}">Lớn</a>
        <a id="fontmiddle" class="button sizebgon" onclick="nr_setbg('middle')" th:text="#{reader.font.medium}">Vừa</a>
        <a id="fontsmall" class="sizebg" onclick="nr_setbg('small')" th:text="#{reader.font.small}">Nhỏ</a>
    </p>

    <div class="indexDiv" style="height:42px;line-height:42px;text-align:center;background:#f2f2f2">
        <a style="color:#333" th:href="'javascript:enterPreIndexPage(\''+${book.id}+'\',\''+${preBookIndexId}+'\');'" th:text="#{reader.previous}">Chương trước</a>
        <a style="color:#333" th:href="'/book/indexList-'+${book.id}+'.html'" th:text="#{book.catalog}">Mục lục</a>
        <a style="color:#333" th:href="'javascript:enterNextIndexPage(\''+${book.id}+'\',\''+${nextBookIndexId}+'\');'" th:text="#{reader.next}">Chương sau</a>
    </div>

    <div th:replace="mobile/common/js :: js"></div>
    <script src="/javascript/reader-tools.js?v=4"></script>
    <div id="chaptercontent" class="Readarea ReadAjax_content screen_container" style="color:#000;font-size:20px" th:if="${!needBuy}">
        <p style="width:100%;text-align:center;overflow:auto;-webkit-overflow-scrolling:touch"><span th:utext="${bookContent.content}"></span></p>
    </div>
    <div class="Readarea ReadAjax_content screen_container" style="color:#000;font-size:20px;background:#fff" th:if="${needBuy}">
        <h5 th:text="#{reader.vip.required}">Đây là chương VIP. Bạn cần mua chương để tiếp tục đọc.</h5>
        <span th:text="#{book.price}+': '">Giá: </span><span style="color:red" th:text="${bookIndex.bookPrice}+' '+#{payment.currency}+' ('+#{reader.vip.rate}+')'"></span><br/>
        <a href="javascript:buyBookIndex()" type="button" class="layui-btn layui-btn-sm layui-btn-radius" th:text="#{book.buy}">Mua chương</a>
    </div>

    <div class="indexDiv" style="height:42px;line-height:42px;text-align:center;background:#f2f2f2">
        <a style="color:#333" th:href="'javascript:enterPreIndexPage(\''+${book.id}+'\',\''+${preBookIndexId}+'\');'" th:text="#{reader.previous}">Chương trước</a>
        <a style="color:#333" th:href="'/book/indexList-'+${book.id}+'.html'" th:text="#{book.catalog}">Mục lục</a>
        <a style="color:#333" th:href="'javascript:enterNextIndexPage(\''+${book.id}+'\',\''+${nextBookIndexId}+'\');'" th:text="#{reader.next}">Chương sau</a>
    </div>
</div>
<div th:replace="mobile/common/footer :: footer"></div>

<script src="/mobile/js/read.js?v=4"></script>
<script>getset();getset1();</script>
<script th:inline="javascript">
    (function(){
        $.ajax({type:'POST',url:'/user/addReadHistory',data:{bookId:$('#bookIdHidden').val(),preContentId:$('#contentIdHidden').val()},dataType:'json'});
    })();

    var books=localStorage.getItem('historyBooks');
    var item=parseInt($('#bookIdHidden').val(),10);
    var booksArr=books?JSON.parse(books):[];
    if(booksArr.length>=50) booksArr.splice(0,1);
    var oldIndex=booksArr.indexOf(item);
    if(oldIndex>=0) booksArr.splice(oldIndex,1);
    booksArr.push(item);
    localStorage.setItem('historyBooks',JSON.stringify(booksArr));

    function toMyCollect(){
        var token=localStorage.getItem('token');
        window.location.href=token?'/book/search?token='+token:'/user/login.html';
    }

    function buyBookIndex(){
        $.ajax({
            type:'POST',url:'/user/buyBookIndex',data:{bookId:$('#bookIdHidden').val(),bookName:$('#bookNameHidden').val(),bookIndexId:$('#contentIdHidden').val(),bookIndexName:$('#indexNameHidden').val()},dataType:'json',
            success:function(data){
                if(data.code===200) location.reload();
                else if(data.code===1001) location.href='/user/login.html?originUrl='+encodeURIComponent(location.href);
                else layer.alert(data.msg);
            },
            error:function(){ layer.alert(/*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng'); }
        });
    }

    $.post('/book/addVisitCount',{bookId:$('#bookIdHidden').val()},function(){});
    function enterPreIndexPage(bookId,bookIndexId){ window.location.href=bookIndexId!=0?'/book/'+bookId+'/'+bookIndexId+'.html':'/book/indexList-'+bookId+'.html'; }
    function enterNextIndexPage(bookId,bookIndexId){ window.location.href=bookIndexId!=0?'/book/'+bookId+'/'+bookIndexId+'.html':'/book/indexList-'+bookId+'.html'; }

</script>
</body>
</html>
