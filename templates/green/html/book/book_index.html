<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="vi" xmlns="http://www.w3.org/1999/xhtml">
<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="#{book.seo.catalog(${book.bookName})}+' - '+${application.website.name}"></title>
    <meta name="keywords" th:content="${book.bookName}+','+#{book.catalog}+','+#{book.latest}"/>
    <meta name="description"
          th:content="#{book.seo.description(${application.website.name},${book.bookName})}"/>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="/css/book.css"/>
</head>
<body>

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf">
    <div class="nav_sub">
        <a href="/" th:text="${application.website.name}"></a>&gt;<a th:href="'/book/bookclass.html?c='+${book.catId}" th:text="${book.catName}"></a>&gt;<a
            th:href="'/book/'+${book.id}+'.html'" th:text="${book.bookName}"></a>&gt;<a
            th:href="'/book/indexList-'+${book.id}+'.html'" th:text="#{book.catalog}">Mục lục tác phẩm</a>
    </div>
    <div class="channelWrap channelChapterlist cf mb50">

        <div class="bookMain">
            <div class="bookCover cf">
                <div class="book_info1">
                    <div class="tit">
                        <h1 th:text="${book.bookName}"></h1><!--<i class="vip_b">VIP</i>-->
                    </div>
                    <ul class="list">
                        <li>
                            <span><span th:text="#{book.author}+': '">Tác giả: </span><span th:text="${book.authorName}"></span></span>
                            <span><span th:text="#{book.category}+': '">Thể loại: </span><a th:href="'/book/bookclass.html?c='+${book.catId}" th:text="${book.catName}"></a></span>
                            <span th:switch="${book.bookStatus}"><span th:text="#{book.status}+': '">Trạng thái: </span><em class="black3" th:case="'0'" th:text="#{book.status.serializing}">Đang ra</em><em class="black3"
                                                                                  th:case="*" th:text="#{book.status.completed}">Đã hoàn thành</em></span>
                            <span><span th:text="#{book.visits}+': '">Tổng lượt xem: </span><em class="black3" id="cTotal" th:text="${book.visitCount}"></em></span>
                            <span><span th:text="#{book.words}+': '">Tổng số chữ: </span><em class="black3" th:text="${book.wordCount}"></em></span>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="dirWrap cf">
                <h3 th:text="#{book.mainText}+' ('+${bookIndexCount}+')'"></h3>
                <div class="dirList">
                    <ul th:each="bookIndex : ${bookIndexList}">
                        <li><a th:if="${bookIndex.isVip} != '1'" th:href="'/book/'+${book.id}+'/'+${bookIndex.id}+'.html'" >
                            <span th:text="${bookIndex.indexName}"></span><i class="red" th:text="' ['+#{book.free}+']'"> [Miễn phí]</i>
                        </a>
                            <a th:if="${bookIndex.isVip} == '1'" th:href="'/book/'+${book.id}+'/'+${bookIndex.id}+'.html'" th:text="${bookIndex.indexName}">
                            </a></li>
                    </ul>
                </div>
            </div>


        </div>
    </div>

    <div th:replace="common/footer :: footer">
    </div>
    <div th:replace="common/js :: js"></div>
    <script src="/javascript/bookdetail.js" type="text/javascript"></script>

</body>
</html>
