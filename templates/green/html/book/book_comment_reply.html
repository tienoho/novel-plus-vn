<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{},~{::link},~{})">
    <title th:text="#{comment.replyArea}">Khu vực trả lời bình luận</title>
    <link href="/css/main.css" rel="stylesheet"/>
    <link href="/css/book.css" rel="stylesheet"/>
</head>
<body>

<input type="hidden" id="commentId" th:value="${commentId}"/>

<div th:replace="common/top :: top('')">
</div>

<div class="main box_center cf mb50">
    <div class="channelBookContent cf">
        <!--left start-->
        <div class="wrap_left fl">
            <div class="wrap_bg">
                <div class="pad20">

                    <div class="bookComment">
                        <div class="book_tit">
                            <div class="fl">
                                <h3 th:text="#{comment.replyArea}">Khu vực trả lời bình luận</h3><span id="bookCommentTotal">(0)</span>
                            </div>
                            <a class="fr" href="#txtComment" th:text="#{comment.publishReply}">Gửi trả lời</a>
                        </div>
                        <blockquote class="layui-elem-quote" th:utext="${commentContent}">
                        </blockquote>
                        <div class="no_comment" id="noCommentPanel" style="display: none;">
                            <img src="/images/no_comment.png" alt=""/>
                            <span class="block" th:text="#{comment.emptyReply}">Chưa có trả lời</span>
                        </div>
                        <div class="commentBar" id="commentPanel">

                        </div>
                        <div class="pageBox cf mt15 mr10" id="commentPage">
                        </div>

                        <div class="reply_bar" id="reply_bar">
                            <div class="tit">
                                <span class="fl font16" th:text="#{comment.publishReply}">Gửi trả lời</span>
                                <!-- Khi chưa đăng nhập, hiển thị liên kết xác thực thay cho form. -->
                                <span class="fr black9" style="display:none; "><span th:text="#{comment.loginRequired}">Vui lòng đăng nhập trước</span> <a class="orange"
                                                                                       href="/user/login.html" th:text="#{site.login}">Đăng nhập</a><em
                                        class="ml10 mr10">|</em><a class="orange"
                                                                   href="/user/register.html" th:text="#{site.register}">Đăng ký</a></span>
                            </div>
                            <textarea name="txtComment" rows="2" cols="20" id="txtComment" class="replay_text"
                                      th:placeholder="#{comment.placeholder}"></textarea>
                            <div class="reply_btn">
                                <span class="fl black9"><em class="ml5" id="emCommentNum">0/1000</em> <span th:text="#{comment.characters}">ký tự</span></span>
                                <span class="fr"><a class="btn_ora" href="javascript:void(0);"
                                                    onclick="javascript:BookDetail.SaveCommentReply(37,0,$('#txtComment').val());" th:text="#{comment.publishReply}">Gửi trả lời</a></span>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <!--left end-->

        <!--right start-->

        <!--right end-->
    </div>
</div>

<div th:replace="common/footer :: footer">
</div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/bookdetail.js" type="text/javascript"></script>
<script language="javascript" type="text/javascript" th:inline="javascript">
    const itemUnitText = /*[[#{comment.itemUnit}]]*/ 'bình luận';
    const traineeText = /*[[#{comment.trainee}]]*/ 'Thành viên mới';
    const readerText = /*[[#{comment.reader}]]*/ 'độc giả';
    const floorText = /*[[#{comment.floor}]]*/ 'tầng';
    const unlikeText = /*[[#{comment.unlike}]]*/ 'Không thích';
    const likeText = /*[[#{comment.like}]]*/ 'Thích';
    const networkErrorText = /*[[#{auth.networkError}]]*/ 'Không thể kết nối mạng';
    $('#txtComment').on('input propertychange', function () {
        var count = $(this).val().length;
        $('#emCommentNum').html(count + "/1000");
        if (count > 1000) {
            $('#txtComment').val($('#txtComment').val().substring(0, 1000));
        }
    });
    loadCommentList(1, 20);

    function loadCommentList(curr, limit) {

        $.ajax({
            type: "get",
            url: "/book/listCommentReplyByPage",
            data: {'commentId': $("#commentId").val(), 'curr': curr, 'limit': limit},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    if (data.data.total == 0) {
                        $("#noCommentPanel").css("display", "block");
                        $("#commentPanel").css("display", "none");
                        return;
                    }
                    $("#noCommentPanel").css("display", "none");
                    $("#commentPanel").css("display", "block");
                    var commentList = data.data.list;
                    if (commentList.length > 0) {
                        $("#bookCommentTotal").html("(" + data.data.total + " " + itemUnitText + ")");
                        var commentListHtml = "";
                        for (var i = 0; i < commentList.length; i++) {
                            var comment = commentList[i];
                            commentListHtml += ("<div class=\"comment_list cf\">" +
                                "<div class=\"user_heads fl\" vals=\"389\">" +
                                "<img src=\"" + (comment.createUserPhoto ? comment.createUserPhoto : '/images/man.png') + "\" class=\"user_head\" alt=\"\">" +
                                "<span class=\"user_level1\" style=\"display: none;\">" + traineeText + "</span></div>" +
                                "<ul class=\"pl_bar fr\">\t\t\t<li class=\"name\">" + (comment.createUserName) + "<span style='padding-left: 10px' class=\"other\">" + (comment.location ? comment.location + " " + readerText : '') + "</span></li><li class=\"dec\">" +
                                comment.replyContent +
                                "</li><li class=\"other cf\">" +
                                "<span class=\"time fl\" style='padding-right: 10px'>" + (data.data.total - ((curr - 1) * limit + i)) + " " + floorText + "</span>" +
                                "<span class=\"time fl\">" + comment.createTime + "</span>" +
                                "<span class=\"fr\"><a href=\"javascript:toggleCommentUnLike('"+comment.id+"')\"  class=\"zan\"  style=\"padding-left: 10px\">"+unlikeText+"<i class=\"num\" id='unLikeCount"+comment.id+"'>("+comment.unLikesCount+")</i></a></span>" +
                                "<span class=\"fr\"><a href=\"javascript:toggleCommentLike('"+comment.id+"')\"  class=\"zan\" style=\"padding-left: 10px\">"+likeText+"<i class=\"num\" id='likeCount"+comment.id+"'>("+comment.likesCount+")</i></a></span>" +
                                "</li>\t\t</ul>\t</div>");
                        }
                        $("#commentPanel").html(commentListHtml);

                        layui.use('laypage', function () {
                            var laypage = layui.laypage;

                            // Khởi tạo phân trang Layui.
                            laypage.render({
                                elem: 'commentPage' // ID phần tử, không thêm dấu #.
                                , count: data.data.total // Tổng số bản ghi từ máy chủ.
                                , curr: data.data.pageNum
                                , limit: data.data.pageSize
                                , jump: function (obj, first) {


                                    // obj chứa các tham số phân trang hiện tại.
                                    console.log(obj.curr); // Trang hiện tại.
                                    console.log(obj.limit); // Số bản ghi mỗi trang.


                                    // Không gọi lại trong lần khởi tạo đầu tiên.
                                    if (!first) {
                                        loadCommentList(obj.curr, obj.limit);
                                    } else {

                                    }
                                }
                            });
                        });

                    }


                } else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }

    function toggleCommentLike(replyId) {
        $.ajax({
            type: "post",
            url: "/book/toggleReplyLike",
            data: {'replyId': replyId},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#likeCount"+replyId).text("("+data.data+")")
                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                }  else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }

    function toggleCommentUnLike(replyId) {
        $.ajax({
            type: "post",
            url: "/book/toggleReplyUnLike",
            data: {'replyId': replyId},
            dataType: "json",
            success: function (data) {
                if (data.code == 200) {
                    $("#unLikeCount"+replyId).text("("+data.data+")")
                } else if (data.code == 1001) {
                    // Phiên đăng nhập đã hết hạn.
                    location.href = '/user/login.html?originUrl=' + encodeURIComponent(location.href);

                }  else {
                    layer.alert(data.msg);
                }

            },
            error: function () {
                layer.alert(networkErrorText);
            }
        })

    }
</script>
</body>
</html>
