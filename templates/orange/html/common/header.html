<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common_head(title,meta,links,script)">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="theme-color" content="#ff7700"/>
    <meta name="application-name" content="Khởi Thư"/>
    <meta property="og:type" content="website"/>
    <meta property="og:title" th:content="${application.website.name}"/>
    <meta property="og:description" th:content="${application.website.description}"/>
    <meta property="og:image" content="/images/logo.png"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <link rel="manifest" href="/manifest.json"/>
    <title th:replace="${title}">Khởi Thư</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/swiper-bundle.min.css"/>
    <th:block th:replace="${meta}"/>
    <th:block th:replace="${links}"/>
    <th:block th:replace="${script}"/>
</head>
<body>

</body>
</html>
