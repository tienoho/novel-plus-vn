<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title th:text="#{author.system}">Hệ thống quản lý tác giả</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/author-index-page.css"/>
</head>
<body>
<header class="header">
    <div class="mainNav" id="mainNav">
        <div class="box_center cf author-page-title" th:text="#{author.system}">Hệ thống quản lý tác giả</div>
    </div>
</header>
<main class="main box_center cf" id="authorBookPage"
      data-cover-change="" data-updated="" data-previous-page="" data-next-page=""
      data-chapters="" data-income="" data-analytics="" data-story="" data-collaborators=""
      data-work-info="" data-network-error="" data-select-upload=""
      th:attr="data-cover-change=#{author.cover.change},data-updated=#{reader.updated},
               data-previous-page=#{notification.previousPage},data-next-page=#{notification.nextPage},
               data-chapters=#{author.chapterManagement},data-income=#{author.incomeQuery},
               data-analytics=#{author.analytics.query},data-story=#{author.story.open},
               data-collaborators=#{author.collaboration.open},data-work-info=#{author.workInfo},
               data-network-error=#{auth.networkError},data-select-upload=#{user.avatar.select}">
    <div class="userBox cf">
        <nav class="my_l" th:aria-label="#{author.system}">
            <ul class="log_list">
                <li><a class="link_4 on" href="/author/index.html" th:text="#{author.management}">Quản lý truyện</a></li>
                <li><a class="link_4" href="/author/draft_list.html" th:text="#{author.draft.management}">Quản lý bản nháp</a></li>
                <li><a class="link_2" href="/author/author_income_detail.html" th:text="#{author.income}">Thu nhập nhuận bút</a></li>
                <li><a class="link_2" href="/author/author_analytics.html" th:text="#{author.analytics}">Phân tích độc giả</a></li>
            </ul>
        </nav>
        <section class="my_r">
            <div id="noContentDiv">
                <div class="author-empty"><a href="/author/book_add.html" class="btn_red" th:text="#{author.createWork}">Tạo tác phẩm</a></div>
            </div>
            <div class="my_bookshelf" id="hasContentDiv">
                <div class="title cf">
                    <h1 class="fl" th:text="#{author.workList}">Danh sách truyện</h1>
                    <div class="fr"><a href="/author/book_add.html" class="btn_red" th:text="#{author.publishWork}">Đăng truyện</a></div>
                </div>
                <div id="divData" class="updateTable">
                    <table cellpadding="0" cellspacing="0">
                        <thead><tr>
                            <th class="goread" th:text="#{book.name}">Tên truyện</th>
                            <th class="goread" th:text="#{book.category}">Danh mục truyện</th>
                            <th class="goread" th:text="#{book.sort.views}">Lượt xem</th>
                            <th class="goread" th:text="#{author.yesterdaySubscriptions}">Lượt mua hôm qua</th>
                            <th class="goread" th:text="#{reader.updated}">Cập nhật</th>
                            <th class="goread" th:text="#{book.sort.words}">Tổng số chữ</th>
                            <th class="goread" th:text="#{common.actions}">Thao tác</th>
                        </tr></thead>
                        <tbody id="bookList"></tbody>
                    </table>
                    <div class="pageBox cf" id="shellPage"></div>
                </div>
            </div>
        </section>
    </div>
</main>
<script src="/javascript/jquery-1.8.0.min.js"></script>
<script src="/layui/layui.all.js"></script>
<script src="/javascript/header.js"></script>
<script src="/javascript/user.js"></script>
<script src="/javascript/common.js?v=5"></script>
<script src="/javascript/author-index-page.js"></script>
</body>
</html>
