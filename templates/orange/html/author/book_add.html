<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title th:text="#{author.system}">Hệ thống quản lý tác giả</title>
    <link rel="stylesheet" href="/css/base.css?v=1"/>
    <link rel="stylesheet" href="/css/user.css"/>
    <link rel="stylesheet" href="/css/author-book-add-page.css"/>
</head>
<body id="authorBookAddPage"
      th:attr="data-select-upload=#{user.avatar.select},
               data-name-required=#{author.work.name.required},
               data-name-too-long=#{author.work.name.tooLong},
               data-cover-required=#{author.work.cover.required},
               data-description-required=#{author.work.description.required},
               data-network-error=#{auth.networkError}">

<header class="header">
    <div class="mainNav" id="mainNav">
        <div class="box_center cf author-book-add-title">
            <span th:text="#{author.system}">Hệ thống quản lý tác giả</span>
        </div>
    </div>
</header>

<main class="main box_center cf">
    <div class="userBox cf">
        <nav class="my_l">
            <ul class="log_list">
                <li><a class="link_4 on" href="/author/index.html" th:text="#{author.management}">Quản lý truyện</a></li>
                <li><a class="link_2" href="/author/author_income_detail.html" th:text="#{author.income}">Thu nhập nhuận bút</a></li>
            </ul>
        </nav>
        <section class="my_r">
            <div class="my_bookshelf">
                <div class="userBox cf">
                    <form method="post" action="#add-book" id="form2">
                        <div class="user_l">
                            <h3 th:text="#{author.work.basicInfo}">Thông tin cơ bản của truyện</h3>
                            <ul class="log_list">
                                <li><span id="LabErr"></span></li>
                                <li>
                                    <label for="workDirection" th:text="#{author.work.direction}+': '">Hướng tác phẩm:</label>
                                    <select class="s_input" id="workDirection" name="workDirection">
                                        <option value="0" th:text="#{book.channel.male}">Truyện nam</option>
                                        <option value="1" th:text="#{book.channel.female}">Truyện nữ</option>
                                    </select>
                                </li>
                                <li>
                                    <label for="catId" th:text="#{book.category}+': '">Danh mục truyện:</label>
                                    <select class="s_input" id="catId" name="catId"></select>
                                </li>
                                <li>
                                    <label for="bookName" th:text="#{book.name}+': '">Tên truyện:</label>
                                    <input type="text" id="bookName" name="bookName" class="s_input" maxlength="20"/>
                                </li>
                                <li>
                                    <span th:text="#{author.work.cover}+': '">Ảnh bìa:</span>
                                    <div class="author-cover-field">
                                        <input class="opacity author-cover-input" type="file" id="file0" name="file"
                                               accept=".jpg,.jpeg,.gif,.png,image/jpeg,image/gif,image/png"
                                               th:title="#{author.cover.change}"/>
                                        <img class="author-cover-preview" id="picImage" src="/images/pic_upload.png" alt=""/>
                                        <input type="hidden" id="picUrl" name="picUrl" value="/images/default.gif"/>
                                    </div>
                                </li>
                                <li>
                                    <label for="bookDesc" th:text="#{author.work.description}+': '">Giới thiệu truyện:</label>
                                    <textarea name="bookDesc" rows="5" cols="53" id="bookDesc" class="textarea"></textarea>
                                </li>
                                <li>
                                    <button type="button" id="btnRegister" class="btn_red" th:text="#{common.submit}">Gửi</button>
                                </li>
                            </ul>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>
</main>

<script src="/javascript/jquery-1.8.0.min.js" type="text/javascript"></script>
<script src="/javascript/ajaxfileupload.js" type="text/javascript"></script>
<script src="/layui/layui.all.js" type="text/javascript"></script>
<script src="/javascript/header.js" type="text/javascript"></script>
<script src="/javascript/user.js" type="text/javascript"></script>
<script src="/javascript/common.js?v=5" type="text/javascript"></script>
<script src="/javascript/author-book-add-page.js" type="text/javascript"></script>
</body>
</html>
