<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="vi">
<head th:replace="common/header :: common_head(~{::title},~{::meta},~{::link},~{})">
    <title th:text="${book.bookName}+' - '+#{comment.area}+' - '+${application.website.name}"></title>
    <meta name="keywords" th:content="${book.bookName}+','+#{book.latest}+','+#{book.read}+','+#{comment.area}"/>
    <meta name="description" th:content="#{book.seo.description(${application.website.name},${book.bookName})}"/>
    <link href="/css/main.css" rel="stylesheet"/>
    <link href="/css/book.css" rel="stylesheet"/>
</head>
<body id="bookCommentPage"
      data-comment-mode="comment"
      th:attr="data-author-id=${book.authorId},
               data-comment-unit=#{comment.itemUnit},
               data-comment-trainee=#{comment.trainee},
               data-comment-reader=#{comment.reader},
               data-comment-unlike=#{comment.unlike},
               data-comment-like=#{comment.like},
               data-comment-reply=#{comment.reply},
               data-network-error=#{auth.networkError}">

<input type="hidden" id="bookId" th:value="${book.id}"/>

<div th:replace="common/top :: top('')"></div>

<div class="main box_center cf mb50">
    <div class="channelBookContent cf">
        <div class="wrap_left fl">
            <div class="wrap_bg">
                <div class="pad20">
                    <div class="bookComment">
                        <div class="book_tit">
                            <div class="fl">
                                <h3 th:text="#{comment.area}">Khu vực bình luận tác phẩm</h3>
                                <span id="bookCommentTotal">(0)</span>
                            </div>
                            <a class="fr" href="#txtComment" th:text="#{comment.publish}">Đăng bình luận</a>
                        </div>
                        <div class="no_comment" id="noCommentPanel" style="display: none;">
                            <img src="/images/no_comment.png" alt=""/>
                            <span class="block" th:text="#{comment.empty}">Chưa có bình luận</span>
                        </div>
                        <div class="commentBar" id="commentPanel"></div>
                        <div class="pageBox cf mt15 mr10" id="commentPage"></div>

                        <div class="reply_bar" id="reply_bar">
                            <div class="tit">
                                <span class="fl font16" th:text="#{comment.publish}">Đăng bình luận</span>
                                <span class="fr black9" style="display:none;">
                                    <span th:text="#{comment.loginRequired}">Vui lòng đăng nhập trước</span>
                                    <a class="orange" href="/user/login.html" th:text="#{site.login}">Đăng nhập</a>
                                    <em class="ml10 mr10">|</em>
                                    <a class="orange" href="/user/register.html" th:text="#{site.register}">Đăng ký</a>
                                </span>
                            </div>
                            <textarea name="txtComment" rows="2" cols="20" id="txtComment" class="replay_text"
                                      th:placeholder="#{comment.placeholder}"></textarea>
                            <div class="reply_btn">
                                <span class="fl black9">
                                    <em class="ml5" id="emCommentNum">0/1000</em>
                                    <span th:text="#{comment.characters}">ký tự</span>
                                </span>
                                <span class="fr">
                                    <a class="btn_ora" href="#publish-comment"
                                       data-book-detail-action="publish-comment"
                                       th:text="#{comment.publish}">Đăng bình luận</a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="wrap_right fr">
            <div class="wrap_inner author_info mb20" id="authorPanel">
                <div class="author_head cf">
                    <a class="head" href="/book/bookclass.html"
                       th:href="@{/book/bookclass.html(k=${book.authorName})}">
                        <img src="/images/author_head.png" th:alt="#{book.author}" id="authorLogoImg"/>
                    </a>
                    <div class="msg">
                        <span class="icon_qyzz" th:text="#{book.authorSigned}">Tác giả đã ký hợp đồng</span>
                        <h4>
                            <a href="/book/bookclass.html"
                               th:href="@{/book/bookclass.html(k=${book.authorName})}"
                               th:text="${book.authorName}"></a>
                        </h4>
                    </div>
                </div>
                <div class="author_intro cf">
                    <h4 th:text="#{book.authorMessage}">Lời tác giả</h4>
                    <div class="intro_txt" id="authorNote">
                        <span th:text="#{book.authorDefaultMessage}">Sự ủng hộ của bạn là động lực lớn nhất để tác giả tiếp tục sáng tác.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="common/footer :: footer"></div>
<div th:replace="common/js :: js"></div>
<script src="/javascript/bookdetail.js" type="text/javascript"></script>
<script src="/javascript/book-comment-page.js" type="text/javascript"></script>
</body>
</html>
