<div th:fragment="top(navType)" class="header">
        <div class="inner">
            <div class="logo"><a href="/"><img src="/images/logo.png" alt="Novel Plus"></a></div>
            <div class="nav">
                <ul class="clearfix">
                    <li class="on">
                        <a href="/" th:text="#{site.home}">Trang chủ</a>
                    </li>
                    <li>
                        <a href="/#" th:text="#{site.books}">Kho truyện</a>
                    </li>
                    <li>
                        <a href="/#" th:text="#{site.ranking}">Bảng xếp hạng</a>
                    </li>
                </ul>
            </div>
            <div class="search">
                <form method="get" name="search" action="/#" target="_blank">
                    <input type="text" name="keyword" id="q" th:placeholder="#{site.search.placeholder}" placeholder="Tên truyện, tác giả hoặc từ khóa" class="search-key">
                    <button type="submit" class="search-btn" id="search-btn" th:text="#{site.search}">Tìm kiếm</button>
                </form>
            </div>
            <div class="other">
                <a class="link-wap" href="/" th:text="#{site.mobileVersion}">Phiên bản di động</a>

            </div>
        </div>
</div>
