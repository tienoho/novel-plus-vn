spring:
  datasource:
    url: jdbc:shardingsphere:absolutepath:${user.dir}/config/shardingsphere-jdbc.yml
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
  thymeleaf:
    mode: LEGACYHTML5 #Tắt kiểm tra HTML nghiêm ngặt của Thymeleaf bằng LEGACYHTML5
    cache: false # Bật bộ nhớ đệm template; nên tắt khi phát triển để thấy thay đổi ngay

  #Kích thước tệp tải lên tối đa (100 MB)
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis:
  configuration:
    #Tự ánh xạ cột có dấu gạch dưới sang thuộc tính camelCase của Java
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mybatis/mapping/*.xml
  type-aliases-package: com.java2nb.novel.entity

logging:
  config: classpath:logback-boot.xml

pagehelper:
  helper-dialect: mysql

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name:khoi-thu}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Chỉ bật phát hành chứng từ sau khi pháp nhân và chính sách thuế đã được xác minh.
financial:
  voucher:
    issuance-enabled: ${FINANCIAL_VOUCHER_ISSUANCE_ENABLED:false}
    platform-legal-name: ${PLATFORM_LEGAL_NAME:}
    platform-tax-code: ${PLATFORM_TAX_CODE:}
