<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="'403 - '+#{error.403.title}">403 - Không có quyền truy cập</title>
<meta name="keywords" content="">
<meta name="description" content="">
<link rel="shortcut icon" href="/favicon.ico">
<link href="/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
<link href="/css/font-awesome.css?v=4.4.0" rel="stylesheet">
<link href="/css/animate.css" rel="stylesheet">
<link href="/css/style.css?v=4.1.0" rel="stylesheet">
</head>
<body class="gray-bg">
	<div class="middle-box text-center animated fadeInDown">
		<h1>403</h1>
		<h3 class="font-bold" th:text="#{error.403.title}">Không có quyền truy cập</h3>
		<div class="error-desc">
			<span th:text="#{error.403.message}">Rất tiếc, vui lòng liên hệ quản trị viên.</span>
			<form class="form-inline m-t" role="form">
				<div class="form-group">
					<input type="email" class="form-control"
						th:placeholder="#{admin.search.placeholder}" placeholder="Nhập nội dung cần tìm…">
				</div>
				<button type="submit" class="btn btn-primary" th:text="#{common.search}">Tìm kiếm</button>
			</form>
		</div>
	</div>
	<!-- JavaScript dùng chung. -->
	<script src="/js/jquery.min.js?v=2.1.4"></script>
	<script src="/js/bootstrap.min.js?v=3.3.6"></script>
</body>
</html>
