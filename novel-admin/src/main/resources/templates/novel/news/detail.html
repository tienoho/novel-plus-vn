<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
            <div class="ibox-content">
            <form class="form-horizontal m-t" id="signupForm">
                <input id="id" name="id" th:value="${news.id}"
                       type="hidden">
                                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.categoryId}+'：'">ID danh mục:</label>

                                                    <div style="padding-top:8px" class="col-sm-8 dict-type" dict-type="${column.dictType}"
                                 th:attr="dict-value=${news.catId}">
                            </div>

                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.categoryName}+'：'">Tên danh mục:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.catName}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.source}+'：'">Nguồn:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.sourceName}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.title}+'：'">Tiêu đề:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.title}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.content}+'：'">Nội dung:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:utext="${news.content}"></div>
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.publishedAt}+'：'">Thời gian xuất bản:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.createTime}==null?null:${#dates.format(news.createTime,'yyyy-MM-dd HH:mm:ss')}">
                            </div>
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.publisherId}+'：'">ID người xuất bản:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.createUserId}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.audit.updatedAt}+'：'">Thời gian cập nhật:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.updateTime}==null?null:${#dates.format(news.updateTime,'yyyy-MM-dd HH:mm:ss')}">
                            </div>
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.news.updatedById}+'：'">ID người cập nhật:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${news.updateUserId}">
                            </div>
                        
                        

                    </div>
                                                    </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:include="include::footer"></div>
</body>
</html>
