<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
            <div class="ibox-content">
            <form class="form-horizontal m-t" id="signupForm">
                <input id="id" name="id" th:value="${bookComment.id}"
                       type="hidden">
                                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.book.id}+'：'">ID truyện:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.bookId}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.bookComment.content}+'：'">Nội dung bình luận:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.commentContent}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.bookComment.replyCount}+'：'">Số lượt trả lời:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.replyCount}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.bookComment.auditStatus}+'：'">Trạng thái duyệt (0: chờ duyệt, 1: đã duyệt, 2: từ chối):</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.auditStatus}">
                            </div>
                        
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.bookComment.time}+'：'">Thời gian bình luận:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.createTime}==null?null:${#dates.format(bookComment.createTime,'yyyy-MM-dd HH:mm:ss')}">
                            </div>
                        

                    </div>
                                                                            <div class="form-group">
                        <label class="col-sm-3 control-label" th:text="#{admin.bookComment.user}+'：'">Người bình luận:</label>

                                                    <div style="padding-top:8px" class="col-sm-8"
                                 th:text="${bookComment.createUserId}">
                            </div>
                        
                        

                    </div>
                                                    </form>
            </div>
        </div>
    </div>
</div>
</div>
<div th:include="include::footer"></div>
</body>
</html>
