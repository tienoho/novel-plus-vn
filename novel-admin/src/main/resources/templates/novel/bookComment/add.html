<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                                                                                                                                        <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.book.id}+'：'">ID truyện:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="bookId" name="bookId"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.bookComment.content}+'：'">Nội dung bình luận:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="commentContent" name="commentContent"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.bookComment.replyCount}+'：'">Số lượt trả lời:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="replyCount" name="replyCount"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.bookComment.auditStatus}+'：'">Trạng thái duyệt (0: chờ duyệt, 1: đã duyệt, 2: từ chối):</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="auditStatus" name="auditStatus"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.bookComment.time}+'：'">Thời gian bình luận:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="createTime"
                                                   name="createTime"
                                                   data-admin-laydate="datetime"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.bookComment.user}+'：'">Người bình luận:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="createUserId" name="createUserId"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                            <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/bookComment/add.js">
</script>
</body>
</html>
