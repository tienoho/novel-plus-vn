<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.direction}+'：'">Kênh tác phẩm (0: nam, 1: nữ):</label>
                            <div class="col-sm-8">
                                <input id="workDirection" name="workDirection"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.categoryId}+'：'">ID danh mục:</label>
                            <div class="col-sm-8">
                                <input id="catId" name="catId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.categoryName}+'：'">Tên danh mục:</label>
                            <div class="col-sm-8">
                                <input id="catName" name="catName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.subcategoryId}+'：'">ID danh mục con:</label>
                            <div class="col-sm-8">
                                <input id="catChildId" name="catChildId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.subcategoryName}+'：'">Tên danh mục con:</label>
                            <div class="col-sm-8">
                                <input id="catChildName" name="catChildName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.cover}+'：'">Ảnh bìa:</label>
                            <div class="col-sm-8">
                                <input id="picUrl" name="picUrl"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.name}+'：'">Tên truyện:</label>
                            <div class="col-sm-8">
                                <input id="bookName" name="bookName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.maleLead}+'：'">Tên nhân vật nam chính:</label>
                            <div class="col-sm-8">
                                <input id="heroName" name="heroName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.femaleLead}+'：'">Tên nhân vật nữ chính:</label>
                            <div class="col-sm-8">
                                <input id="ladyName" name="ladyName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.style}+'：'">Phong cách (0: ngọt ngào, 1: ngược tâm, 2: khác):</label>
                            <div class="col-sm-8">
                                <input id="bookStyle" name="bookStyle"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.tags}+'：'">Nhãn tác phẩm:</label>
                            <div class="col-sm-8">
                                <input id="bookLabel" name="bookLabel"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.authorId}+'：'">ID tác giả:</label>
                            <div class="col-sm-8">
                                <input id="authorId" name="authorId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.authorName}+'：'">Tên tác giả:</label>
                            <div class="col-sm-8">
                                <input id="authorName" name="authorName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.description}+'：'">Giới thiệu truyện:</label>
                            <div class="col-sm-8">
                                <input id="bookDesc" name="bookDesc"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.score}+'：'">Điểm số:</label>
                            <div class="col-sm-8">
                                <input id="score" name="score"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.status}+'：'">Trạng thái truyện (0: đang ra, 1: hoàn thành):</label>
                            <div class="col-sm-8">
                                <input id="bookStatus" name="bookStatus"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.views}+'：'">Lượt xem:</label>
                            <div class="col-sm-8">
                                <input id="visitCount" name="visitCount"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.wordCount}+'：'">Tổng số chữ:</label>
                            <div class="col-sm-8">
                                <input id="wordCount" name="wordCount"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.commentCount}+'：'">Số bình luận:</label>
                            <div class="col-sm-8">
                                <input id="commentCount" name="commentCount"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.yesterdaySubscriptions}+'：'">Lượt mua chương hôm qua:</label>
                            <div class="col-sm-8">
                                <input id="yesterdayBuy" name="yesterdayBuy"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.latestIndexId}+'：'">ID chương mới nhất:</label>
                            <div class="col-sm-8">
                                <input id="lastIndexId" name="lastIndexId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.latestIndexName}+'：'">Tên chương mới nhất:</label>
                            <div class="col-sm-8">
                                <input id="lastIndexName" name="lastIndexName"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.latestIndexUpdatedAt}+'：'">Thời gian cập nhật chương mới nhất:</label>
                            <div class="col-sm-8">
                                <input type="text" class="laydate-icon layer-date form-control"
                                       id="lastIndexUpdateTime"
                                       name="lastIndexUpdateTime"
                                       onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                       style="background-color: #fff;" readonly="readonly"/>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.paid}+'：'">Thu phí (1: thu phí, 0: miễn phí):</label>
                            <div class="col-sm-8">
                                <input id="isVip" name="isVip"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.shelfStatus}+'：'">Trạng thái (0: đã nhập, 1: đã xuất bản):</label>
                            <div class="col-sm-8">
                                <input id="status" name="status"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.updatedAt}+'：'">Thời gian cập nhật:</label>
                            <div class="col-sm-8">
                                <input type="text" class="laydate-icon layer-date form-control"
                                       id="updateTime"
                                       name="updateTime"
                                       onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                       style="background-color: #fff;" readonly="readonly"/>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.createdAt}+'：'">Thời gian tạo:</label>
                            <div class="col-sm-8">
                                <input type="text" class="laydate-icon layer-date form-control"
                                       id="createTime"
                                       name="createTime"
                                       onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                       style="background-color: #fff;" readonly="readonly"/>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.crawlSourceId}+'：'">ID nguồn thu thập:</label>
                            <div class="col-sm-8">
                                <input id="crawlSourceId" name="crawlSourceId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.crawlBookId}+'：'">ID truyện trên website nguồn:</label>
                            <div class="col-sm-8">
                                <input id="crawlBookId" name="crawlBookId"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.lastCrawlAt}+'：'">Thời gian thu thập gần nhất:</label>
                            <div class="col-sm-8">
                                <input type="text" class="laydate-icon layer-date form-control"
                                       id="crawlLastTime"
                                       name="crawlLastTime"
                                       onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                       style="background-color: #fff;" readonly="readonly"/>

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.book.stopUpdate}+'：'">Đã dừng cập nhật (0: chưa dừng, 1: đã dừng):</label>
                            <div class="col-sm-8">
                                <input id="crawlIsStop" name="crawlIsStop"
                                       class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/book/add.js">
</script>
</body>
</html>
