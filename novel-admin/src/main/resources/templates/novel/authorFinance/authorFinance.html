<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-title">
                <h5 th:text="#{admin.authorFinance.title}">Tài chính tác giả</h5>
            </div>
            <div class="ibox-content">
                <ul class="nav nav-tabs">
                    <li class="active"><a data-toggle="tab" href="#kycPanel"
                                          th:text="#{admin.authorFinance.kycTab}">Hồ sơ KYC</a></li>
                    <li><a data-toggle="tab" href="#withdrawalPanel"
                           th:text="#{admin.authorFinance.withdrawalTab}">Yêu cầu rút tiền</a></li>
                </ul>

                <div class="tab-content m-t-md">
                    <div id="kycPanel" class="tab-pane active">
                        <form id="kycSearchForm" class="form-inline">
                            <div class="form-group">
                                <label for="kycAuthorId" th:text="#{admin.authorFinance.authorId}">Mã tác giả</label>
                                <input id="kycAuthorId" name="authorId" type="number" min="1" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="kycStatus" th:text="#{admin.authorFinance.status}">Trạng thái</label>
                                <select id="kycStatus" name="status" class="form-control">
                                    <option value="" th:text="#{admin.authorFinance.allStatuses}">Tất cả</option>
                                    <option value="PENDING" th:text="#{admin.authorFinance.status.pending}">Chờ duyệt</option>
                                    <option value="VERIFIED" th:text="#{admin.authorFinance.status.verified}">Đã xác minh</option>
                                    <option value="REJECTED" th:text="#{admin.authorFinance.status.rejected}">Đã từ chối</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                        </form>
                        <table id="kycTable" data-mobile-responsive="true"></table>
                    </div>

                    <div id="withdrawalPanel" class="tab-pane">
                        <form id="withdrawalSearchForm" class="form-inline">
                            <div class="form-group">
                                <label for="withdrawalAuthorId" th:text="#{admin.authorFinance.authorId}">Mã tác giả</label>
                                <input id="withdrawalAuthorId" name="authorId" type="number" min="1"
                                       class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="withdrawalStatus" th:text="#{admin.authorFinance.status}">Trạng thái</label>
                                <select id="withdrawalStatus" name="status" class="form-control">
                                    <option value="" th:text="#{admin.authorFinance.allStatuses}">Tất cả</option>
                                    <option value="PENDING_REVIEW" th:text="#{admin.authorFinance.status.pendingReview}">Chờ duyệt</option>
                                    <option value="APPROVED" th:text="#{admin.authorFinance.status.approved}">Đã duyệt</option>
                                    <option value="PROCESSING" th:text="#{admin.authorFinance.status.processing}">Đang chuyển khoản</option>
                                    <option value="SETTLEMENT_PENDING" th:text="#{admin.authorFinance.status.settlementPending}">Chờ tất toán</option>
                                    <option value="RELEASE_PENDING" th:text="#{admin.authorFinance.status.releasePending}">Chờ hoàn Xu</option>
                                    <option value="PAID" th:text="#{admin.authorFinance.status.paid}">Đã thanh toán</option>
                                    <option value="REJECTED" th:text="#{admin.authorFinance.status.rejected}">Đã từ chối</option>
                                    <option value="FAILED" th:text="#{admin.authorFinance.status.failed}">Thất bại</option>
                                    <option value="CANCELLED" th:text="#{admin.authorFinance.status.cancelled}">Đã hủy</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                        </form>
                        <table id="withdrawalTable" data-mobile-responsive="true"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    window.AuthorFinancePermissions = {pii: false, kyc: false, payoutApprove: false, payoutExecute: false};
</script>
<div shiro:hasPermission="novel:authorFinance:pii">
    <script type="text/javascript">window.AuthorFinancePermissions.pii = true;</script>
</div>
<div shiro:hasPermission="novel:authorFinance:kyc">
    <script type="text/javascript">window.AuthorFinancePermissions.kyc = true;</script>
</div>
<div shiro:hasPermission="novel:authorFinance:payout:approve">
    <script type="text/javascript">window.AuthorFinancePermissions.payoutApprove = true;</script>
</div>
<div shiro:hasPermission="novel:authorFinance:payout:execute">
    <script type="text/javascript">window.AuthorFinancePermissions.payoutExecute = true;</script>
</div>
