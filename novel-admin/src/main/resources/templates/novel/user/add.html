<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                                                                                                                                        <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.username}+'：'">Tên đăng nhập:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="username" name="username"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.password}+'：'">Mật khẩu đăng nhập:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="password" name="password"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.nickname}+'：'">Biệt danh:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="nickName" name="nickName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.avatar}+'：'">Ảnh đại diện:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="userPhoto" name="userPhoto"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.gender}+'：'">Giới tính (0: nam, 1: nữ):</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="userSex" name="userSex"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.balance}+'：'">Số dư (Xu):</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="accountBalance" name="accountBalance"
                                                   class="form-control"
                                                   type="text" value="0" readonly
                                                   th:title="#{admin.novelUser.balanceReadOnly}">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.novelUser.status}+'：'">Trạng thái người dùng (0: hoạt động):</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="status" name="status"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.audit.createdAt}+'：'">Thời gian tạo:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="createTime"
                                                   name="createTime"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.book.updatedAt}+'：'">Thời gian cập nhật:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="updateTime"
                                                   name="updateTime"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                            <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/user/add.js">
</script>
</body>
</html>
