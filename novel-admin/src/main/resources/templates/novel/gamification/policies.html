<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head th:include="include :: header"></head>
<body class="gray-bg">
<main class="wrapper wrapper-content" id="gamificationPolicyApp">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5 th:text="#{admin.gamification.policyStudio.title}">Bộ policy Gamification</h5>
                    <div class="ibox-tools">
                        <a href="/novel/gamification/settings" class="btn btn-default btn-xs"
                           th:text="#{admin.gamification.policyStudio.runtime}">Runtime settings</a>
                    </div>
                </div>
                <div class="ibox-content">
                    <form id="createPolicyForm" class="form-inline"
                          shiro:hasPermission="novel:gamification:policy:edit">
                        <input name="policyVersion" class="form-control" maxlength="32" required
                               pattern="[a-z0-9][a-z0-9._-]{0,31}"
                               th:title="#{admin.gamification.policyStudio.versionFormat}"
                               th:placeholder="#{admin.gamification.policyStudio.newVersion}">
                        <input name="sourceVersion" class="form-control" maxlength="32"
                               pattern="[a-z0-9][a-z0-9._-]{0,31}"
                               th:title="#{admin.gamification.policyStudio.versionFormat}"
                               th:placeholder="#{admin.gamification.policyStudio.sourceVersion}">
                        <input name="reason" class="form-control" minlength="10" maxlength="500" required
                               th:placeholder="#{admin.gamification.policyStudio.reason}">
                        <button class="btn btn-primary" type="submit"
                                th:text="#{admin.gamification.policyStudio.create}">Tạo draft</button>
                    </form>
                    <p id="policyNotice" class="help-block" role="status"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-4">
            <div class="ibox">
                <div class="ibox-title"><h5 th:text="#{admin.gamification.policyStudio.history}">Các phiên bản</h5></div>
                <div class="ibox-content table-responsive">
                    <table class="table table-striped table-condensed">
                        <thead><tr>
                            <th th:text="#{admin.gamification.policyStudio.tableVersion}">Phiên bản</th>
                            <th th:text="#{admin.gamification.policyStudio.tableStatus}">Trạng thái</th>
                            <th></th>
                        </tr></thead>
                        <tbody id="policyList"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="ibox">
                <div class="ibox-title"><h5 id="policyHeading">—</h5></div>
                <div class="ibox-content">
                    <p id="policyMetadata">—</p>
                    <div class="form-inline">
                        <input id="actionReason" class="form-control" minlength="10" maxlength="500"
                               th:placeholder="#{admin.gamification.policyStudio.reason}">
                        <button id="submitPolicy" class="btn btn-success" type="button"
                                shiro:hasPermission="novel:gamification:policy:edit"
                                th:text="#{admin.gamification.policyStudio.submit}">Gửi duyệt</button>
                        <button id="approvePolicy" class="btn btn-info" type="button"
                                shiro:hasPermission="novel:gamification:policy:approve"
                                th:text="#{admin.gamification.policyStudio.approve}">Phê duyệt</button>
                        <button id="publishPolicy" class="btn btn-warning" type="button"
                                shiro:hasPermission="novel:gamification:policy:publish"
                                th:text="#{admin.gamification.policyStudio.publish}">Phát hành</button>
                    </div>
                    <hr>
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#levelsTab"
                            th:text="#{admin.gamification.policyStudio.tabLevels}">Level và thưởng</a></li>
                        <li><a data-toggle="tab" href="#questsTab"
                            th:text="#{admin.gamification.policyStudio.tabQuests}">Nhiệm vụ</a></li>
                        <li><a data-toggle="tab" href="#realmsTab"
                            th:text="#{admin.gamification.policyStudio.tabRealms}">Cảnh giới</a></li>
                        <li><a data-toggle="tab" href="#abuseTab"
                            th:text="#{admin.gamification.policyStudio.tabAbuse}">Chống lạm dụng</a></li>
                        <li><a data-toggle="tab" href="#publicTab"
                            th:text="#{admin.gamification.policyStudio.tabPublic}">Luật công khai</a></li>
                    </ul>
                    <div class="tab-content">
                        <section id="levelsTab" class="tab-pane active">
                            <form id="levelForm" class="form-inline policy-editor">
                                <input name="level" type="number" min="1" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.level}">
                                <input name="minExp" type="number" min="0" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.minExp}">
                                <input name="titleKey" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.titleKey}">
                                <input name="frameCode" class="form-control"
                                       th:placeholder="#{admin.gamification.policyStudio.field.frameCode}">
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.saveLevel}">Lưu level</button>
                            </form>
                            <form id="levelRewardForm" class="form-inline policy-editor">
                                <input name="level" type="number" min="2" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.level}">
                                <input name="ticketAmount" type="number" min="1" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.ticketAmount}">
                                <input name="ticketValidityDays" type="number" min="1" max="3650" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.ticketValidityDays}">
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.saveLevelReward}">Lưu thưởng level</button>
                            </form>
                            <pre id="levelsPreview"></pre>
                        </section>
                        <section id="questsTab" class="tab-pane">
                            <form id="questForm" class="policy-editor">
                                <div class="row">
                                    <div class="col-sm-4"><input name="questCode" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.questCode}"></div>
                                    <div class="col-sm-4"><input name="eventType" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.eventType}"></div>
                                    <div class="col-sm-4"><select name="periodType" class="form-control">
                                        <option value="DAILY" th:text="#{admin.gamification.policyStudio.period.daily}">Hằng ngày</option>
                                        <option value="WEEKLY" th:text="#{admin.gamification.policyStudio.period.weekly}">Hằng tuần</option>
                                        <option value="ONE_TIME" th:text="#{admin.gamification.policyStudio.period.oneTime}">Một lần</option>
                                    </select></div>
                                </div>
                                <div class="row policy-row">
                                    <div class="col-sm-3"><input name="targetCount" type="number" min="1" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.targetCount}"></div>
                                    <div class="col-sm-3"><input name="nameKey" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.nameKey}"></div>
                                    <div class="col-sm-2"><input name="sortNo" type="number" min="0" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.sortNo}"></div>
                                    <div class="col-sm-2"><input name="expReward" type="number" min="0" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.expReward}"></div>
                                    <div class="col-sm-2"><input name="ticketReward" type="number" min="0" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.ticketReward}"></div>
                                </div>
                                <label><input name="active" type="checkbox" checked>
                                    <span th:text="#{admin.gamification.policyStudio.field.active}">Đang hoạt động</span>
                                </label>
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.saveQuest}">Lưu nhiệm vụ</button>
                            </form>
                            <pre id="questsPreview"></pre>
                        </section>
                        <section id="realmsTab" class="tab-pane">
                            <form id="realmForm" class="form-inline policy-editor">
                                <input name="realmCode" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.realmCode}">
                                <input name="nameKey" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.nameKey}">
                                <input name="minLevel" type="number" min="1" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.minLevel}">
                                <input name="sortNo" type="number" min="0" class="form-control" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.sortNo}">
                                <label><input name="active" type="checkbox" checked>
                                    <span th:text="#{admin.gamification.policyStudio.field.active}">Đang hoạt động</span>
                                </label>
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.saveRealm}">Lưu cảnh giới</button>
                            </form>
                            <pre id="realmsPreview"></pre>
                        </section>
                        <section id="abuseTab" class="tab-pane">
                            <form id="abuseForm" class="policy-editor">
                                <div class="row">
                                    <div class="col-sm-4"><input name="reviewScoreThreshold" type="number" min="1" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.reviewThreshold}"></div>
                                    <div class="col-sm-4"><input name="ruleCode" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.ruleCode}"></div>
                                    <div class="col-sm-4"><select name="metricName" class="form-control">
                                        <option value="ACCOUNT_AGE_HOURS" th:text="#{admin.gamification.policyStudio.metric.accountAgeHours}">Tuổi tài khoản</option>
                                        <option value="USER_VOTES" th:text="#{admin.gamification.policyStudio.metric.userVotes}">Vote theo người dùng</option>
                                        <option value="DEVICE_VOTES" th:text="#{admin.gamification.policyStudio.metric.deviceVotes}">Vote theo thiết bị</option>
                                        <option value="DEVICE_USERS" th:text="#{admin.gamification.policyStudio.metric.deviceUsers}">Người dùng theo thiết bị</option>
                                        <option value="IP_VOTES" th:text="#{admin.gamification.policyStudio.metric.ipVotes}">Vote theo IP</option>
                                        <option value="IP_USERS" th:text="#{admin.gamification.policyStudio.metric.ipUsers}">Người dùng theo IP</option>
                                    </select></div>
                                </div>
                                <div class="row policy-row">
                                    <div class="col-sm-3"><input name="thresholdValue" type="number" min="0" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.thresholdValue}"></div>
                                    <div class="col-sm-3"><input name="windowMinutes" type="number" min="1" class="form-control"
                                        th:placeholder="#{admin.gamification.policyStudio.field.windowMinutes}"></div>
                                    <div class="col-sm-3"><input name="score" type="number" min="1" class="form-control" required
                                        th:placeholder="#{admin.gamification.policyStudio.field.score}"></div>
                                    <div class="col-sm-3"><label><input name="hardBlock" type="checkbox">
                                        <span th:text="#{admin.gamification.policyStudio.field.hardBlock}">Chặn cứng</span>
                                    </label></div>
                                </div>
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.saveAbuse}">Lưu rule chống lạm dụng</button>
                            </form>
                            <pre id="abusePreview"></pre>
                        </section>
                        <section id="publicTab" class="tab-pane">
                            <form id="publicPolicyForm" class="policy-editor">
                                <input name="title" class="form-control" maxlength="160" required
                                       th:placeholder="#{admin.gamification.policyStudio.field.publicTitle}">
                                <textarea name="contentText" class="form-control" rows="10" minlength="50" required
                                          th:placeholder="#{admin.gamification.policyStudio.field.publicContent}"></textarea>
                                <button class="btn btn-primary" type="submit"
                                        th:text="#{admin.gamification.policyStudio.savePublic}">Lưu luật công khai</button>
                            </form>
                        </section>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:include="include :: footer"></div>
<script th:inline="javascript" th:attr="nonce=${cspNonce}">
window.GamificationPolicyI18n = {
    failed: /*[[#{admin.gamification.policyStudio.failed}]]*/ 'Không thể thực hiện yêu cầu',
    success: /*[[#{admin.gamification.policyStudio.success}]]*/ 'Thao tác thành công',
    select: /*[[#{admin.gamification.policyStudio.select}]]*/ 'Chọn',
    reasonRequired: /*[[#{admin.gamification.policyStudio.reasonRequired}]]*/ 'Lý do phải dài từ 10 đến 500 ký tự',
    makerWarning: /*[[#{admin.gamification.policyStudio.makerWarning}]]*/ 'Người tạo policy không được tự phê duyệt',
    currentUserId: /*[[${currentUserId}]]*/ null,
    statuses: {
        DRAFT: /*[[#{admin.gamification.status.DRAFT}]]*/ 'Bản nháp',
        PENDING_APPROVAL: /*[[#{admin.gamification.status.PENDING_APPROVAL}]]*/ 'Chờ phê duyệt',
        APPROVED: /*[[#{admin.gamification.status.APPROVED}]]*/ 'Đã phê duyệt',
        PUBLISHED: /*[[#{admin.gamification.status.PUBLISHED}]]*/ 'Đã phát hành',
        REJECTED: /*[[#{admin.gamification.status.REJECTED}]]*/ 'Đã từ chối'
    },
    metadata: {
        version: /*[[#{admin.gamification.policyStudio.metadataVersion}]]*/ 'Phiên bản ghi',
        creator: /*[[#{admin.gamification.policyStudio.metadataCreator}]]*/ 'Người tạo',
        approver: /*[[#{admin.gamification.policyStudio.metadataApprover}]]*/ 'Người phê duyệt',
        hash: /*[[#{admin.gamification.policyStudio.metadataHash}]]*/ 'Hash nội dung'
    }
};
window.GamificationPolicyPermissions = {edit:false, approve:false, publish:false};
</script>
<script shiro:hasPermission="novel:gamification:policy:edit" th:attr="nonce=${cspNonce}">window.GamificationPolicyPermissions.edit=true;</script>
<script shiro:hasPermission="novel:gamification:policy:approve" th:attr="nonce=${cspNonce}">window.GamificationPolicyPermissions.approve=true;</script>
<script shiro:hasPermission="novel:gamification:policy:publish" th:attr="nonce=${cspNonce}">window.GamificationPolicyPermissions.publish=true;</script>
<script src="/js/appjs/novel/gamification/policies.js"></script>
</body>
</html>
