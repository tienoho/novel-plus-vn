<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox">
                <div class="ibox-title">
                    <h5 th:text="#{admin.gamification.title}">Quản trị Ngọn Đuốc</h5>
                </div>
                <div class="ibox-content" shiro:hasPermission="novel:gamification:grant">
                    <form id="grantForm" class="form-inline">
                        <div class="form-group">
                            <label for="grantUserId" th:text="#{admin.gamification.userId}">Mã người dùng</label>
                            <input id="grantUserId" name="userId" type="number" min="1" required
                                   class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="grantAmount" th:text="#{admin.gamification.grantAmount}">Số Đuốc</label>
                            <input id="grantAmount" name="amount" type="number" min="1" required
                                   class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="grantReason" th:text="#{admin.gamification.reason}">Lý do</label>
                            <input id="grantReason" name="reason" type="text" minlength="10" maxlength="255"
                                   required class="form-control" style="min-width: 320px">
                        </div>
                        <button id="grantButton" type="submit" class="btn btn-primary"
                                th:text="#{admin.gamification.grant}">Cấp Ngọn Đuốc</button>
                    </form>
                    <p class="help-block" th:text="#{admin.gamification.grantHelp}">
                        Mỗi lần cấp được ghi audit và có thể retry an toàn bằng cùng mã yêu cầu.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-sm-12">
            <div class="ibox">
                <div class="ibox-content">
                    <ul class="nav nav-tabs">
                        <li class="active"><a data-toggle="tab" href="#accountsPanel"
                                              th:text="#{admin.gamification.accounts}">Tài khoản</a></li>
                        <li><a data-toggle="tab" href="#ledgerPanel"
                               th:text="#{admin.gamification.ledger}">Sổ cái</a></li>
                        <li><a data-toggle="tab" href="#jobsPanel"
                               th:text="#{admin.gamification.jobs}">Job vận hành</a></li>
                        <li><a data-toggle="tab" href="#seasonsPanel"
                               th:text="#{admin.gamification.seasons}">Kỳ xếp hạng</a></li>
                        <li><a data-toggle="tab" href="#questCampaignsPanel"
                               th:text="#{admin.gamification.questCampaigns}">Campaign nhiệm vụ</a></li>
                        <li><a data-toggle="tab" href="#rewardsPanel"
                               th:text="#{admin.gamification.rewards}">Quỹ thưởng</a></li>
                    </ul>
                    <div class="tab-content m-t-md">
                        <div id="accountsPanel" class="tab-pane active">
                            <form id="accountSearchForm" class="form-inline"
                                  onsubmit="reloadGamificationAccounts(); return false;">
                                <input name="userId" type="number" min="1" class="form-control"
                                       th:placeholder="#{admin.gamification.userId}">
                                <select name="status" class="form-control">
                                    <option value="" th:text="#{admin.gamification.allStatuses}">Tất cả</option>
                                    <option value="ACTIVE" th:text="#{admin.gamification.active}">Hoạt động</option>
                                    <option value="FROZEN" th:text="#{admin.gamification.frozen}">Đóng băng</option>
                                </select>
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="accountTable" data-mobile-responsive="true"></table>
                        </div>
                        <div id="ledgerPanel" class="tab-pane">
                            <form id="ledgerSearchForm" class="form-inline"
                                  onsubmit="reloadGamificationLedger(); return false;">
                                <input name="userId" type="number" min="1" class="form-control"
                                       th:placeholder="#{admin.gamification.userId}">
                                <select name="entryType" class="form-control">
                                    <option value="" th:text="#{admin.gamification.allEntryTypes}">Tất cả bút toán</option>
                                    <option value="GRANT">GRANT</option>
                                    <option value="SPEND">SPEND</option>
                                    <option value="EXPIRE">EXPIRE</option>
                                    <option value="REVOKE">REVOKE</option>
                                    <option value="ADJUST">ADJUST</option>
                                    <option value="REVERSAL">REVERSAL</option>
                                </select>
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="ledgerTable" data-mobile-responsive="true"></table>
                        </div>
                        <div id="jobsPanel" class="tab-pane">
                            <form id="jobSearchForm" class="form-inline"
                                  onsubmit="reloadGamificationJobs(); return false;">
                                <input name="jobType" type="text" class="form-control"
                                       th:placeholder="#{admin.gamification.jobType}">
                                <select name="status" class="form-control">
                                    <option value="" th:text="#{admin.gamification.allStatuses}">Tất cả</option>
                                    <option value="RUNNING">RUNNING</option>
                                    <option value="SUCCEEDED">SUCCEEDED</option>
                                    <option value="FAILED">FAILED</option>
                                    <option value="PAUSED">PAUSED</option>
                                </select>
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="jobTable" data-mobile-responsive="true"></table>
                        </div>
                        <div id="seasonsPanel" class="tab-pane">
                            <form id="seasonSearchForm" class="form-inline"
                                  onsubmit="reloadGamificationSeasons(); return false;">
                                <input name="periodCode" type="text" pattern="[0-9]{4}-(0[1-9]|1[0-2])"
                                       class="form-control" th:placeholder="#{admin.gamification.periodCode}">
                                <select name="status" class="form-control">
                                    <option value="" th:text="#{admin.gamification.allStatuses}">Tất cả</option>
                                    <option value="OPEN">OPEN</option>
                                    <option value="CLOSING">CLOSING</option>
                                    <option value="REVIEW">REVIEW</option>
                                    <option value="FINALIZED">FINALIZED</option>
                                    <option value="REWARDED">REWARDED</option>
                                    <option value="CANCELLED">CANCELLED</option>
                                </select>
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="seasonTable" data-mobile-responsive="true"></table>
                        </div>
                        <div id="rewardsPanel" class="tab-pane">
                            <form id="rewardCalculateForm" class="form-inline"
                                  shiro:hasPermission="novel:gamification:reward">
                                <input name="seasonId" type="number" min="1" required class="form-control"
                                       th:placeholder="#{admin.gamification.seasonId}">
                                <input name="budgetXu" type="number" min="1" required class="form-control"
                                       th:placeholder="#{admin.gamification.budgetXu}">
                                <input name="sharesBps" type="text" required class="form-control"
                                       style="min-width:280px" value="5000,3000,2000"
                                       th:placeholder="#{admin.gamification.sharesBps}">
                                <button type="submit" class="btn btn-primary"
                                        th:text="#{admin.gamification.calculateReward}">Tính phân bổ</button>
                            </form>
                            <hr>
                            <form id="campaignSearchForm" class="form-inline"
                                  onsubmit="reloadRewardCampaigns(); return false;">
                                <input name="periodCode" type="text" class="form-control"
                                       th:placeholder="#{admin.gamification.periodCode}">
                                <input name="status" type="text" class="form-control"
                                       th:placeholder="#{admin.gamification.status}">
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="campaignTable" data-mobile-responsive="true"></table>
                            <h4 th:text="#{admin.gamification.allocations}">Phân bổ thưởng</h4>
                            <form id="allocationSearchForm" class="form-inline"
                                  onsubmit="reloadRewardAllocations(); return false;">
                                <input name="campaignId" type="number" min="1" class="form-control"
                                       th:placeholder="#{admin.gamification.campaignId}">
                                <input name="authorId" type="number" min="1" class="form-control"
                                       th:placeholder="#{admin.gamification.authorId}">
                                <input name="status" type="text" class="form-control"
                                       th:placeholder="#{admin.gamification.status}">
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="allocationTable" data-mobile-responsive="true"></table>
                        </div>
                        <div id="questCampaignsPanel" class="tab-pane">
                            <div shiro:hasPermission="novel:gamification:config">
                                <form id="questCampaignCreateForm" class="form-inline">
                                    <input name="campaignCode" required pattern="[A-Za-z0-9_]{3,48}"
                                           class="form-control"
                                           th:placeholder="#{admin.gamification.questCampaignCode}">
                                    <input name="startAt" type="datetime-local" required class="form-control"
                                           th:title="#{admin.gamification.startAt}">
                                    <input name="endAt" type="datetime-local" required class="form-control"
                                           th:title="#{admin.gamification.endAt}">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="#{admin.gamification.createQuestCampaign}">Tạo DRAFT</button>
                                </form>
                                <form id="questRewardForm" class="form-inline m-t-sm">
                                    <input name="campaignId" type="number" min="1" required class="form-control"
                                           th:placeholder="#{admin.gamification.campaignId}">
                                    <input name="questCode" required pattern="[A-Za-z0-9_]{3,48}"
                                           class="form-control"
                                           th:placeholder="#{admin.gamification.questCode}">
                                    <input name="expAmount" type="number" min="0" value="0" required
                                           class="form-control" th:placeholder="#{admin.gamification.expAmount}">
                                    <input name="ticketAmount" type="number" min="0" value="0" required
                                           class="form-control" th:placeholder="#{admin.gamification.ticketAmount}">
                                    <button type="submit" class="btn btn-primary"
                                            th:text="#{admin.gamification.saveQuestReward}">Lưu reward</button>
                                </form>
                                <p class="help-block" th:text="#{admin.gamification.questCampaignHelp}">
                                    Campaign chỉ kích hoạt được khi có reward và không chồng lấn.
                                </p>
                                <hr>
                            </div>
                            <form id="questCampaignSearchForm" class="form-inline"
                                  onsubmit="reloadQuestCampaigns(); return false;">
                                <input name="campaignCode" class="form-control"
                                       th:placeholder="#{admin.gamification.questCampaignCode}">
                                <select name="status" class="form-control">
                                    <option value="" th:text="#{admin.gamification.allStatuses}">Tất cả</option>
                                    <option value="DRAFT">DRAFT</option>
                                    <option value="ACTIVE">ACTIVE</option>
                                    <option value="CLOSED">CLOSED</option>
                                </select>
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="questCampaignTable" data-mobile-responsive="true"></table>
                            <h4 th:text="#{admin.gamification.questRewards}">Reward nhiệm vụ</h4>
                            <form id="questRewardSearchForm" class="form-inline"
                                  onsubmit="reloadQuestRewards(); return false;">
                                <input name="campaignCode" class="form-control"
                                       th:placeholder="#{admin.gamification.questCampaignCode}">
                                <input name="questCode" class="form-control"
                                       th:placeholder="#{admin.gamification.questCode}">
                                <button type="submit" class="btn btn-success" th:text="#{common.query}">Tra cứu</button>
                            </form>
                            <table id="questRewardTable" data-mobile-responsive="true"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:include="include :: footer"></div>
<script th:inline="javascript">
    window.GamificationI18n = {
        connectionError: /*[[#{common.connectionError}]]*/ 'Lỗi kết nối',
        operationSuccess: /*[[#{common.operationSuccess}]]*/ 'Thao tác thành công',
        retryGrant: /*[[#{admin.gamification.retryGrant}]]*/ 'Không xác định được kết quả. Hãy bấm lại để retry đúng yêu cầu cũ.',

<script shiro:hasPermission="novel:gamification:config">window.GamificationPermissions.config = true;</script>
<script shiro:hasPermission="novel:gamification:reward">window.GamificationPermissions.reward = true;</script>
<script shiro:hasPermission="novel:gamification:adjust">window.GamificationPermissions.adjust = true;</script>
<script shiro:hasPermission="novel:gamification:finalize">
    window.GamificationPermissions.finalize = true;
</script>
<script type="text/javascript" src="/js/appjs/novel/gamification/gamification.js"></script>
</body>
</html>
