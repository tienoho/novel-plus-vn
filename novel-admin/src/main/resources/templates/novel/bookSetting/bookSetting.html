<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="col-sm-12">
        <div class="ibox">
            <div class="ibox-body">
                <div class="fixed-table-toolbar">
                    <div class="columns pull-right">
                        <button class="btn btn-success" data-admin-action="reload" th:text="#{common.query}">Tra cứu</button>
                    </div>

                    <form id="searchForm">
                        <div class="columns pull-right col-md-2">
                            <select th:data-placeholder="#{admin.bookSetting.type}" data-placeholder="Loại đề xuất" id="type"
                                    name="type"
                                    class="form-control chosen-select" tabindex="2"
                                    dict-type="book_rec_type">
                            </select>
                        </div>
                    </form>

                </div>
                <table id="exampleTable" data-mobile-responsive="true">
                </table>
            </div>
        </div>
    </div>
</div>
<!-- Shiro kiểm soát khả năng hiển thị nút thao tác trong Bootstrap Table. -->
<div>
    <script type="text/javascript">
        var s_detail_h = 'hidden';
        var s_edit_h = 'hidden';
        var s_remove_h = 'hidden';
    </script>
</div>
<div shiro:hasPermission="test:order:detail">
    <script type="text/javascript">
        s_detail_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookSetting:edit">
    <script type="text/javascript">
        s_edit_h = '';
    </script>
</div>
<div shiro:hasPermission="novel:bookSetting:remove">
    <script type="text/javascript">
        var s_remove_h = '';
    </script>
</div>
<div th:include="include :: footer"></div>
<script type="text/javascript" src="/js/appjs/novel/bookSetting/bookSetting.js"></script>
</body>
</html>
