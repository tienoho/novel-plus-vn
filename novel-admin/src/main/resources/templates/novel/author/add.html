<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                                                                                                                                        <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.userId}+'：'">ID người dùng:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="userId" name="userId"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.inviteCode}+'：'">Mã mời:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="inviteCode" name="inviteCode"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.penName}+'：'">Bút danh:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="penName" name="penName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.phone}+'：'">Số điện thoại:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="telPhone" name="telPhone"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.social}+'：'">Tài khoản QQ hoặc WeChat:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="chatAccount" name="chatAccount"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.email}+'：'">Email:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="email" name="email"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.direction}+'：'">Kênh sáng tác (0: nam, 1: nữ):</label>
                                                                        <div class="col-sm-8">
                                        
                                            <select th:data-placeholder="#{common.select}" data-placeholder="Vui lòng chọn" id="workDirection"
                                                    name="workDirection"
                                                    class="form-control chosen-select" tabindex="2"
                                                    dict-type="work_direction">
                                            </select>
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.joinedAt}+'：'">Thời gian tham gia:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input type="text" class="laydate-icon layer-date form-control"
                                                   id="createTime"
                                                   name="createTime"
                                                   onclick="laydate({istime: true, format: 'YYYY-MM-DD hh:mm:ss'})"
                                                   style="background-color: #fff;" readonly="readonly"/>
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.author.status}+'：'">Trạng thái (0: hoạt động, 1: khóa):</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="status" name="status"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                            <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/novel/author/add.js">
</script>
</body>
</html>
