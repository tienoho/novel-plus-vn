<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include::header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5></h5>
                </div>
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                        <input id="userId" name="userId" type="hidden"> <input
                            id="menuIds" name="menuIds" type="hidden">
                        <input
                                id="permIds" name="permIds" type="hidden">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.role.name}+'：'">Tên vai trò:</label>
                            <div class="col-sm-8">
                                <input id="roleName" name="roleName" class="form-control"
                                       type="text">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.role.remark}+'：'">Ghi chú:</label>
                            <div class="col-sm-8">
                                <input id="remark" name="remark" class="form-control"
                                       type="text">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.role.menuPermission}+'：'">Quyền menu:</label>
                            <div class="col-sm-8">
                                <div id="menuTree"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.role.dataPermission}+'：'">Quyền dữ liệu:</label>
                            <div class="col-sm-8">
                                <div id="dataPermTree"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/system/role/add.js">
</script>
</body>

</html>
