<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                                                                                                                                        <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.name}+'：'">Tên quyền dữ liệu:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="name" name="name"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.table}+'：'">Tên bảng dữ liệu:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="tableName" name="tableName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.module}+'：'">Phân hệ:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="moduleName" name="moduleName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.userAttribute}+'：'">Thuộc tính người dùng dùng để kiểm soát quyền:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="crlAttrName" name="crlAttrName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.tableColumn}+'：'">Cột dữ liệu dùng để kiểm soát quyền:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="crlColumnName" name="crlColumnName"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.code}+'：'">Mã quyền:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="permCode" name="permCode"
                                                   class="form-control"
                                                   type="text">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                            <label class="col-sm-3 control-label" th:text="#{admin.dataPerm.sort}+'：'">Thứ tự:</label>
                                                                        <div class="col-sm-8">
                                                                                    <input id="orderNum" name="orderNum"
                                                   class="form-control"
                                                   type="number">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                        <div class="col-sm-8">
                                        
                                    </div>
                                </div>
                                                                                                                <div class="form-group">
                                                                        <div class="col-sm-8">
                                        
                                    </div>
                                </div>
                                                                            <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/wangEditor/release/wangEditor.js"></script>
<script type="text/javascript" src="/js/appjs/system/dataPerm/add.js">
</script>
</body>
</html>
