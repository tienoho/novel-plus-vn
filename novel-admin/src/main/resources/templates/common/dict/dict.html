<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="col-sm-12">
			<div class="ibox">
				<div class="ibox-body">
					<div class="fixed-table-toolbar">
						<div class="columns pull-left">
							<button shiro:hasPermission="common:dict:add" type="button"
								class="btn  btn-primary" data-admin-action="add">
								<i class="fa fa-plus" aria-hidden="true"></i><span th:text="#{common.add}">Thêm</span>
							</button>
							<button shiro:hasPermission="common:dict:batchRemove"
								type="button" class="btn  btn-danger" data-admin-action="batch-remove">
								<i class="fa fa-trash" aria-hidden="true"></i><span th:text="#{common.deleteAction}">Xóa</span>
							</button>
						</div>
						<div class="columns pull-right">
							<button class="btn btn-success" data-admin-action="reload" th:text="#{common.query}">Tra cứu</button>
						</div>
						<div class="columns pull-right col-md-2">
							<select th:data-placeholder="#{admin.dictionary.selectType}" data-placeholder="Chọn loại" class="form-control chosen-select"
								tabindex="2" style="width: 100%">
								<option value="" th:text="#{admin.dictionary.selectType}">Chọn loại</option>
							</select>
						</div>
					</div>
					<table id="exampleTable" data-mobile-responsive="true">
					</table>
				</div>
			</div>
		</div>
	</div>
	<!-- Shiro kiểm soát khả năng hiển thị nút thao tác trong Bootstrap Table. -->
	<div>
		<script type="text/javascript">
			var s_edit_h = 'hidden';
			var s_remove_h = 'hidden';
			var s_resetPwd_h = 'hidden';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:edit">
		<script type="text/javascript">
			s_edit_h = '';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:remove">
		<script type="text/javascript">
			var s_remove_h = '';
		</script>
	</div>
	<div shiro:hasPermission="common:dict:add">
		<script type="text/javascript">
			var s_add_h = '';
		</script>
	</div>

	</div>
	<div th:include="include :: footer"></div>
	<script type="text/javascript"
		src="/js/appjs/common/dict/dict.js"></script>
</body>
</html>
