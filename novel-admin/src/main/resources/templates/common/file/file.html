<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.file.title}">Novel Plus - Quản lý tệp</title>
    <meta name="keywords" content="">
    <meta name="description" content="">
    <link rel="shortcut icon" href="/favicon.ico">
    <link href="/css/bootstrap.min.css?v=3.3.6" rel="stylesheet">
    <link href="/css/font-awesome.css?v=4.4.0" rel="stylesheet">
    <link href="/css/animate.css" rel="stylesheet">
    <link href="/css/layui.css" rel="stylesheet">
    <link href="/css/style.css?v=4.1.0" rel="stylesheet">
    <link href="/css/common/file-manager.css" rel="stylesheet">
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content" id="file-manager-app"
     th:data-message-first="#{common.pagination.first}"
     th:data-message-previous="#{common.pagination.previous}"
     th:data-message-next="#{common.pagination.next}"
     th:data-message-last="#{common.pagination.last}"
     th:data-message-delete-confirm="#{common.deleteConfirm}"
     th:data-message-confirm="#{common.confirm}"
     th:data-message-cancel="#{common.cancel}"
     th:data-message-copied="#{admin.file.copied}"
     th:data-label-copy="#{admin.file.copy}"
     th:data-label-delete="#{common.deleteAction}">
    <div class="row">
        <div class="col-sm-3">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <div class="file-manager">
                        <button type="button" class="layui-btn" id="test1">
                            <i class="fa fa-cloud"></i><span th:text="#{admin.file.upload}">Tải tệp lên</span>
                        </button>
                        <div class="hr-line-dashed"></div>
                        <ul class="folder-list" style="padding: 0">
                            <li><a href="#files-all" class="file-control hactive aactive" data-file-type=""><i class="fa fa-folder"></i><span th:text="#{admin.file.all}">Tất cả tệp</span></a></li>

                            <li><a href="#files-images" class="file-control hactive" data-file-type="0"><i class="fa fa-folder"></i><span th:text="#{admin.file.images}">Hình ảnh</span></a></li>

                            <li><a href="#files-documents" data-file-type="1" class="file-control hactive"><i class="fa fa-folder"></i><span th:text="#{admin.file.documents}">Tài liệu</span></a>
                            </li>

                            <li><a href="#files-videos" data-file-type="2" class="file-control hactive"><i class="fa fa-folder"></i><span th:text="#{admin.file.videos}">Video</span></a></li>

                            <li><a href="#files-audio" data-file-type="3" class="file-control hactive"><i class="fa fa-folder"></i><span th:text="#{admin.file.music}">Âm thanh</span></a></li>

                            <li><a href="#files-other" data-file-type="99" class="file-control hactive"><i class="fa fa-folder"></i><span th:text="#{admin.file.other}">Khác</span></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-sm-9 animated fadeInRight">
            <div class="row">
                <div class="col-sm-12">
                    <div id="file-list"></div>
                    <div id="incomeNum"></div>
                </div>
            </div>
            <div>
                <ul id="page"></ul>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript dùng chung. -->
<script src="/js/jquery.min.js?v=2.1.4"></script>
<script src="/js/csrf.js"></script>
<script src="/js/bootstrap.min.js?v=3.3.6"></script>
<script src="/js/bootstrap-paginator.min.js"></script>

<script src="/js/content.js?v=1.0.0"></script>
<script src="/js/layui.js"></script>
<script src="/js/plugins/clipboard/clipboard.min.js"></script>
<script src="/js/plugins/layer/layer.min.js"></script>
<script src="/js/common/file-manager.js"></script>
</body>
</html>
