<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="signupForm">
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.tableName}+'：'">Tên bảng:</label>
                            <div class="col-sm-8">
                                <input id="tableName" name="tableName" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.name}+'：'">Tên cột:</label>
                            <div class="col-sm-8">
                                <input id="columnName" name="columnName" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.type}+'：'">Kiểu cột:</label>
                            <div class="col-sm-8">
                                <input id="columnType" name="columnType" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.javaType}+'：'">Kiểu Java ánh xạ:</label>
                            <div class="col-sm-8">
                                <input id="javaType" name="javaType" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.comment}+'：'">Chú thích cột:</label>
                            <div class="col-sm-8">
                                <input id="columnComment" name="columnComment" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.sort}+'：'">Thứ tự cột (tăng dần):</label>
                            <div class="col-sm-8">
                                <input id="columnSort" name="columnSort" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.label}+'：'">Nhãn cột:</label>
                            <div class="col-sm-8">
                                <input id="columnLabel" name="columnLabel" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.displayType.help}+'：'">Kiểu hiển thị: ô nhập, danh sách chọn, số, ngày, vùng văn bản, rich text hoặc tải tệp:</label>
                            <div class="col-sm-8">
                                <input id="pageType" name="pageType" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.required}+'：'">Bắt buộc:</label>
                            <div class="col-sm-8">
                                <input id="isRequired" name="isRequired" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-3 control-label" th:text="#{admin.column.dictType}+'：'">Loại từ điển dùng khi hiển thị danh sách chọn:</label>
                            <div class="col-sm-8">
                                <input id="dictType" name="dictType" class="form-control"
                                       type="text">

                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" th:text="#{common.submit}">Gửi</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript" src="/js/appjs/common/genColumns/add.js">
</script>
</body>
</html>
