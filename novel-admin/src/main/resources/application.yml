server:
  session-timeout: 18000
  #    tomcat:
  #        max-threads: 1000
  #        min-spare-threads: 30
  port: 80
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name:novel-admin}
    distribution:
      percentiles-histogram:
        http.server.requests: true
#    uri-encoding: utf-8
#security:
#  basic:
#    enabled: false
security:
  csp:
    enabled: ${CSP_ENABLED:true}
    # Chỉ chuyển sang true khi verifier không còn inline handler/script thiếu nonce.
    enforce: ${CSP_ENFORCE:true}
  admin-bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  csrf:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  pii:
    encryption-key: ${PII_ENCRYPTION_KEY:disabled}
spring:
  datasource:
    driverClassName: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:absolutepath:${user.dir}/config/shardingsphere-jdbc.yml
  thymeleaf:
    mode: HTML
    cache: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  profiles:
    active: dev
  
  #Kích thước tệp tải lên tối đa (100 MB)
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  main:
    allow-bean-definition-overriding: true

mybatis:
  configuration:
    #Tự ánh xạ cột có dấu gạch dưới sang thuộc tính camelCase của Java
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mybatis/**/*Mapper.xml

logging:
  config: classpath:logback-boot.xml

novel:
  gift-code:
    enabled: ${GIFT_CODE_ENABLED:false}
    hmac-key-id: ${GIFT_CODE_HMAC_KEY_ID:legacy-v1}
    hmac-secret: ${GIFT_CODE_HMAC_SECRET:disabled}
    hmac-verification-keys: ${GIFT_CODE_HMAC_VERIFICATION_KEYS:}
    policy-version: ${GIFT_CODE_POLICY_VERSION:v1}
  reader-subscription:
    # Kích hoạt thủ công là thao tác cấp quyền; luôn để tắt cho đến khi quy trình nội bộ được duyệt.
    activation-enabled: ${READING_SUBSCRIPTION_ADMIN_ACTIVATION_ENABLED:false}
    policy-version: ${READING_TICKET_POLICY_VERSION:v1}
  gamification:
    policy-version: ${GAMIFICATION_POLICY_VERSION:v1}
    zone-id: ${GAMIFICATION_ZONE_ID:Asia/Ho_Chi_Minh}
    event:
      enabled: ${GAMIFICATION_EVENT_ENABLED:false}
      drain-batch-size: ${GAMIFICATION_EVENT_DRAIN_BATCH:200}
      drain-delay-ms: ${GAMIFICATION_EVENT_DRAIN_DELAY_MS:15000}
      max-attempt: ${GAMIFICATION_EVENT_MAX_ATTEMPT:10}
    ticket:
      enabled: ${GAMIFICATION_TICKET_ENABLED:false}
      lot-validity-days: ${GAMIFICATION_TICKET_LOT_DAYS:60}
      grant-on-top-up-enabled: ${GAMIFICATION_TICKET_GRANT_ON_TOPUP:false}
      expiry-cron: ${GAMIFICATION_TICKET_EXPIRY_CRON:0 20 3 * * ?}
      expiry-batch-size: ${GAMIFICATION_TICKET_EXPIRY_BATCH:500}
      max-grant-per-batch: ${GAMIFICATION_TICKET_MAX_GRANT_BATCH:1000}
    vote:
      enabled: ${GAMIFICATION_VOTE_ENABLED:false}
      allow-crawled-books: ${GAMIFICATION_VOTE_ALLOW_CRAWLED:false}
      max-tickets-per-request: ${GAMIFICATION_VOTE_MAX_PER_REQUEST:10}
      max-votes-per-day: ${GAMIFICATION_VOTE_MAX_VOTES_DAY:20}
      max-tickets-per-day: ${GAMIFICATION_VOTE_MAX_TICKETS_DAY:50}
      max-tickets-per-book-per-season: ${GAMIFICATION_VOTE_MAX_PER_BOOK:100}
      max-lots-per-spend: ${GAMIFICATION_VOTE_MAX_LOTS:50}
    quest:
      enabled: ${GAMIFICATION_QUEST_ENABLED:false}
      reply-quest-enabled: ${GAMIFICATION_QUEST_REPLY_ENABLED:false}
      heartbeat-interval-seconds: ${GAMIFICATION_HEARTBEAT_INTERVAL:60}
      heartbeat-max-minutes-per-day: ${GAMIFICATION_HEARTBEAT_MAX_MIN:180}
    realm:
      enabled: ${GAMIFICATION_REALM_ENABLED:false}
      affects-benefits: ${GAMIFICATION_REALM_AFFECTS_BENEFITS:false}
      change-cooldown-hours: ${GAMIFICATION_REALM_COOLDOWN_HOURS:24}
    season:
      enabled: ${GAMIFICATION_SEASON_ENABLED:false}
      close-cron: ${GAMIFICATION_SEASON_CLOSE_CRON:0 5 0 1 * ?}
      close-drain-seconds: ${GAMIFICATION_SEASON_DRAIN_SECONDS:60}
      resume-delay-ms: ${GAMIFICATION_SEASON_RESUME_DELAY_MS:30000}
      auto-finalize: ${GAMIFICATION_SEASON_AUTO_FINALIZE:false}
      review-window-hours: ${GAMIFICATION_SEASON_REVIEW_HOURS:72}
    job:
      lease-seconds: ${GAMIFICATION_JOB_LEASE_SECONDS:300}
      batch-size: ${GAMIFICATION_JOB_BATCH_SIZE:500}
    reward:
      enabled: ${GAMIFICATION_REWARD_ENABLED:false}
      claim-window-days: ${GAMIFICATION_REWARD_CLAIM_WINDOW_DAYS:7}
      release-cron: ${GAMIFICATION_REWARD_RELEASE_CRON:0 40 3 * * ?}
  common:
    i18n:
      enabled: false
    web-advice:
      enabled: false
